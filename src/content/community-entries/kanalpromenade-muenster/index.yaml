title: Kanalpromenade Münster
measure: radfahrstreifen-1
description: >+
  Der Betriebsweg entlang des Dortmund-Ems-Kanals in Münster wird seit 2019 für
  den Rad- und Fußverkehr verbreitert, asphaltiert und adaptiv beleuchtet. Auf
  einer knapp 27 km langen Strecke ist eine attraktive Verbindung von
  Stadtgrenze zu Stadtgrenze realisierbar.


