title: Pop-up Bike-Lane
measure: temporaere-radfahrstreifen
description: In Stuttgart Kaltenta wurden auf einer Länge von ca. 700 m sowohl
  stadtauswärts als auch stadteinwärts ca. 100 Parkplätze entfernt und in einen
  überbreiten Radfahrstreifen umgewandelt der einen zusätzlichen
  Sicherheitstrennstreifen zum fließenden Kfz –Verkehr erhalten hat.
