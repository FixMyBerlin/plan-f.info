title: Gemeinnütziges Projekt zur Fahrradwegpflege
measure: fahrradnetz
description: >+
  Zur Unterhaltung der Radwege und Knotenpunkte werden die Stadt und die mags
  durch ein Team des Volksvereins, bestehend aus Langzeitarbeitslosen,
  unterstützt. Dieses achtet auf Schlaglöcher, lose Pflastersteine, behebt
  Mängel, säubert Schilder, räumt E-Scooter von Radwegen und hilft bei Pannen.


