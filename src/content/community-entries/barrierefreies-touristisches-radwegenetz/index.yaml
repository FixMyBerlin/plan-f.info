title: Barrierefreies touristisches Radwegenetz
measure: touristische-wege-und-freizeitwege
description: >
  Bau eines 80 Kilometer langen, barrierefreien touristischen Radwegenetz. Dafür
  werden auch vorhandene Wege entlang der Deutschen Weinstraße miteinander
  verbunden. Barrierefrei bedeutet abgesenkte Bordsteine, breite Wege,
  Oberflächenanpassungen, Rastplätze und barrierefreie Beschilderung.
