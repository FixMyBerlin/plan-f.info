title: Circulation Plan
measure: reduzierung-des-innerstaedtischen-kfz-verkehrs
description: Der Circulation Plan teilt die Stadt in sechs Sektoren und eine
  große autofreie Zone auf, um zu verhindern, dass Autos unnötigerweise das
  Stadtzentrum durchqueren. Die Zugänglichkeit für den Umweltverbund wird
  verbessert und die Lebensqualität der Bürger\*innen erhöht.
