title: Pop-up Bike-Lane in Stuttgart Kaltental
measure: temporaere-radfahrstreifen
description: Es wurde in einem Abschnitt der Böblinger Straße auf einer Länge
  von ca. 700 m sowohl stadtauswärts als auch stadteinwärts ca. 100 Parkplätze
  entfernt und in einen überbreiten Radfahrstreifen umgewandelt der einen
  zusätzlichen Sicherheitstrennstreifen zum fließenden Kfz –Verkehr erhalten
  hat.
