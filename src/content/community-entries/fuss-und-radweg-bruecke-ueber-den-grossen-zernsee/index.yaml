title: Fuß- und Radweg-Brücke über den Großen Zernsee
measure: fahrradbruecken-und-unterfuehrungen
description: Die neue Fuß- und Fahrradbrücke über den Großen Zernsee bilde eine
  barrierefreie Verbindung zwischen den Städten Potsdam und Werder (Havel) und
  ist ein wichtiger Baustein für die nachhaltige Mobilität im Alltags-,
  Tourismus- und Pendelverkehr.
