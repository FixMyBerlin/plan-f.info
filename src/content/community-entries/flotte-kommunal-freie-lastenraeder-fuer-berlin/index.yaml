title: fLotte kommunal - Freie Lastenräder für Berlin
measure: fahrradverleihsysteme
description: fLotte kommunal ist eine Initiative des ADFC Berlin. Mittlerweile
  sind mehr als 200 kostenlose flotte Lastenräder in allen Bezirken verfügbar,
  von denen inzwischen mehr als die Hälfte im Rahmen des Programms „fLotte
  kommunal“ mit Mitteln des Berliner Senats und der Bezirke bereitgestellt
  werden.
