title: Klimafreundliche Fahrradabstellanlage inklusive Ladestation
measure: information-austausch-und-beteiligung
description: Auf Initiierung des Klimaschutzprojektes "bike&work" des Kreises
  ergab eine Mobilitätsanalyse in der Firma MBO den bedarf einer geeigneten
  Abstellanlage. Mit Hilfe von Azubis entstand eine PV-überdachte Abstellanlage
  mit 6 Möglichkeiten zum Abstellen und Laden von Fahrrädern.
