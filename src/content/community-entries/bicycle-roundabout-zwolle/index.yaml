title: Bicycle-Roundabout Zwolle
measure: sichere-kreuzungen
description: Umbau eines Kreisverkehres um die Sicherheit der Radfahrenden zu
  erhöhen. Eine bauliche Barriere hindert den Autoverkehr daran, um den Kreis
  herumzufahren (nur noch geradeaus und rechts abbiegen möglich).
