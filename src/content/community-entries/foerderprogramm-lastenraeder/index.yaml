title: Förderprogramm Lastenräder
measure: konzepte-und-organisation
description: Das Förderprogramm für Lastenfahrräder wurde vom Rat der Stadt
  Remscheid beschlossen. Gefördert werden serienmäßig hergestellte
  Lastenfahrräder und E-Lastenanhänger für den fahrradgebundenen Lastenverkehr
  sowie Gespanne zum Transport von Gütern oder zum Transport von Kindern und
  Gütern.
