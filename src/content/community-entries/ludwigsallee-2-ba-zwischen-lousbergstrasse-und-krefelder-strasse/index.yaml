title: Ludwigsallee (2. BA) zwischen Lousbergstraße und Krefelder Straße
measure: bauliche-radwege
description: 'Der Radverkehr wird seit dem Umbau neben 2 Kfz-Fahrstreifen im
  Bereich des ehemaligen Längsparkstreifens auf einem 230 m breiten Radweg auf
  Gehwegniveau geführt der auf politischen Beschluss hin nicht mehr in Pflaster-
  sondern in Asphaltbauweise mit roter Epoxidharz-Beschichtung ausgeführt wurde.
  '
