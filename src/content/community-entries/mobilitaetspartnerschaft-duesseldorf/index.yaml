title: Mobilitätspartnerschaft Düsseldorf
measure: information-austausch-und-beteiligung
description: Die Mobilitätspartnerschaft der Landeshauptstadt und der
  Düsseldorfer Wirtschaft hat positive Umwelteffekte durch geringere Emissionen
  zum Ziel. Viele Maßnahmen führen zu handfesten finanziellen Einsparungen für
  Unternehmen, motivieren Beschäftigte und wirken sich günstig auf deren
  Gesundheit aus.
