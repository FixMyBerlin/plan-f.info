title: Fahrradparkhaus
measure: fahrradparken
description: Das Fahrradparkhaus am Bahnhof bietet kostenfrei zugängliche
  Abstellmöglichkeiten und mietbare Fahrradboxen für insgesamt ca. 1000
  Fahrräder. Es gibt Schließfächer mit Lademöglichkeiten für Akkus sowie eine
  Luftpumpstation, eine Werkzeugausstattung und eine WC-Anlage.
