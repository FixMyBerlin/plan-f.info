title: Ausweitung des Bikesharing-Systems SprottenFlotte in der KielRegion
measure: fahrradverleihsysteme
description: Das bestehende Bikesharing-System in Kiel wird im Zeitraum von 2021
  bis Ende 2022 nach Eckernförde, Plön, Preetz und Rendsburg erweitert. Dadurch
  entsteht in einem regionalen Zusammenschluss ein attraktives Angebot, das
  multimodales Verkehrsverhalten für breite Teile der Bevölkerung ermöglicht.
