title: AZWEIO - eine interkommunale Gesellschaft
measure: konzepte-und-organisation
description: 'Unter dem Namen AZWEIO AöR firmiert eine interkommunale
  Gesellschaft. Das A steht für die Stadt Achim und zweimal O steht für die
  Gemeinden Ottersberg und Oyten. AZWEIO ist der regionale Bezug, der sich dann
  auch im Logo der Gesellschaft wiederfindet. '
