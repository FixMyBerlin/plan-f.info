title: Fahrradparken macht Kreuzungen sicherer
measure: fahrradparken
description: 'Mit der Errichtung von Abstellbereichen für Zweiräder direkt am
  Kreuzungsbereich verbessert sich die Situation für alle Verkehrsteilnehmenden
  gleichermaßen. Gleichzeitig wird auf standardisierte Maßnahmen
  zurückgegriffen, welche ohne Tiefbauarbeiten auskommen und das Budget
  schonen. '
