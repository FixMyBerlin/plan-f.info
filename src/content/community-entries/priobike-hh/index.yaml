title: Priobike-HH
measure: fahrradnetz
description: >-
  Der Bedarfsplan Radwege definiert ein landesweites Netz für den Radverkehr.
  Das Land erreicht damit die einheitliche Bewertung von Radwegebaumaßnahmen.

  Bei der Erarbeitung des Netzes und der Priorisierungsmethode wurden
  Herangehensweisen entwickelt, die impulsgebend für andere Länder sein können.
