title: Mobilitätsnetzwerk Ortenau
measure: fahrradverleihsysteme
description: Das Mobilitätsnetzwerk Ortenau ist ein Zusammenschluss in dem
  gemeinsam gemeindeübergreifende Lösungen für nachhaltige Mobilität
  gefunden werden. Es werden Mobilitätsstationen eingerichtet, die den Nutzenden
  den Umstieg vom privaten Pkw auf klimafreundliche Mobilität erleichtern
  sollen.
