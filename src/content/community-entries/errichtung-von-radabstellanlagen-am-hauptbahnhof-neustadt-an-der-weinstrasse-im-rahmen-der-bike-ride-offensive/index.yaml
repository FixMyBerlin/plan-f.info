title: Errichtung von Radabstellanlagen am Hauptbahnhof Neustadt an der
  Weinstraße im Rahmen der Bike + Ride Offensive
measure: fahrradparken
description: Die  Stadt Neustadt an der Weinstraße hat am Hauptbahnhof in
  Kooperation mit der Bike+Ride-Offensive der Bahn und dem
  Bundesumweltministerium eine neue Fahrradabstellanlage errichtet. Eine große
  Doppelstockanlage kostenfrei zur Verfügung.
