description: >
  Der Jungfernstieg ist einer der exponiertesten und bedeutendsten Anlaufpunkte
  Hamburgs. Im Rahmen des Handlungskonzeptes für die Innenstadt ist der
  Boulevard an der Alster durch die weitgehende Herausnahme des motorisierten
  Individualverkehrs noch einmal deutlich aufgewertet worden – als ein
  lebendiger, attraktiver Ort der Begegnung im Zentrum der Stadt. Der autoarme
  Jungfernstieg erhöht durch die Verkehrsberuhigung die Aufenthaltsqualität vor
  Ort deutlich durch weniger Lärm, verbesserte Luftqua\ität und mehr Sicherheit
  für Fußgänger\*innen und Radfahrende.


  Ziel der Planung ist, eine verkehrssichere und attraktive Führung für alle
  Verkehrsteilnehmer\*innen zu schaffen. Fußgänger\*innen sollen möglichst
  einfach die Straße queren können und mögliche Konflikte zum Beispiel zwischen
  Rad- und Busverkehr vermieden werden. Gleichzeitig ist vorgesehen, die
  verkehrsplanerischen Aspekte durch stadtplanerische Elemente zu ergänzen, die
  von einem Büro für Freiraumplanung entwickelt werden. Dadurch wird ein
  weiterer Fokus auf die Erhöhung der Aufenthaltsqualität gesetzt.


  Seit dem 16. Oktober 2020 sind der Jungfernstieg und die nördlichen Abschnitte
  des Neuen Walls und der Straße Große Bleichen (jeweils ab Poststraße) für
  private Kraftfahrzeuge, den sogenannten motorisierten Individualverkehr (MIV),
  gesperrt. Radfahrerende teilen sich die Fahrbahn nur noch mit Bussen, Liefer-
  und Entsorgungsverkehre, Taxen und Mofas. Diese Fahrzeuge dürfen den Bereich
  mit maximal 30 km/h befahren. Liefer- und Entsorgungsverkehre sind zwischen 21
  und 11 Uhr zugelassen. Zudem wurden temporäre Gestaltungselemente installiert.


  In der zweiten Phase wird der Jungfernstieg – voraussichtlich ab 2024 – dann
  endgültig umgebaut.


  Das Vorhaben ist ein Leitprojekt zur Aufwertung der Hamburger Innenstadt und
  geht auf eine gemeinsame Initiative der Behörde für Stadtentwicklung und
  Wohnen (BSW), der Behörde für Verkehr und Mobilitätswende (BVM) und des
  Bezirksamtes Hamburg-Mitte zurück. Ziel ist es, in den kommenden Jahren die
  Anziehungskraft und die Aufenthaltsqualität der Hamburger Innenstadt weiter zu
  steigern. Neben dem Jungfernstieg werden in diesem Zusammenhang weitere
  Projekte umgesetzt.
