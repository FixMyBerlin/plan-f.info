results: >
  Der Jungfernstieg und die nördlichen Abschnitte des Neuen Walls und der Straße
  Große Bleichen (jeweils ab Poststraße) werden für den MIV gesperrt. Der
  autoarme Jungfernstieg erhöht durch die Verkehrsberuhigung die
  Aufenthaltsqualität vor Ort deutlich durch weniger Lärm, verbesserte
  Luftqualität und mehr Sicherheit für Fußgänger\*innen und Radfahrende.


  Die temporären Maßnahmen werden verstetigt und durch bauliche Lösungen
  eindeutiger. Dem Fußverkehr wird weiterer Platz eingeräumt und eine weitere
  Baumreihe ergänzt.
