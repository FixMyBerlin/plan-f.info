description: Im Zuge der Aufhebung der Radwegebenutzungspflicht haben
  Radfahrende die Wahl, den entpflichteten Radweg oder die Fahrbahn zu nutzen.
  Nicht zuletzt aufgrund von Unkenntnis und Gewohnheiten sorgt dies bei vielen
  Verkehrsteilnehmenden für Irritationen. Die weiterhin bestehenden
  Radverkehrsanlagen erwecken bei manchen Autofahrenden den Eindruck, diese
  müssten noch immer vom Radverkehr genutzt werden. Dadurch können Konflikte mit
  Radfahrenden entstehen, die dennoch die Fahrbahn nutzen und von Autofahrenden
  zurechtgewiesen werden. Dies wiederum verschlechtert das subjektive
  Sicherheitsempfinden der Radfahrenden und lässt die Vorteile des Fahrens auf
  der Fahrbahn in den Hintergrund treten. Um diesen Entwicklungen
  entgegenzuwirken, wurde im Juni 2016 in der Landeshauptstadt Mainz die
  Maßnahme der Piktogrammkette umgesetzt. Hierfür wurden in regelmäßigen
  Abständen weiße Fahrradsymbole mit Richtungspfeilen links und rechts auf der
  Fahrbahn aufgebracht. Dabei umfasst das Rad-Piktogramm eine Breite von einem
  Meter und eine Höhe von 1,30 Metern, der ergänzende Pfeil ist einen Meter hoch
  und die Piktogramme wiederholen sich durchschnittlich alle 30 Meter. Weiterhin
  wurde darauf geachtet, dass die Symbole in ausreichendem Abstand zum Bord und
  im Falle von Parkständen zum ruhenden Verkehr aufgebracht werden, um eine
  optimale Führung des Radverkehrs mit Sicherheitsabstand im jeweils rechten
  Seitenbereich anzubieten. Zudem wurden die Symbole in Ein- und Ausfahrten
  zusätzlich ergänzt, um für den einfahrenden Verkehr ein Signal zu setzen.
  Zusätzlich wurden in Kreuzungsbereichen Aufstellflächen für die Radfahrenden
  markiert. Neben einer kleineren Strecke (ca. 450 Meter lang) wurde die
  Pilotmaßnahme auch über eine längere Distanz von fast 2,5 Kilometern
  umgesetzt. Bei der Auswahl dieser Routen wurden Kfz- und Schwerverkehrszahlen
  wie auch frequentierte Radachsen berücksichtigt. Die Umsetzung wird von
  Zählungen begleitet, die die Nutzung vor und nach der Maßnahme eruieren sollen
  (Vergleich 2016/2017). Zusätzlich wird mittels Flyern über die neue Maßnahme
  informiert. Die Piktogrammkette hat zum Ziel, die Konflikte zwischen Rad- und
  Kfz-Verkehr auf der Fahrbahn zu reduzieren und die Radverkehrsführung auf der
  Straße zu verdeutlichen. Es soll das subjektive Sicherheitsgefühl der
  Radfahrenden gestärkt werden, damit diese auch besser von den Vorteilen des
  Fahrbahnfahrens profitieren können. Da sie sich im Blickfeld der Autofahrenden
  befinden, werden sie besser wahrgenommen und Unfälle an Kreuzungen und
  Einmünden reduziert. Ohne Konflikte mit Fußgänger\*innen profitiert der
  Radverkehr von der direkten Wegeführung und auch Abbiegevorgänge sind so ohne
  mehrmaliges Halten an Ampeln schneller möglich. Die Piktogrammkette soll das
  Miteinander im Straßenverkehr verdeutlichen und die gegenseitige
  Rücksichtnahme verstärken.
