description: >
  Das Fahrrad ist für Schüler\*innen ein beliebtes Fortbewegungsmittel, nicht
  nur auf dem Schulweg, sondern auch im Freizeitbereich. Jedoch sind
  erfahrungsgemäß viele Kinder und Jugendliche ohne Licht und/oder ausreichend
  funktionierende Bremsen unterwegs. Insbesondere in den Wintermonaten, wenn es
  morgens auf dem Weg zur Schule noch dunkel ist und die Witterungsbedingungen
  schwierig sind, ist es sinnvoll, dass fachkundige Mechaniker*innen die
  Verkehrssicherheit der Fahrräder der Schüler\*innen überprüfen.


  Aus diesem Grund fördert der Landkreis Neu-Ulm seit dem Jahr 2017 den
  Fahrradwintercheck für Schüler\*innen zu Beginn der dunklen Jahreszeit. Das
  Angebot gilt für alle Mittelschulen, Realschulen und Gymnasien sowie
  berufsbildenden Schulen im Landkreis Neu-Ulm. Die Schulen melden ihre
  Teilnahme bei der Fahrradbeauftragten des Landkreises an. Daraufhin führt ein
  örtliches Fahrradfachgeschäft gemeinsam mit den Schüler*innen
  Fahrradwintercheck an der Schule durch. Die Kosten werden bis zu 500 Euro vom
  Landkreis Neu-Ulm erstattet. 


  Beim gemeinsamen Einsatz mit den Profis an den eigenen Fahrrädern lernen
  Schüler\*innen selbstverantwortlich und fachgerecht an Fahrrädern zu arbeiten.
  Neben dem Sachverstand wird also auch Praxiswissen vermittelt, das
  Schüler*innen dazu motiviert, auch weiterhin dem Rad treu zu bleiben. Mit
  einem frisch gecheckten Fahrrad steigt außerdem die Motivation, das Fahrrad,
  welches sich auch bei Schüler\*innen in der Pandemie als krisensicheres
  Fortbewegungsmittel bewiesen hat, auch bei Herbst- und Winterwetter zu nutzen.
  Einige Schulen haben auch eigene und zum Teil ebenfalls vom Landkreis
  finanzierte Schülerfahrradwerkstätten eingerichtet. Auf diese unkomplizierte,
  jedoch sehr wirksame Weise trägt der Landkreis Neu-Ulm dazu bei, die
  Verkehrssicherheit der Fahrrad fahrenden Schüler\*innen  zu erhöhen, die
  gesunde und klimaverträgliche Mobilität mit dem Fahrrad zu fördern und das
  Bewusstsein bei den zukünftigen Generationen zu stärken. Aufgrund der guten
  Annahme läuft das Projekt bereits seit 2017 fortlaufend. 


  Der Landkreis fördert den Fahrradwintercheck, um die Verkehrssicherheit der
  radfahrenden Schüler\*innen zu erhöhen. Gleichzeitig soll die umwelt- und
  klimafreundliche Mobilität der Kinder und Jugendlichen gesichert werden.
