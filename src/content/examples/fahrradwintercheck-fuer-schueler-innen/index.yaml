results: >-
  An zehn weiterführenden Schulen wurde der Fahrradwintercheck durchgeführt (80
  bis 100 Fahrräder). Kleine Mängel wurden sofort behoben und die
  Verkehrssicherheit der Schüler*innen somit erhöht. 


  Die Resonanz ist sehr gut. Einen Einbruch gab es lediglich im Coronajahr 2020.
  In 2022 gab es einen Anmelderekord. Daher möchte die Verwaltung den
  Wintercheck ausbauen und diese dem nächsten zuständigen Ausschuss zur
  Beschlussfassung vorlegen.
challenges: >
  Das Angebot gab es auch während der Pandemie, allerdings gab es hier weniger
  Anmeldungen. 

  Sonstige Herausforderungen, außer die üblichen Sicherheitsmaßnahmen, gab es
  nicht.
