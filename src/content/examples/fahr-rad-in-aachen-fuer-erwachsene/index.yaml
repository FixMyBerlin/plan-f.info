description: >-
  Die städtische Kampagne „FahrRad in Aachen“ möchte alle Erwachsenen
  unterstützen, ihr eigenes Radfahrverhalten besser einschätzen zu können und
  dazu beitragen, ihr Sicherheitsgefühl im Straßenverkehr zu steigern.


  Das kostenlose Trainingsprogramm ist sowohl für Personen gedacht, die Fahrrad
  fahren können, sich jedoch unsicher fühlen und die Fahrpraxis auffrischen
  möchten und für die, die das Fahrradfahren erlernen möchten. Im Schonraum
  werden zuerst viele Übungen durchgeführt, damit Sie sicherer auf dem Fahrrad
  werden. Die zweitägigen Kurse finden an verschiedenen Terminen statt.

  Außerdem werden Pedelec Grund- und Aufbaukurse sowie Lastenfahrradtrainings
  angeboten.
