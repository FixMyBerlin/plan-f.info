description: >-
  Der Landkreis Göppingen fördert seit vielen Jahren nachhaltige Mobilität und
  vor allem den Radverkehr in Alltag und Freizeit. 2011 erstellte er als einer
  der ersten Landkreise ein Radverkehrskonzept, in dem 850 km
  Radwegeinfrastruktur aufgenommen wurden. Er ist Gründungsmitglied der
  Arbeitsgemeinschaft Fahrrad- und Fußgängerfreundlicher Kommunen (AGFK)
  Baden-Württemberg und wurde 2014 als erster Kreis in Baden-Württemberg als
  „Fahrradfreundlicher Landkreis“ ausgezeichnet.  

  Das Landratsamt hat sowohl die Bürger\*innen als auch die Beschäftigten im
  Blick. Bereits seit 2011 und seitdem kontinuierlich ist das Landratsamt als
  Fahrradfreundlicher Arbeitgeber ausgezeichnet.  
   
  Seit der letzten Zertifizierung im Jahr 2019 steht den Beschäftigten am
  Hauptstandort zusätzlich zum Fahrradpavillon eine Fahrradtiefgarage für ihre
  Räder zur Verfügung. Darüber hinaus gibt es dezentral an allen Eingängen
  Abstellanlagen für die Räder der Beschäftigten und Besucher\*innen. So konnte
  das Stellplatzangebot am Hauptstandort in den vergangenen drei Jahren mehr als
  verdoppelt werden. Ein weiterer Ausbau ist geplant. Am Standort Geislingen ist
  derzeit, im Rahmen der Parkhaussanierung, ein Fahrradabstellraum im Bau. 

  <br>
   
  Weitere Aktivitäten: 

  - Teilnahme STADTRADELN seit 2016 mit einem Landratsamt Göppingen Team 

  - Information zu Veranstaltungen und Aktionen zum Radverkehr über das
  Intranet 

  - Öffentliche Radaktionstage mit Sperrungen der B10 

  - RadKULTUR Förderpaket für die nächsten zwei Jahre zur Förderung der
  Radverkehrskommunikation
