description: >-
  Mit dem Projekt werden Radfahranfängerinnen nach ihrer Teilnahme an den
  Anfängerinnenkursen dabei unterstützt, sicher im Alltagsverkehr zu fahren.
  Außerdem werden Alltagsrouten gezeigt und das Fahren mit Fahrradtaschen,
  -anhängern und Lastenrädern ausprobiert. Dies soll durch einen Aufbaukurs, ein
  Verkehrssicherheitstraining und Radfahren in Teams erreicht werden. 


  Radfahrlotsinnen bilden mit ihrer Radfahranfängerin

  ein Team, machen sich gemeinsam auf den Weg und entdecken

  auch selbst ihre eigene Stadt noch mal aus einem anderen Blickwinkel. Das Ziel
  ist dabei, dass die Anfängerinnen nicht gleich nach den Kursen allein auf der
  Straße unterwegs sind, sondern die Möglichkeit haben, zunächst als Übergang
  mit Unterstützung und Begleitung das Fahrrad zunehmend für alltägliche
  Wegstrecken zu benutzen. Die Teams trafen sich über einen Zeitraum von drei
  Monaten in der Sommerzeit einmal wöchentlich für zirka zwei Stunden. Eine
  Ansprechpartnerin

  stand bei Fragen zur Verfügung.


  Durch die Radfahrkurse für Frauen soll eine Steigerung des Radverkehrsanteils
  erreicht werden, indem die Teilnehmerinnen

  verkehrssicheres Radfahren erlernen. In 2019 haben insgesamt

  sechs Frauen sowohl am Aufbaukurs als auch am Verkehrssicherheitstraining und
  am „Radfahren im Alltag“ teilgenommen. Bei Letzterem hatten die Schülerinnen

  15 Wochen lang die Möglichkeit, zwei Stunden pro Woche mit einer zugeteilten
  Fahrradlotsin Wege des Alltags zusammen

  und nach Wunsch mit Fahrradtaschen und Anhänger zu Übungszwecken zurückzulegen
  und dadurch mehr Sicherheit beim Fahren zu erlangen.


  Die Stadt Offenbach mit ihren beteiligten Partner*innen möchte mit dem Projekt
  nicht nur einen vertiefenden Anschluss an die

  Anfängerinnenkurse bieten, sondern die Teilnehmerinnen auch nach Abschluss der
  Kurse weiterhin zu mehr Sicherheit im Straßenverkehr begleiten. Denn nur so
  kann ein tatsächlicher Mobilitätsumstieg gelingen. Für Frauen, die noch kein
  eigenes Fahrrad haben, wird eng mit Fahrradinitiativen zusammen gearbeitet, um
  auch ihnen den Besitz eines Fahrrads zu ermöglichen.


  Das Projekt musste in den Jahren 2020 und 2021 coronabedingt ausfallen.
  Derzeit arbeitet die Stadt an einem ähnlichen Format, um den Radverkehr in
  Offenbach zu stärken und somit aktiv zum Klimaschutz beizutragen.
