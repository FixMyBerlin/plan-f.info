description: >-
  In Zusammenarbeit mit dem Straßenbauamt Stralsund (SBA) und dem
  Landesförderinstitut entstand eine nachhaltige und sichere Radwegeführung
  durch eine typische Mecklenburger Landschaft. Ökonomisch und ökologisch
  beispielhaft wird die Fahrradstraße ab 2024 ihrer zentralen Funktion noch mehr
  gerecht werden, denn dann  erfolgt auch der Lückenschluss nach Rostock. 


  Von Altheide nach Klockenhagen gab es keine Radwegeverbindung. Entlang der
  stark befahrenen L 21 ist das SBA verkehrssicherungspflichtig und hätte dort
  einen Radweg anlegen müssen, hatte aber noch keinen Grunderwerb dafür
  getätigt. Der Radweg entlang der Landesstraße wäre deutlich teurer geworden,
  hätte einen hohen Grad der Neuversiegelung gebracht und wäre landschaftlich
  weniger reizvoll gewesen. 

  Der „Altheider Weg“ verband im Abstand von ca. 500 Metern zur Landesstraße die
  beiden Ortsteile mit einem geschotterten Weg, der auch von der Landwirtschaft
  genutzt wird und damit nur sehr eingeschränkt Radfahrenden zur Verfügung
  stand. 

  Die Stadt Ribnitz-Damgarten war sehr an einer Lösung interessiert, welche
  Radfahrende direkt zum Denkmalhof in Klockenhagen führt, und das SBA benötigte
  eine Lösung für die Sicherheit der Radfahrenden. Nach Gesprächen zur
  Lösungsfindung zwischen Stadt und SBA fuhren wir gemeinsam zum
  Landesförderinstitut. Mit Mitteln aus dem Europäischen Fonds für regionale
  Entwicklung als Ziffer-6-Radweg wurde die Alternativroute zum
  straßenbegleitenden Radweg entlang der L 21, verlaufend auf dem „Altheider
  Weg“, gefördert, welche den notwendigen landwirtschaftlichen Verkehr
  berücksichtigt. 

  Fördermittelempfänger war das SBA, welches nach Umsetzung der Alternativroute
  entlang der L 21 in diesem Abschnitt keinen Radweg mehr bauen wird. 

  Eigentümer des Weges und verantwortlich für die Umsetzung war die Stadt. Sie
  ist als Baulastträger auch weiterhin verantwortlich für den „Altheider Weg“,
  war aber nicht an den Baukosten beteiligt. Hier haben alle gewonnen. 

  Die Teileinziehung als Fahrradstraße wurde vom Landkreis begleitet. Der
  Landwirt hat die Schlüssel für die Poller. Die Poller verhindern die
  Durchfahrt mit Pkw. 


  Die Fahrradstraße kann durch den Asphaltbelag sowie die Breite zwischen 3 und
  3,5 Metern auch von anderen Verkehrsteilnehmenden auf 2,235 Kilometern
  jahreszeitenunabhängig genutzt werden. 

  Als Ausgleich wurde entlang des "Altheider Weges" eine Windschutzpflanzung in
  eine einheimische Feldhecke umgewandelt. Es wurden 225 verschiedene Sträucher
  gepflanzt und 41 Bäume.
