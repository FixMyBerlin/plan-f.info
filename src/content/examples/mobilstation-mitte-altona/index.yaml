description: >-
  Mitte Altona wurde auf einem ehemaligen Güterbahnhofsgelände am Zentrum des
  Hamburger Bezirks Altona errichtet. Nutzung, Bebauung etc. wurden 2014 in
  einem städtebaulichen Vertrag zwischen den Investor\*innen und der Stadt
  Hamburg festgelegt. Auf ca. 13 Hektar wurden bis Ende 2020 1.600 Wohneinheiten
  fertiggestellt und bezogen. Daneben gibt es Flächen für Gewerbe, für soziale
  Infrastruktur und einen Park. Das Quartier wurde auto-reduziert geplant und
  gebaut mit 0,4 Stellplätzen pro Wohneinheit. Als alternative, nachhaltigere
  Mobilitätsangebote stehen an zwei Carsharing-Stationen bis zu 15 Leihautos
  bereit, StadtRAD Hamburg betreibt zwei Fahrradleihstationen und eine neue
  Buslinie wurde eingerichtet.  


  Ebenfalls im städtebaulichen Vertrag festgelegt wurden die Inhalte und die
  Finanzierung eines Quartiers- und Mobilitätsmanagements, u.a. mit der Aufgabe
  einen Lastenradverleih zu organisieren. Nun können Lastenräder in der
  Mobilstation Mitte Altona und ein elektrischer Anhänger rund um die Uhr
  gebucht und ausgeliehen werden. Da Inklusion ein zentrales Ziel im Quartier
  ist, wurde eine Rikscha angeschafft sowie das Rolli-Rad, ein multifunktionales
  Lastenrad, mit dem auch Menschen im Rollstuhl mitgenommen werden können.
  Rikscha und Rolli-Rad sind die ersten, bzw. einzigen Räder dieser Art in
  Hamburg, die 24/7 ausgeliehen werden können. In der Mobilstation stehen zudem
  Falträder und ein Bollerwagen zur Verfügung und darüber hinaus wird dort eine
  Mobilitätsberatung angeboten. U.a. anhand von Umfragen wird die Zufriedenheit
  der Bewohner\*innen mit dem Angebot ermittelt.
