description: >-
  Das Jelbi-Projekt verknüpft Angebote der BVG in Berlin mit anderen
  Mobilitätsangeboten. An verschiedenen Stationen in Berlin stehen Fahrzeuge
  nach dem Sharing-Prinzip, wie Roller, Fahrräder, Autos oder Scooter, für
  Kunden zur Verfügung. Diese Angebote können über die kostenlose Jelbi-App
  gesehen, gemietet und bezahlt werden. So kann für jeden Weg durch die Stadt
  eine individuell passende Kombination von Verkehrsmitteln gefunden werden - ob
  mit Bahn, Bus, E-Scooter, Leihfahrrad oder Auto.


  Inzwischen gibt es 14 Jelbi Punkte, an zentralen Orte innerhalb der Stadt
  sowie am Stadtrand, an dem die verschiedenen Angebote zusammen treffen sowie
  der Übergang zum ÖPNV gewährleistet ist. Diese Mobility Hubs sind sichtbar im
  öffentlichen Raum integriert. Außerdem gibt es kleinere Jelbi-Punkte, die
  ausschließlich für Zweiräder ausgewiesen sind. Daraus entsteht ein Cluster aus
  festen Orten für Sharing Fahrzeuge, wodurch die Multimodalität erhöht wird.

  Dieses Cluster wird stetig erweitert, damit in Zukunft an immer mehr
  S+U-Bahnhöfen sowie an weiteren Hot Spots einfach auf Roller, Fahrrad und Co.
  umgestiegen werden kann.
