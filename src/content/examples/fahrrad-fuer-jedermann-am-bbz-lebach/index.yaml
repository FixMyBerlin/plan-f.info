description: >-
  Das BBZ Lebach verfügt mittlerweile über 25 schuleigene Mountainbikes.
  Verstärkt wird die Nutzung des Fahrrades als Verkehrsmittel im Alltag durch
  das Fahrradfahren 


  im Klassenverband bei erlebnispädagogischen Aktivitäten, Fahrradfahren im
  Rahmen des Sportunterrichtes sowie die jährliche erfolgreiche Teilnahme beim
  STADTRADELN und Schulradeln als Team.  


  Die Schüler\*innen des BBZ Lebach sollen durch dieses Angebot angeregt werden,
  das Fahrrad als Verkehrsmittel im Alltag mehr einzubeziehen. Zudem gibt es
  eine eigene Fahrradwerkstatt, die in erster Linie Schüler\*innen mit
  Migrationshintergrund zur Verfügung stehen soll. Hier können Reparaturen,
  Instandhaltungs- und Wartungsarbeiten an eigenen Fahrrädern durchgeführt
  werden. Die Schüler\*innen können im fachpraktischen Unterricht und in einer
  „AG Fahrradwerkstatt“ geschult und betreut werden. Das BBZ Lebach verfügt über
  zwei 


  E-Fahrräder als Diensträder. Des Weiteren kommen auch Schüler\*innen sowie
  Kolleg\*innen mit privaten E-Bikes zur Schule. Ein eigenes Lastenrad wird für
  Einkäufe, von der hauswirtschaftlichen Abteilung, Materialtransport zwischen
  den Standorten und als Versorgungsfahrrad bei Klassenausflügen genutzt. 


  Das E-Mountainbike wird für Fahrten zwischen den Standorten, Wechsel von
  Kolleg\*innen während eines Unterrichtstages und sonstige dienstliche Fahrten
  genutzt. Für das gemeinsame Fahrradfahren im Klassenverband wurde zuletzt ein
  Liegetandem angeschafft, damit auch Schüler\*innen mit körperlichen
  Einschränkungen daran teilnehmen können.
