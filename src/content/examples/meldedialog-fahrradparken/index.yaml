description: >
  Bürger\*innen von Aachen konnten digital melden, wo sie im Bezirk Stellplätze
  für ihr Fahrrad benötigen. Die Standorte werden geprüft und wenn möglich neue
  Fahrradbügel umgesetzt. Die Stadt prüft aktuell alle Meldungen und setzt sie,
  wenn möglich, um. 


  Durch die Einbeziehung der Bürger\*innen mit dem Online-Meldedialog
  Fahrradparken, sollen schnell und bedarfsgerecht Orte für neue Abstellanlagen
  identifiziert werden. Schlaue digitale Prozesse verbinden so bessere
  Beteiligung der Bürger*innen mit weniger Arbeit für die Verwaltung. Ziel der
  Stadt ist es, im Rahmen des Radentscheides sichere Parkplätze für Radfahrende
  zu schaffen. Die neuen Fahrradbügel werden vorrangig auf der Fahrbahn
  errichtet, sodass der Ausbau nicht zu Lasten des Fußverkehrs geht.
