description: "In der städtischen Fußgänger\\*innenzone wurden
  Geschwindigkeitsanzeigetafeln für Radfahrende installiert. Damit wird deren
  Tempo gemessen, die in der Zone nur in Schrittgeschwindigkeit unterwegs sein
  dürfen. Durch die digitale Anzeige soll die Wahrnehmung der Geschwindigkeit
  sichtbarer und die gegenseitige Rücksichtnahme gefördert werden. "
