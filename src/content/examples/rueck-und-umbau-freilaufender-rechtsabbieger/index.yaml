description: >
  In der Stadt Köln gibt es ca. 310 signalisierte Knotenpunkte, die mit
  mindestens einem freilaufenden Rechtsabbieger ausgestattet sind. Als
  freilaufende Rechtsabbieger werden Straßenabschnitte an Kreuzungen bezeichnet,
  welche das Umgehen einer Ampel beim Rechtsabbiegen ermöglichen. Ziel dessen
  ist es, dem Kraftfahrzeug-Verkehr ein zügiges Vorwärtskommen zu ermöglichen.
  An mehreren freilaufenden Rechtsabbiegern ist es in der Vergangenheit häufig
  zu Konflikten und Unfällen mit nicht motorisierten Verkehrsteilnehmenden zum
  Teil mit Todesfolge gekommen. Daher hat der Rat der Stadt Köln eine
  Überprüfung, Überplanung und gegebenenfalls den Umbau aller in Köln
  vorhandenen sogenannten freilaufenden Rechtsabbieger beschlossen, um die
  Verkehrssicherheit für Radfahrende zu erhöhen. 


  Zunächst wurde eine Machbarkeitsstudie sowie ein Baukastensystem zur Erhöhung
  der Verkehrssicherheit an freilaufenden Rechtsabbiegern erstellt. Begleitend
  zur Entwicklung der Studie sind von 2019 bis 2022 ca. 35 freilaufende
  Rechtsabbieger unter Anwendung des Baukastensystems umgebaut worden. Diese
  systematische Vorgehensweise zur Beseitigung bestehender Gefahrenstellen an
  allen Knoten mit freilaufenden Rechtsabbiegern ist bisher bundesweit einmalig,
  wie auch die Entwicklung des Baukastensystems. Das Baukastensystem enthält
  eine Vielzahl von Maßnahmen die kurz-, mittel- oder langfristig anwendbar
  sind. Zur Identifizierung geeigneter Elemente aus dem Baukastensystem für
  einzelne freilaufende Rechtsabbieger, wurde eine entsprechende
  Bewertungsmatrix entwickelt, die hilfreich für Planer\*innen sein kann,
  geeignete Maßnahmen für unterschiedliche Rechtsabbieger auszuwählen.
