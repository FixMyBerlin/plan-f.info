description: >-
  Mit der Fahrrad-Schnitzeljagd möchte die Gemeinde Morsbach die Aktion
  STADTRADELN unterstützen und Anreize schaffen, die gefahrenen Kilometer in der
  STADTRADELN-App zu erfassen. Die Fahrrad-Schnitzeljagd motiviert auf
  spielerische Weise zum Radfahren und trägt dazu bei, dass Menschen neue
  Alltagsstrecken entdecken. Sie stärkt die Identifikation mit der eigenen
  Umgebung sowie auch das Radverkehrsnetzwerk vor Ort und bietet einen
  touristischen Mehrwert: Einheimische und Personen aus den umliegenden Kommunen
  können die Region (neu) entdecken. Die Schnitzeljagd spricht somit nicht nur
  Freizeitradfahrende, sondern auch z. B. Pendler\*innen an.


  Für die Erstellung der Route wurde der Radroutenplaner NRW genutzt. Die
  Stationsschilder hat die Kommune selbst gestaltet und auf A3 ausgedruckt sowie
  teilweise laminiert. Die Morsbacher Fahrrad-Schnitzeljagd fand im Zeitraum der
  Aktion STADTRADELN vom 4. bis 24. September 2022 statt. Um an der
  Fahrrad-Schnitzeljagd teilzunehmen, brauchte es lediglich ein verkehrssicheres
  Fahrrad und eine Prise Entdeckerdrang! Die Teilnahme war kostenlos. Die
  Teilnehmer\*innen hatten die Aufgabe, die Stationsschilder entlang der eigens
  angelegten Route zu finden. Die Schilder waren während des gesamten
  Aktionszeitraums angebracht und verrieten nicht nur einen Teil des zu lösenden
  Wortpuzzles, sondern auch den Weg zur nächsten Station. Wer die
  Wortpuzzleteile in die richtige Reihenfolge brachte, erhielt mit etwas
  Geschick das Lösungswort. Unter allen Teilnehmenden wurden am Ende der Aktion
  tolle Preise verlost.


  Die Aktion soll im Jahr 2023 wiederholt werden und wird vielleicht auch den
  ganzen Sommer über verfügbar sein. Eine weitere Idee ist es, sich mit anderen
  Kommunen zusammen zu tun und gemeinsam mehrere Routen zu entwickeln und zu
  bewerben.
goals: |-
  - Komfort und Fahrspaß
  - Mehr Personen fahren Fahrrad
  - Reduktion privater Autoverkehr (sogenannter MIV)
  - Klima- und Umweltschutz
  - Neue Strecken kennenlernen
localChallenges: |-
  - Flächenkonflikte
  - Geteilte Planungszuständigkeiten (Landesgrenze)
  - Topographie
  - Sehr geringer Radverkehrsanteil (unter 5 Prozent)
  - Polyzentrale Struktur/Zersiedelung
  - Demographie (Überalterung)
  - Kaum/keine Angebote ÖPNV
particularities: |-
  - Einsteiger\*innenmaßnahme
  - Temporäre Maßnahme
  - Spezifische Zielgruppe: Pendler\*innen, Tourist\*innen
results: >-
  Über die drei Wochen lief die Veranstaltung gut. Zwischendurch wurden die
  Medien zur Bewerbung der Aktion nochmal bespielt. 

  Am Gewinnspiel haben 35 Personen teilgenommen. Wie viele die Schnitzeljagd
  gemacht/ teilweise gemacht, aber nicht am Gewinnspiel teilgenommen haben,
  können wir leider nicht sagen. Die Rückmeldungen waren alle positiv.
challenges: Der Arbeitsaufwand für die Aktion ist überschaubar. Es können
  Probleme bei der Öffentlichkeitsarbeit auftauchen, wenn die Medien die Aktion
  nicht weit genug verbreiten. Es bestehen jedoch wegen der zeitgleich
  stattfindenden Aktion STADTRADELN Synergieeffekte in der
  Öffentlichkeitsarbeit. Zurückblickend hätte noch mehr Öffentlichkeitsarbeit
  gemacht werden können, damit mehr Personen erreicht werden.
communication: >-
