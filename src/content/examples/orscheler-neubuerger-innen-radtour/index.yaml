description: >
  Neubürger\*innen sind eine interessante Zielgruppe für Radverkehrsmarketing,
  da mit dem Wohnortwechsel automatisch eine Änderung der Mobilitätsmuster
  einhergeht und in diesem Zuge der Umstieg auf das Verkehrsmittel Fahrrad oft
  leichter fällt. Deshalb sollten neu Hinzugezogene das Fahrrad von Anfang an
  als gleichwertige Alternative zum Kfz wahrnehmen. Mit diesen regelmäßigen
  Veranstaltungen möchte die Stadt Oberursel zeigen, welches Potential sie für
  Radfahrende bietet und so natürlich Einfluss nehmen auf das insbesondere
  innerstädtisch genutzte Verkehrsmittel. Zum anderen soll sich Neubürger\*innen
  die Gelegenheit bieten, sich bei einem Gespräch näher kennen zu lernen und
  Kontakte zu knüpfen. Zusätzlich bietet so eine Radtour aber einfach auch eine
  sehr gute Möglichkeit die neue Heimat besser kennen zu lernen. 


  Routenvorschläge für die Neubürger\*innenradtour wurden von der Stadt
  gemeinsam mit dem Allgemeinen Deutschen Fahrradclub (ADFC) entwickelt. In den
  ersten zwei Jahren gab es nur eine Route, danach wurden insgesamt drei Routen
  mit unterschiedlichem Niveau erarbeitet. Eine Stadtführerin hat Informationen
  über die Stadtgeschichte in die Routen eingearbeitet. Seit 2019 wird auch die
  Freiwillige Feuerwehr in die Radtour mit eingebunden und die Teilnehmenden
  lernen die Feuerwache kennen. 


  Die Radtour wird auch während des Stadtradelns durchgeführt, um
  Synergieeffekte zu nutzen.
goals: |
  - Komfort und Fahrspaß
  - Mehr Personen fahren Fahrrad
  - Fahrrad steigt in der Wahrnehmung / Statussymbol
  - Reduktion privater Autoverkehr (sogenannter MIV)
  - Klima- und Umweltschutz
localChallenges: |-
  - Flächenkonflikte
  - Topographie
particularities: |
  - Nachhaltige Ressourcen
  - Inklusive Maßnahme (Erhöhung Zugänge / Gerechtigkeit)
  - Einsteiger\*innenmaßnahme
  - Spezifische Zielgruppe: Neubürger\*innen
results: Die Liebe zum Radfahren wird von klein an gepflegt. Senior*innen und
  Kinder sind öfters unterwegs, wenn es gute und sichere Radverbindungen gibt.
  Viele neu Zugezogene nehmen das Angebot wahr, um die Stadt kennenzulernen.
  Während der Radtour und insbesondere beim gemeinsamen Abschluss werden viele
  Anregungen, Beschwerden und auch Lob an die Stadt getragen. Bisher wurden
  insgesamt acht Touren auf verschiedenen Routen durchgeführt
challenges: 'Aus datenschutztechnischen Gründen können persönliche Einladungen
  nicht fotografiert werden. Einladungen per Brief sind jedoch auf Grund des
  Papierverbrauchs nicht gut für das Klima. Eine Herausforderung ist es, alle
  Menschen in Oberursel mit den Touren zu erreichen. Die Öffentlichkeitsarbeit
  muss diesbezüglich weiter verbessert werden und braucht neue Ideen und Wege. '
communication: 'Neu zugezogene Personen werden zu den Touren direkt per Brief
  eingeladen, alle Interessierten erfahren von den Touren über Social-Media
  sowie Pressemitteilungen. '
funding: '- Eigenmittel: 100 Prozent'
personnelExpenses: Vorbereitung ca. 40 Personenstunden + ein bis zwei Personen
  je 1/2 Arbeitstag (Sonntag) zur Begleitung der Touren
authorities: Abteilung Nachhaltigkeit, Klima-, Umweltschutz und Mobilität
