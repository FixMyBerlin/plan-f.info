description: >-
  Der Landkreis Lüneburg in Niedersachsen wird bauliche Lösungen für eine
  attraktive Gestaltung von Radverkehrswegen im gesamten Landkreis umsetzen.
  Durch den Abbau von Hindernissen baulicher und verkehrsrechtlicher Art und
  bessere Wegweisung sollen Fahrradstrecken im ländlichen Raum flächendeckend
  erschlossen und damit attraktiver werden. Mit dem geförderten Projekt werden
  Forschungsergebnisse der Leuphana Universität Lüneburg in die Praxis
  umgesetzt. 


  Das Projekt will die kommunale Radverkehrsförderung strategisch
  weiterentwickeln und auf eine neue Qualitätsebene heben, genannt
  „Radverkehrsförderung 3.0“. In Verbindung mit der Leuphana Universität
  Lüneburg wird das Vorhaben ein Konzept für diese Entwicklung modellhaft
  umsetzen.  


  Kernelemente: 


  - Schaffung flächendeckender Barrierefreiheit als Überwindung von Hindernissen
  bei der Radnutzung,

  - Analoge und digitale Repräsentation des entstehenden attraktiven Radnetzes
  als Anreiz zum Umstieg vom Pkw, 

  - Anreiz zur Weiterentwicklung digitaler Navigationsapps, im Besonderen der
  realitätsnäheren Neujustierung der Bewertungsalgorithmen und der Ergänzung von
  Bewertungsgrundlagen über Streckendaten in OpenStreetMap.
goals: |-
  - Sicherheit 
  - Komfort und Fahrspaß
  - Fahrrad steigt in der Wahrnehmung / Statussymbol 
  - Reduktion privater Autoverkehr (sogenannter MIV)
  - Barrierefreiheit und Netzdurchlässigkeit für die Nahmobilität 
  - Analoge und digitale Repräsentation der Barrierefreiheit 
  - Übersichtliche, auch digitale, Wegweisung
localChallenges: |-
  - Flächenkonflikte
  - Fehlende Barrierefreiheit und Netzdurchlässigkeit für die Nahmobilität
  - Finanzschwache Kommune
particularities: >-
