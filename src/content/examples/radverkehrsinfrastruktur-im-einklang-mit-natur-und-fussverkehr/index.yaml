description: >-
  Aufbauend auf einer im Mai 2019 durchgeführten Bürger\*innenbeteiligung und
  -befragung zum Fuldaauenradweg, unter dem Motto: „Hier gehe ich! Hierwürde ich
  gerne gehen! Hier kann ich nicht gehen!“ im Rahmen des Integrierten
  Stadtentwicklungskonzepts (ISEK) „Westpark und neue Grünstrukturen“ wurde die
  Umstrukturierung der Radinfrastruktur in der Fuldaaue gestartet. 
   
  Die Fuldaaue ist für den nichtmotorisierten Verkehr schon immer sehr
  attraktiv. Neben den Radfahrende, die u. a. die stark frequentierten
  Hessischen Fernradwege R1, R2 und R3 nutzen, sind auch viele zu Fußgehende,
  oftmals junge Familien, aber auch Inlineskater\*innen und Jogger\*innen auf
  vorhandenen Wegen unterwegs. Die hohe Attraktivität gepaart mit den
  unterschiedlichen Nutzungsgruppen führt zu Konflikten. Die vorhandene
  Wegbreite von ca. drei Meter sowie die abgewinkelte Führung sind weder
  attraktiv für Radfahrende noch verkehrssicher für alle Nutzungsgruppen. Eine
  schmale, vor 25 Jahren errichtete Holzbrücke wird von Radfahrenden und zu
  Fußgehenden gleichzeitig genutzt. Die engen Platzverhältnisse führen dazu,
  dass Fuß- und Radverkehr kollidieren und es zu Verletzungen kommt. Gerade
  Kinder sind besonders gefährdet. 
   
  Die im Landschaftsschutzgebiet „Fulda-Aue“ neu geplante Radinfrastruktur sieht
  einen Gesamtquerschnitt eines getrennten Geh- und Radwegs mit einer Breite
  zwischen sechs und sieben m vor sowie eine neue Fahrradbrücke über die Fulda.
  Diese wird eine direkte und funktionale Anbindung des Stadtteils Neuenberg an
  die Innenstadt ermöglichen. Um den Eingriff in die Ökologie zu minimieren,
  wurde in enger Abstimmung mit den Naturschutzbehörden und -verbänden eine
  filigrane, ressourcensparende Vorlandbrücke auf dünnen Stahlstützen entworfen.
  Die alte Holzbrücke wird zu einer reinen Fußverkehrsbrücke. Die oftmals
  konfliktbehafteten Einmündungen bzw. Zuwegungen werden in Form von Plätzen mit
  Begegnungscharakter gestaltet. Ausgestattet mit einem Leitsystem, das mit dem
  Behindertenbeirat der Stadt Fulda abgestimmt wurde, neuen Bänken,
  Fahrradständern, Wegweisern und weiteren Möblierungselementen, werden diese
  Plätze attraktiver gestaltet, die Wahrnehmung für die Schönheit der Fuldaaue
  fördern, die gegenseitige Rücksichtnahme erhöhen und eine gesteigerte
  Sicherheit für alle Verkehrsteilnehmenden bieten.
