challenges: >-
  Zum Zeitpunkt der Planung und Umsetzung war die Verwaltungsvorschrift zur StVO
  noch nicht aktualisiert und diente daher nicht als verkehrsrechtliche
  Grundlage für die notwendigen Abstimmungen. 
   
  Die unbekannten Verkehrsregeln mussten gut kommuniziert werden.
communication: >-
  Es fand im März 2021 eine Bürger\*innenbeteiligung (aufgrund der Pandemie im
  Online-Format) statt. 

  Die Bewohner des Nauwieser Viertels erhielten einen Flyer mit Informationen zu
  dem Projekt und den Verkehrsregeln. 

  An den Einfahrten in die Fahrradzone wurden Hinweisschilder mit den
  wichtigsten Verkehrsregeln angebracht.
