description: >-
  Mit dem Instrument der Fahrradzone gemäß novellierter StVO bot sich der
  Landeshauptstadt Saarbrücken im Jahr 2020/21 eine hervorragende Gelegenheit,
  das Radverkehrsnetz der Innenstadt gemäß Verkehrsentwicklungsplan (VEP) 2030
  kurzfristig weiterzuentwickeln. Die Größe und die zentrale Lage des Nauwieser
  Viertels machten dabei das Projekt nicht nur für Saarbrücken zu einem
  Pilotprojekt.  
   
  Mit dem Projekt wurden zwei Ziele verknüpft. Zum einen sollte ein zentrales
  Stadtviertel mit sehr hohem Radverkehrspotenzial als Ausgangspunkt für die
  Verkehrswende in Saarbrücken genutzt werden. Zum anderen sollten die neuen
  Verkehrsregeln und die begleitenden baulichen Maßnahmen hinsichtlich ihrer
  Wirkung auf die Nutzung des Fahrrads und seine Akzeptanz als
  gleichberechtigtes Verkehrsmittel analysiert werden, um eine Ausweitung auf
  andere Viertel zu prüfen. 
   
  Das Nauwieser Viertel ist bereits seit geraumer Zeit durch viele gegenläufige
  Einbahnstraßen und Straßenraumeinbauten verkehrsberuhigt. Die überwiegend
  jungen Bewohner\*innen und Besucher\*innen des Viertels können tendenziell als
  fahrradaffin angesehen werden. Die zentrale Lage macht das Viertel zu einem
  „Nukleus“ im Radverkehrsnetz der Stadt, von dem aus sternförmig wichtige
  Radverkehrsachsen ausgehen. 
   
  Für den Kfz-Verkehr ist das Nauwieser Viertel seit Einrichtung der Fahrradzone
  nur noch für Anlieger zugelassen. Zur Verdeutlichung der neuen Situation
  wurden neben der obligatorischen Beschilderung an vielen Einmündungen
  großflächige Piktogramme (3 x 3m), die in ihrer Darstellung dem StVO-Zeichen
  244.3 entsprechen, markiert. Zur Sicherstellung der Kenntnisnahme der neuen
  Verkehrsregeln und deren Akzeptanz wurden an den Einfahrten in die Zone gut
  sichtbare Hinweisschilder mit den wichtigsten Regeln angebracht. Überdies
  wurden mehr als 100 zusätzliche Fahrradstellplätze geschaffen.
