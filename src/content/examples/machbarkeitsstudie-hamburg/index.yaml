description: >-
  Basierend auf eine Potenzialanalyse aus dem Jahr 2017 wurde ein Leitprojekt
  der Metropolregion Hamburg aufgelegt, in dem Machbarkeitsstudien für
  Radschnellwege in neun Korridore erstellt wurden: Sieben gehen in Hamburg in
  das Veloroutennetz über, einer in Lübeck und einer zwischen Wismar und
  Schwerin. In einem Dachprojekt werden die Konkretisierung der baulichen
  Ausgestaltung mit den Ländern Hamburg, Schleswig-Holstein,
  Mecklenburg-Vorpommern und Niedersachsen abgestimmt und erste Strategien zu
  Förderung, Finanzierung und Trägerschaft bereitgestellt. Ein weiteres
  Dachprojekt befasst sich mit der Projektkommunikation. 


  Um Hinweise auf bereits genutzte Wege und vorhandene Barrieren zu erhalten,
  wurde eine zweistufige Bürger\*innenbeteiligung aus einem Online-Verfahren und
  Workshops vor Ort vorgeschaltet. Beide waren auch Anlässe für die
  Projektkommunikation nach außen. Die Rückmeldungen waren sehr konstruktiv und
  haben den Rückhalt in der Region deutlich gestärkt.
goals: |-
  - Sicherheit 
  - Komfort und Fahrspaß 
  - Überwindung weiter Distanzen 
  - Mehr Personen fahren Fahrrad 
  - Reduktion Mobilitätsarmut 
  - Reduktion privater Autoverkehr (sogenannter MIV)
  - Klima- und Umweltschutz
localChallenges: |-
  - Flächenkonflikte 
  - Geteilte Planungszuständigkeiten 
  - Polyzentrale Struktur/Zersiedelung
particularities: |-
  - Beteiligung
  - Interkommunal
  - Spezifische Zielgruppe: Pendler\*innen
results: 'Aufbauend auf die Vorzugstrassen werden Maßnahmensteckbriefe
  ausgearbeitet, die als Grundlage für konkrete Planungen vor Ort herangezogen
  werden können. Auch sie werden mit Fachbehörden und weiteren Betroffenen
  abgestimmt und in der Kommunalpolitik vorgestellt. '
challenges: >-
  Abstimmungsprozess über die Grenzen von vier Bundesländern hinweg 

  - Baulastträgerschaft und Finanzierungsfragen einer „neuen“
  Infrastrukturmaßnahme 

  - Hohe Investitionskosten 

  - Herstellen von Akzeptanz und Ausräumung von Vorbehalten
communication: >-
  Die zweistufige Bürger\*innenbeteiligung aus einem Online-Verfahren und
  Workshops vor Ort wurden als Projektkommunikation nach außen genutzt. 

  Abstimmung mit verschiedenen Akteur\*innen: Stadtentwicklung,
  Verkehrsunternehmen und Verbände wurden beteiligt und in der Kommunalpolitik
  vorgestellt und diskutiert.
