description: >-
  Nachdem bereits einige Pilotaktionen angelaufen sind, war der erste Schritt
  die Gründung einer AG Radverkehrsförderung, Service und Marketing und die
  Erarbeitung eines Kommunikationskonzeptes zur Definition und Umsetzung einer
  Strategie „Offenbacher aufs Rad“. Dieses Konzept bietet einen strategischen
  Rahmen und konkrete Handlungsansätze, wie Menschen zum (vermehrtem) Radfahren
  motiviert werden können, in Abhängigkeit von ihrer momentanen Einstellung zum
  Radfahren. Die AG hat sich jedes Jahr viermal getroffen. 
   
  Zielgruppe für die Radverkehrsförderung sind alle Offenbacher\*innen. Die
  Strategie „Offenbacher aufs Rad“ spricht zunächst Multiplikator\*innen an. Sie
  haben einen besonderen Zugang zu Gruppen und können viele Einwohnende in
  Offenbach erreichen. Dies können z. B. Vereinsvorsitzende sein,
  Politiker\*innen, Arbeitgebende oder Mitarbeitende im Kollegium, Lehrkräfte an
  Schulen. Sie verfügen über ein gutes Netzwerk und können eine
  gesellschaftliche Funktion haben. Auf jeden Fall sorgen sie dafür, dass die
  Wirkung von Maßnahmen multipliziert wird. Die Arbeitsgemeinschaft (AG) hat
  sich jedes Jahr viermal getroffen. 


  Hieraus sind z. B. folgende Aktionen erstanden: 

  Workshop zur Radverkehrsförderung: 

  Als wichtige Beteiligungsform führt die Stadt Offenbach seit 2015 jährlich
  Workshops zur Radverkehrsförderung durch. Jährlich sind es ca. 30
  Teilnehmende. Folgende Themen wurden z. B. erarbeitet und in die Umsetzung
  gebracht: 


  - Freundlichkeitskampagne Offenbach 

  - Weiterentwicklung Stadtradeln 

  - Verbesserungsvorschläge für die Infrastruktur 

  - Radfahrkurse für Frauen 

   
  Kampagne Offenbach fährt fair:  


  Mit einem Foto-Shooting der Team-Kapitän\*innen des Stadtradelns 2014, wurden
  die fotografierten Personen zusätzlich in ihrer Rolle als Multiplikatoren
  gestärkt und zu weiterer Vorbildwirkung motiviert. Die Aktion wurde im Jahr
  2015 in einem Stadtmagazin mit den Porträts und Statements einiger Teams für
  das Stadtradeln ergänzt. Parallel wurden auf öffentlichen Flächen Porträts von
  Multiplikatoren der Kampagne „Offenbach fährt fair“ plakatiert.  
   

  Projektanträge: 

  Ziel des Projektes ist es weitere Unterprojekte durchzuführen. Es wurden zwei
  Projektanträge im Rahmen der Nationalen Klimaschutzinitiative (NKI) beantragt:
  Fahrradabstellanlage (investiv) und Fahrrad-Tandems für Frauen
  (nicht-investiv). 


  Das Besondere an dem Projekt ist, dass es langfristig angelegt ist und in
  enger Kooperation mit den Fahrradexpert\*innen und Fahrradinteressierten in
  Offenbach weiterentwickelt wird. Es wird ferner stets erarbeitet wird welche
  Aktionen mit geringen Mitteln durchgeführt werden kann und ob nicht weitere
  Förderprogramme genutzt werde können.
