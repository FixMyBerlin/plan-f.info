description: >-
  Citywise ist eine mobile App (Android und iOS) für die lokale
  Fahrradcommunity, die zum Teilen von Highlights und Gefahren für Radfahrende
  in der Kommune anregt. Citywise Nutzer\*innen profitieren von dem gesammelten
  Wissen der Community und nutzen es, um die schönsten und sichersten Wege durch
  die Stadt zu finden.  


  Zur Zielgruppe von Citywise zählen Fahrrad-Berufspendler\*innen,
  Gelegenheitsradfahrende und Fahrradtourist\*innen. Teilnehmenden Kommunen
  bietet die App die Möglichkeit, mehr über die Beschaffenheit ihrer
  Fahrradinfrastruktur aus Sicht der Bürger\*innen zu erfahren und diese
  Erkenntnisse in ihre Planung einfließen zu lassen. 


  Citywise legt ein starkes Augenmerk auf die einfache Handhabung: Um einen
  Eintrag in Citywise zu teilen, muss lediglich ein Foto aufgenommen werden und
  dieses einer von fünf Kategorien zugeordnet werden: Citystar (Highlight),
  Gefahrstelle, Stellplatz, Radzubehör, Luftpumpe. Optional kann auch ein
  Erklärungstext hinzugefügt werden.  


  Die bayerische Landeshauptstadt sieht in der App ein gelungenes Angebot für
  ihre Rad fahrenden Bürger\*innen. Bei Citywise steht der Open-Data-Grundsatz
  im Vordergrund: Einträge aus der App werden über eine offene
  Datenschnittstelle dauerhaft kostenfrei zur Verfügung gestellt. So können die
  Verwaltung wie auch die Community die Daten für ihre Analysen verwenden. Die
  App ist so konzipiert, dass Citywise mit geringen Kosten auch auf andere
  Kommunen übertragbar ist.
goals: |-
  - Sicherheit 
  - Komfort und Fahrspaß 
  - Mehr Personen fahren Fahrrad 
  - Fahrrad steigt in der Wahrnehmung / Statussymbol 
  - Reduktion privater Autoverkehr (sogenannter MIV) 
  - Klima- und Umweltschutz 
  - Sonstiges: Radfahrer*innen eine Plattform zur Teilhabe geben
localChallenges: Fehlende Transparenz, welche Maßnahmen von den Radfahrer\*innen
  gewünscht werden
particularities: |-
  Evaluation
  Beteiligung
  Interkommunal
  Quick-Win
  Einsteiger\*innenmaßnahme
results: Über 800 Nutzende, Über 300 geteilte Einträge (Stand Februar 2023).
  Während des Einsatzes in München wurden die Einträge zur weiteren Bearbeitung
  an die Fachbereiche weitergeleitet. Teilnahmeinteresse weiterer Kommunen ist
  vorhanden.
challenges: >-
  - Durchführen von Öffentlichkeitsarbeit zum Vorstellen von Citywise unter den
  Bürger*innen 

  - Auswerten der User-Einträge zur Bewertung von Modernisierungsmaßnahmen an
  der Radinfrastruktur
communication: Bewerbung bei Twitter und Medienkanäle der Stadt
