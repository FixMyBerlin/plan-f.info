results: "Wichtige Alltags- und Freizeitverbindungen im Landkreis Göttingen
  führen über Wirtschaftswege. Gegenseitige Rücksichtnahme ist wichtig, dass
  diese konfliktfrei genutzt werden können. Bereits über 300 Schilder wurden im
  ländlichen Wegenetz von Landwirt\\*innen und Landvolk e.V. installiert.  "
challenges: "Ein Großteil der Wirtschaftswege im Landkreis Göttingen gehört
  nicht den Kommunen selbst, sondern Landwirt\\*innen, die sich in Realverbänden
  wie Feldgemeinden, Feldmarkinteressentenschaften, Forstgenossenschaften, etc.
  organisieren. Radfahrende sind auf diesen Wegen unter Duldung der
  Landwirt\\*innen unterwegs. Daher ist ein gutes Miteinander wichtig, um die
  Interessen von Wegeigentümer\\*innen und Radfahrenden in Einklang zu bringen
  und Konflikte zu vermeiden. Wirtschaftswege sind oftmals drei Meter breit und
  damit genau so breit wie viele moderne Traktoren. Ein häufiges Befahren der
  Bankette durch schwere Fahrzeuge schädigt langfristig die Wege. Daher ist eine
  besondere Rücksichtnahme beider Parteien aufeinander unerlässlich und soll
  durch „Rücksicht macht Wege breit“ gefördert werden, damit Landwirt\\*innen
  und Radfahrende die Wege langfristig gemeinsam nutzen können.  "
communication: 'Das Landvolk Göttingen e.V. hat mit einem Rundbrief und auf
  seiner eigenen Homepage seine Mitglieder über den „Masterplan Zukunftsfähiger
  Radverkehr“ des Landkreises und die gemeinsame Initiative informiert. '
