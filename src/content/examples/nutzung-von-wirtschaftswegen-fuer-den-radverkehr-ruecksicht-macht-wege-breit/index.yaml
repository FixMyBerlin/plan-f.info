description: >-
  Wirtschaftswege können in Niedersachsen nach dem "Niedersächsisches Gesetz
  über den Wald und die Landschaftsordnung" NWaldLG auch tatsächlich öffentliche
  Wege sein. Tatsächlich öffentliche Wege sind dort als private Wege definiert,
  die mit Duldung der Eigentümer\*in vom öffentlichen Verkehr genutzt werden
  können. Die Wirtschaftswege haben eine große Bedeutung für den Radverkehr im
  Landkreis Göttingen. Es gibt bislang nur relativ wenige straßenbegleitende
  Radwege, fast 80% des 1.200 km langen Radroutennetzes im Kreisgebiet führen
  über Wirtschaftswege.  

  Im regelmäßig bis zu zweimal jährlich tagenden Arbeitskreis Radverkehr
  zwischen Landkreis, Kommunen, Wegeeigentümern aus Land- und Forstwirtschaft,
  Landvolk Göttingen und Northeim/Osterode am Harz e.V. , ADFC, Polizei u.a.
  wurde bereits Ende 2019 festgestellt, dass es wichtig wäre, die Kommunikation
  und das Verständnis zwischen den Landwirten mit oft großen Landmaschinen
  einerseits und der zunehmenden Zahl von Radfahrenden auf den Wirtschaftswegen
  rund um die Städte und Ortschaften in Südniedersachsen zu verbessern. Die
  meisten Radfahrenden denken, sie seien auf dem Weg zur Arbeit oder in ihrer
  Freizeit mit Fahrrad und E-Bike auf „öffentlichen Wegen“ unterwegs, während
  die Landwirt\*innen auch abends und an Wochenenden mit riesigen Maschinen auf
  „ihren Wirtschaftswegen“ zur Feldarbeit und Ernte eilen. Aus diesem Grund hat
  der Landkreis Göttingen die Kommunikationskampagne „Rücksicht macht Wege
  breit“ durchgeführt. Diese wirbt für ein genseitiges Verständnis und
  Miteinander und regt zum Nachdenken an. Gemeinsam mit dem Team Radverkehr des
  Landkreises Göttingen und dem Landvolk Göttingen e.V. haben wir aus einer
  früheren Kampagne des Landvolks Göttingen e.V. das Motiv und den Slogan
  „Rücksicht macht Wege breit“ übernommen. Der Landkreis hat die Schilder
  beauftragt und bezahlt und über das Landvolk e.V. an die betroffenen Betriebe
  verteilt. 
   
  Die Landwirt\*innen selbst haben die ca. 300 bestellten Schilder montiert und
  sind mit vielen Radfahrenden ins Gespräch gekommen, um sich gegenseitig auf
  ihre jeweiligen Anliegen aufmerksam zu machen. Der Radverkehr hat auch im
  ländlichen Raum in Corona-Zeiten deutlich zugenommen, sodass diese Kampagne im
  Sommer 2020 genau im richtigen Moment kam.
