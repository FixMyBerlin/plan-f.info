description: >-
  Zahlreiche individuelle und öffentliche Verkehre treffen in großen Gewerbe-
  und Industriestandorten aufeinander. Die äußere wie die innere Erschließung
  solcher Areale ist planerisch vorrangig auf den privaten Autoverkehr, den
  sogenannten motorisierten Individualverkehr ausgelegt. Die Erreichbarkeit mit
  öffentlichen Verkehren ist aufgrund zu weniger oder zu weit entfernter
  Haltepunkte vom eigentlichen Arbeitsplatz oftmals mit Wartezeiten und
  zusätzlichen langen Fußwegen verbunden. Hinzu kommt die starke Überlastung der
  vorhandenen Wege und Systeme zu Zeiten des morgendlichen und abendlichen
  Berufsverkehrs. Das Fahrrad als alltägliches, klimaschonendes Verkehrsmittel
  ist sowohl in der Planung und Konzeption solcher Standorte als auch in den
  Bereichen Ausstattung, Service und Kommunikation bisher wenig in Betracht
  gezogen worden.   


  Da sich Flughäfen durch Erweiterungen und Neuordnungen in ständigem Wandel
  befinden, erschien der Frankfurter Flughafen mit seinen ständigen
  Weiterentwicklungen als Modellraum für das Vorhaben sehr gut geeignet. 


  Das Hauptaugenmerk des Projekts lag auf den Pendler\*innen, die in fahrrad-
  bzw. pedelectauglichen Distanzen zum Flughafen wohnen. Eine während des
  Projekts beauftragte Analyse ergab für das Jahr 2030 bei einer Annahme von
  100.000 Mitarbeiter\*innen am Flughafen ein Potential von rund 9.000
  Radfahrenden pro Tag (bei einem Radius von 15km). Hinzu kommen noch
  Dienstfahrten auf dem fast 23 Quadratkilometer großen Areal des Flughafens
  sowie zu umliegenden Gewerbegebieten, die bequem mit Fahrrad oder Pedelec
  zurückgelegt werden könnten. 


  Für die Konzeption eines ganzheitlichen fahrradfreundlichen Gewerbegebiets
  wurden während des Projekts drei Handlungsfelder bearbeitet, die sich
  gegenseitig bedingen: Kommunikation, fahrradfreundliche (kommunale)
  Infrastruktur und Fahrradförderung im Unternehmen. In jedem der drei
  Handlungsfelder wurden verschiedene Maßnahmen durchgeführt, die
  zusammengenommen die oben genannten Ziele fördern sollten. So wurden
  beispielsweise Fahrradboxen aufgestellt, eine neue Radbrücke gemeinsam mit
  Studierenden geplant, Informationen zum Pendeln mit dem Fahrrad erarbeitet und
  Unternehmen dazu beraten. Detaillierte Informationen zu den Maßnahmen können
  der Abschlussdokumentation entnommen werden.
goals: >-
  - Mehr Personen fahren Fahrrad 

  - Fahrrad steigt in der Wahrnehmung / Statussymbol 

  - Reduktion privater Autoverkehr

  - Mehr Personen nutzen das Rad für den Arbeitsweg oder für Dienstwege 

  - Arbeitgeber*innen fördern den Radverkehr  

  - Verbesserte Wahrnehmung und Förderung des Rades als Verkehrsmittel in
  Gewerbegebieten
localChallenges: |-
  - Polyzentrale Struktur/Zersiedelung 
  - Bannwald um den Flughafen
particularities: |-
  - Evaluation
  - Spezifische Zielgruppe: Pendler\*innen
results: 'Die Fahrradbrücke, für die ein studentischer Design-Wettbewerb
  durchgeführt wurde, wird nun tatsächlich gebaut werden. Damit wird eine
  zentrale Lücke im Radwegenetz am Flughafen geschlossen. Zudem werden weitere
  Maßnahmen, die im Rahmen des Projekts thematisiert wurden, umgesetzt,
  beispielsweise eine verbesserte Querung für Radfahrende am Isenburger Kreisel.
  Der Arbeitskreis Radanbindung Flughafen besteht weiterhin und nutzt die
  Ergebnisse des Förderprojekts. Der Flughafenbetreiber Fraport AG hat sich als
  Bike&Business-Betrieb zertifizieren lassen. Auch weitere Betriebe am Flughafen
  haben sich bei dem Programm angemeldet und sich zertifizieren gelassen.  '
challenges: 'Brandschutz- und Sicherheitsfragen am Flughafen Frankfurt
  (elektrische Fahrradboxen und Pedelec-Akkus)  '
