  regionalen Sub-Partnern beteiligt. Alle vier Subpartner haben sich an der
  Finanzierung des Projekts beteiligt und wurden fachlich in die
  Projektumsetzung eingebunden. Dazu gehörte neben der aktiven Teilnahme an
  regelmäßigen strategischen Projekt- und Arbeitstreffen auch die Zu- und
  Mitarbeit zu und an verschiedenen Projektbausteinen, beispielsweise bei der
  Erarbeitung der Studie „pedelectaugliche Infrastruktur“ oder beim
  Studierendenwettbewerb Fahrradbrücke. '
