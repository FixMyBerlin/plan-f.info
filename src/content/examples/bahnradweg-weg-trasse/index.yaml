description: >-
  Es entsteht eine zentrale Radwegeachse auf einer ehemaligen Bahntrasse, die
  mittelfristig die drei größten Stadteile verbindet. Dadurch werden die
  wichtigsten innerörtlichen Ziele unmittelbar erschlossen: Fernbahnhof,
  Schulen, Gewerbegebiete, Supermärkte, Naherholungsbereiche, Stadtzentrum /
  Fußgänger\*innenzone. Zudem werden die meisten touristischen Radrouten
  miteinander verknüpft. Durch die zentrale Lage und die Anbindung vieler
  wichtiger Ziele hat das Vorhaben eine besondere Bedeutung sowohl für den
  Alltag- als auch für die Freizeit – für Rad- und Fußverkehr. Die Länge des
  gesamten Vorhabens umfasst ca. 6,9 km, davon der erste (mittlere) Abschnitt
  3,1 km (Kernstadt Vaihingen). Der Erweiterungsabschnitt nach Norden zum
  Stadtteil Kleinglattbach hat ca. 2 km und der südliche Abschnitt nach
  Enzweihingen ca. 1,8 km Länge. 


  2013 bis 2015 wurde das Radroutenkonzept für die Gesamtstadt fortgeschrieben.
  2014 wird eine Bürger\*innenbeteiligung durchgeführt. Der „Bahnradweg auf der
  WEG-Trasse“ wurde zum zentralen Baustein im Radroutenkonzept. 


  Der denkmalgeschützte Stadtbahnhof wird aktuell umgebaut zu einem Café,
  Restaurant und Biergarten. Zur Erinnerung an die Bahnstrecke ist ein Teil der
  Gastronomie in alten Bahnwaggons untergebracht. Das Umfeld des Bahnhofes wird
  in den nächsten beiden Jahren weiter aufgewertet werden (Quartiersgrünfläche
  mit Spielplatz, Parkour-Areal), sodass sich für Radfahrende und zu Fußgehende
  ein attraktiver Ziel- bzw. Aufenthaltsbereich ergeben wird.
goals: |-
  - Komfort und Fahrspaß 
  - Überwindung weiter Distanzen 
  - Mehr Personen fahren Fahrrad 
  - Reduktion privater Autoverkehr
localChallenges: Finanzschwache Kommune
particularities: "Spezifische Zielgruppe: Pendler\\*innen, Schüler\\*innen,
  Tourist\\*innen, Einkaufen"
results: 'Es entsteht eine zentrale Radwegeachse welche eine wichtige
  Wegeverbindung zwischen den drei größten Stadteilen schafft und die
  Erreichbarkeit verbessert. Der denkmalgeschützte Stadtbahnhof wurde umgenutzt
  zu einem Café, Restaurant und Biergarten und es entstehen weitere Nutzungen,
  welche die Aufenthaltsqualität verbessern. '
challenges: 'Es mussten drei Brücken saniert bzw. erneuert werden. Besondere
  Anforderungen ergaben sich aus dem Naturschutz und dem Denkmalschutz. Ein Teil
  der Bahnstrecke unterliegt dem Denkmalschutz als Teil einer Sachgesamtheit
  eines Konzentrationslagers. Zur Erinnerung wurde ein kleiner Teil der Gleise
  in das Gestaltungskonzept integriert. Der Artenschutz (insbesondere Eidechsen)
  erforderte umfangreiche Ausgleichsmaßnahmen (z. B. Eidechsenburgen) und
  teilweise auch im Vorfeld entsprechende Vergrämungsmaßnahmen. '
