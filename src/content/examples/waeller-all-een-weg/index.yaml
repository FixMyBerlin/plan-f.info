description: >-
  Klimaneutrale Mobilität soll für alle sein, deshalb haben wir den ersten
  barrierefreien Radweg in Rheinland-Pfalz gebaut. Ob auf dem Fahrrad, Rollstuhl
  oder Kinderwagen, alle von uns sollen die Möglichkeit bekommen, sich frei
  klimaneutral bewegen zu können. Gerade im ländlichen Raum, wo die Radwege eher
  mit Schotterwegen in Verbindung gebracht werden, ist dieser eine tolle
  Möglichkeit, sich aktiv für den Klimaschutz einzusetzen. Unser Wäller
  ALLEen-Weg erstreckt sich über eine Länge von zwölf Kilometern und verbindet
  dabei zwei Verbandsgemeinden und verschiedenste Arbeitgeber\*innen sodass eine
  Alltagstauglichkeit gegeben ist. Spezielle Beschilderungen und
  Rastplatzanlagen laden Menschen mit und ohne Einschränkungen ein, die
  klimaneutrale Fortbewegung fernab vom Pkw-Verkehr zu genießen.  
   
  Bei der Gestaltung wurden unterschiedliche Maßnahmen durchgeführt: Es wurde
  eine „Entschärfung“ steilerer Teilstücke durch genormte Plateaus durchgeführt,
  um Höhenunterschiede barrierefrei auszugleichen und so bergige Regionen
  zugänglich zu machen. Der Weg wurde verbreitert, um zu gewährleisten, dass
  zwei Rollstuhlfahrende bequem aneinander vorbeifahren können. Es wurden
  barrierefreie Sitzgruppen und Ruhebänke entlang des Weges installiert sowie
  Fahrradanlehnbügel und Baumelbänke zur Gelenksentlastung entlang des Weges.
  Eine Sanitärstation wurde errichtet, inklusive Rastplatz, der normgerecht
  gepflastert wurde, um den Zugang so komfortabel möglich zu machen. Zudem gibt
  es geprüfte Toilettenanlagen mit EU-Behindertenschloss, welche einen
  durchgehenden Zugang gewährleisten. Die Verbandsgemeinde hat Wartungsverträge
  über die Sanitäranlage geschlossen. Entlang des gesamten Weges gibt es zudem
  eine spezielle Beschilderung. Durch die umfangreiche barrierefreie Gestaltung
  wurde eine Zertifizierung zum barrierefreien Radweg erreicht.
