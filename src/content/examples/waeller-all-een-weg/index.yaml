results: "Das Ergebnis ist ein schöner, barrierefreier Radweg, der
  Fahrradfahrende, Spaziergänger\\*innen, Rollstuhlfahrende oder Personen mit
  Rollatoren gleichermaßen zum Bespielen einlädt. Mit dieser Maßnahme setzt
  Wallmerod ein Statement im Punkto Gleichbehandlung und Barrierefreiheit im
  Verkehr. Das Ergebnis spricht für sich, so liegt zwischenzeitlich eine Anfrage
  vor, die Herangehensweise und das Ergebnis auf der Internationalen
  Tourismusmesse in Berlin (ITB) vorzustellen. "
challenges: 'Vor allem die topographische Lage des Westerwaldes ist eine starke
  Herausforderung, wenn Barrierefreiheit gewährleisten werden soll. Durch
  Plateaus konnten diese dann „entschärft” werden. Allerdings war hier dann
  Aufklärungsarbeit in der breiten Öffentlichkeit gefragt, da sich der Nutzen
  dieser Plateaus nicht jedem direkt erschlossen hat. Pressearbeit und
  Social-Media (z. B. Filmsequenzen) konnten hier eingesetzt werden. '
communication: 'Social-Media, Pressemitteilungen, Eröffnung mit Stadtradeln '
