description: >-
  Betriebliches Mobilitätsmanagement optimiert die unternehmenseigenen
  Mobilitätsbedarfe und berücksichtigt die verschiedenen Bedürfnisse. Vor knapp
  vier Jahren hat sich die Stadt Osnabrück als öffentliche Arbeitgeberin auf den
  Weg gemacht, entsprechende Maßnahmen für das kommunale Mobilitätsmanagement zu
  planen und umzusetzen. Ein Baustein des betrieblichen Mobilitätsmanagements
  ist die Dienstradflotte.  
   
  Aktuell stehen 16 Pedelecs sowie drei Lastenräder zur Nutzung für
  Dienstfahrten zur Verfügung. Das Angebot wird von den Beschäftigten gut
  angenommen. So gab es im Jahr 2022 insgesamt 1.000 Ausleihen und es wurden
  mehr als 10.500 Kilometer zurückgelegt. In diesem Jahr werden zwei weitere
  Pedelecs und zusätzlich ein Faltrad für Dienstreisen angeschafft. Auch beim
  Osnabrücker ServiceBetrieb (OSB) und beim Eigenbetrieb Immobilien sind
  Pedelecs und Lastenräder im Einsatz. 
   
  Zudem konnten mit finanzieller Unterstützung (100 Prozent Förderung) des
  Landes zur Förderung einer nachhaltigen Mobilität und zur Verbesserung der
  Luftreinhaltung in der Stadt Lastenräder und vier entsprechende
  Lastenradgaragen für den städtischen Fuhrpark angeschafft werden. Diese werden
  vor allem bei der Friedhofsverwaltung, der Stadtreinigung, bei der Feuerwehr
  und in der Stadtbibliothek sowie für die Dienstradflotte eingesetzt. Der
  Unterhalt der Lastenräder wird von der Kommune finanziert. 
   
  Das betriebliche Mobilitätsmanagement ist Teil des Projekts „Mobile Zukunft“.
  Hinter diesem Ende 2016 initiierten Projekt stehen Stadt und Stadtwerke
  Osnabrück. Die Projektpartner\*innen erarbeiten gemeinsam Ideen und Maßnahmen
  zur Entwicklung nachhaltiger Mobilitätskonzepte, der Förderung
  umweltfreundlicher Nahmobilität, der Förderung der E-Mobilität sowie der
  Stärkung des Radverkehrs und der Förderung des ÖPNV.
