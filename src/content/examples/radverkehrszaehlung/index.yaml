description: >-
  Radverkehrszählungen sind ein wichtiges Instrument zur Optimierung und
  Evaluation von Radverkehrsplanungen. Damit dienen die erhobenen Daten der
  zielgerichteten Förderung des Radverkehrs. Seit dem Jahr 2019 führt die Stadt
  Bielefeld temporäre Radverkehrszählungen im gesamten Stadtgebiet mit drei
  mobilen Zählstellen durch. Diese ermöglichen es, die Auswirkungen von
  kurzfristigen Veränderungen im Verkehrsfluss wie zum Beispiel durch Baustellen
  oder Fertigstellungen neuer Radwege quantitativ zu beurteilen. Seit April 2021
  wird darüber hinaus der Radverkehr an fünf Radhauptrouten innerhalb des
  Stadtgebietes dauerhaft erfasst. Im Januar 2022 wurde eine weitere Zählstelle
  am Stadtring in Brackwede in Betrieb genommen. Eine weitere Dauerzählstelle
  erhebt seit der Fertigstellung des Jahnplatzes Anfang September 2022 den
  dortigen Radverkehr und zeigt diesen über ein digitales Display in Echtzeit
  an.  


  Im Jahr 2022 konnten insgesamt knapp drei Millionen Radfahrende erfasst
  werden, über eine Millionen davon am Zählstandort an der
  Artur-Ladebeck-Straße. In der Fahrradstraße Ehlentruper Weg finden aktuell
  Verkehrsversuche statt, für den die dortige Dauerzählstelle relevante
  Erkenntnisse zum dortigen Mobilitätsverhalten liefert.  


  Die Stadt Bielefeld plant die sukzessive Aufstockung der Dauerzählstellen im
  Zuge der Umsetzung von Maßnahmen aus dem Radverkehrskonzept. Die dauerhafte
  Radverkehrszählung erfolgt über in den Boden eingelassene Induktionsschleifen,
  die eine Differenzierung von Radfahrenden und anderen Verkehrsteilnehmenden
  ermöglichen. Ganz- und mehrjährige Zählungen haben gegenüber temporären
  Zählungen den Vorteil, saisonale und wetterbedingte Einflüsse zu erfassen und
  zu beurteilen.
