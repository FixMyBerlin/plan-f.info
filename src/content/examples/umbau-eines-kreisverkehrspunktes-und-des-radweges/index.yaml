description: >-
  Der Radweg von Rielasingen kommend, endet bisher mitten an der Kreisstraße
  K6157. Es gibt hier keine sichere Führung über die stark befahrene
  Kreisstraße, auf der anderen Seite gibt es keine Aufleitung auf den
  bestehenden Radweg. Hier ist eine steile Böschung. Der Radweg stellt aber eine
  wichtige Verbindung zwischen Rielasingen und Überlingen (weiter bis
  Radolfzell) dar. Ziel der Umgestaltung ist eine sichere Führung ohne Umwege
  über die K6157 am Kreisverkehrspunkt mit einer neuen Querungshilfe und einer
  Aufleitung auf den nördlichen Radweg nach Überlingen beziehungsweise Singen. 


  Der kurze Abschnitt des Forstweges (ca. 50 m) wurde zurückgebaut und
  renaturiert. Stattdessen wurde der Radweg nördlich der K6158 von Rielasingen
  kommend weiter geradeaus geführt, indem ein neuer Radweg mit ca. 50 Meter
  direkt auf den Kreisverkehr führt. Über die K6157 am Kreisverkehr führt eine
  neue Querungshilfe. Der bisherige Fahrbahnteiler wurde dementsprechend
  umgebaut. Auf der nördlichen Seite wurde der Radweg über eine Länge von ca. 40
  Meter um ca. 0,5 Meter angehoben, so dass eine flache Aufleitung möglich ist.
  Die Maßnahme wurde gemeinsam mit der Sanierung des Radweges nördlich der K6158
  und der Deckenerneuerung der K6158 im Juli 2022 in Kooperation mit der Stadt
  Singen umgesetzt.
