description: >
  Die Fahrradmitnahme in der Region Hannover war bisher in Bus und Stadtbahn zu
  bestimmten, aber nicht einheitlichen Zeiten erlaubt, in den Eisenbahnen
  jederzeit möglich. 


  Die Fahrradmitnahme birgt sowohl ein Konfliktpotenzial zwischen den Fahrgästen
  als auch Probleme für die Betreiber\*innen. Ziel des Projektes war es, die
  bestehenden Konflikte zu erheben, offensiv zu thematisieren und zu
  entschärfen. Eine Kommunikationsstrategie für mehr Akzeptanz zwischen
  Radfahrenden und Fahrgästen ohne Rad sowie entsprechende
  technisch-betriebliche Optimierungsmöglichkeiten der Fahrradmitnahme sollten
  entwickelt und umgesetzt werden. 


  Aus Literatur- und Internetrecherche, Testfahrten, Beschwerdemanagement- und
  Social-Media-Auswertungen, der Durchführung von Expert\*inneninterviews sowie
  Befragungen von Fahrpersonal, Betriebsleitungen, Lobbygruppen und der
  Auswertung der Infrastruktur in den Fahrzeugen der Großraum Verkehr Hannover
  GmbH (GVH), ergaben sich fünf Handlungsfelder für eine konfliktfreie
  Fahrradmitnahme. Aus diesen Handlungsbedarfen wurden Schlussfolgerungen für
  die Fahrradmitnahme identifiziert, die im Gebiet des GVH umgesetzt werden
  sollen:


  1. Regeln: Es bedarf transparenter Regeln, klarer Kunden-Kommunikation in den
  Fahrzeugen und einer klaren internen Kommunikation.


  2. Verträglichkeit: Es bedarf einer Priorisierung der Nutzenden (Behinderte,
  Kinderwagen etc.), die Kommunikation untereinander soll angeregt werden. Alle
  sollen willkommen sein.


  3. Infrastruktur: Es bedarf für die Mitnahme optimierter Fahrzeuge und
  Haltestellen sowie innen und außen deutlich gekennzeichneter Mehrzweckbereiche
  in ausreichender Größe.


  4. Mitnahmeszenarien: Es bedarf einheitlicher Mitnahmezeiten (GVH)
  beziehungsweise genereller Freigabe der Radmitnahme. Anregung bundesweit
  einheitliche Freigabe.


  5. Kommunikation: Es bedarf eines Kickoff-Workshops, eines internen
  Kommunikationsprozesses, Schulung und Einbindung des Personals sowie eines
  externen Kommunikationskonzepts/Aktionen in der Einführungsphase der
  Veränderungen.
