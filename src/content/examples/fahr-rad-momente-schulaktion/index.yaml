results: "Eine zentrale Erkenntnis bestand darin, dass die Schüler\\*innen
  maßgeblich zu Freizeitzwecken das Fahrrad nutzen, nicht aber für die
  Bewältigung ihrer alltäglichen Wege wie dem Schulweg. So gaben die
  Schüler\\*innen im Rahmen der Fahrrad-Stories an, meist entlang des Rheins
  oder auf angelegten Trails mit dem Fahrrad unterwegs zu sein – Geschichten
  über das Erlebnis Radfahren im Alltag waren seltener zu hören. "
challenges: 'Das gesamte Projekt musste unter den Rahmenbedingungen der Pandemie
  durchgeführt werden, was insbesondere die Planung von Präsenzveranstaltungen
  erschwerte. Durch eine gute Zusammenarbeit aller Beteiligten konnten diese
  Hürden jedoch gemeistert werden. '
