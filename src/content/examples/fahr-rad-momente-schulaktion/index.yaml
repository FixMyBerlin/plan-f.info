description: >-
  Die Schulaktion ist ein Element der Radkommunikationskampagne „FahRADMOMENTE“.
  Die Schulaktion stellt den Baustein dar, der sich explizit an die
  Schüler\*innen richtet. Intention war es die Schüler\*innen für das Radfahren
  im Kontext ihres Schulweges sowie im sonstigen Alltag zu begeistern.  


  Neben Verkehrssicherheitsaspekten wurde ein Schwerpunkt auf das Erlebnis des
  Radfahrens gelegt. So konnten die Schüler\*innen ihre Empfindungen und
  Erfahrung im Kontext des Radfahrens Ausdruck verleihen und die Stadt Bad
  Honnef Erkenntnisse über das Mobilitätsverhalten der Schüler\*innen und
  etwaigen Modifikationsbedarfen erfassen. Des Weiteren wurden andere Projekte
  der Kommunikationskampagne an die Schüler\*innen herangeführt und beworben,
  sodass eine Einbindung über der Schulaktion hinaus stattfand. 


  Die Schulaktion wurde an drei weiterführenden Schulen mit Fünftklässler\*innen
  durchgeführt. Die Veranstaltung beinhaltete vier Elemente. Zunächst konnten
  mittels Fotobox und Smileys den Gefühlen im Kontext Radfahren visuell Ausdruck
  verliehen werden. Anschließend wurden Fahrrad-Storys erzählt, also was die
  Schüler\*innen auf ihrem Schulweg mit dem Fahrrad erleben. Der dritte Schritt
  beinhaltete die Methode der Nutzer\*innenreise, hier „Radfahr-Episode“, die
  den Blick für die subjektiven Perspektiven der Schüler\*innen öffnen sollte.
  Das abschließende Element fungierte als Motivation für die Zukunft. Die
  Schüler\*innen erhielten einen Kalender, auf dem sie jeden Tag stempeln
  konnten, wenn sie Fahrrad gefahren sind, bei Abgabe des Kalenders gab es eine
  Fahrradtrinkflasche.
