description: >-
  Die Stadt Erlangen setzt zahlreiche Maßnahmen um, um ihren Mitarbeitenden
  optimale Möglichkeiten der Fahrradnutzung anzubieten, setzt Anreize und
  leistet Unterstützung, Arbeits- wie auch Dienstwege weitestgehend mit dem
  Fahrrad zu bestreiten. Bei der Zertifizierung zum Fahrradfreundlichen
  Arbeitgeber wurde die Mobilitätsmappe als besonders positiv herausgestellt.
  Diese richtet sich an neues Personal, um dieses vom ersten Arbeitstag an zur
  Nutzung nachhaltiger Mobilitätsmittel anzuregen. Darüber hinaus nimmt die
  Stadt Erlangen an zahlreichen Fahrradevents wie Stadtradeln und „Mit dem Rad
  zur Arbeit“ teil und führt eine stadteigene Fahrradrallye "Rädli" durch,
  welche sich an die gesamte Bevölkerung richtet. Es gibt komfortable
  Abstellanlagen an vielen Stellen, Möglichkeiten sich umzuziehen. Diensträder
  sowie ein Incentive-Programm erleichtern Dienstgänge per Fahrrad.  
   
  Durch die zahlreichen Maßnahmen zur betrieblichen Radverkehrsförderung geht
  die Stadt Erlangen mit gutem Beispiel voran. Die Zertifizierung in Gold ist
  ein wichtiger Schritt, sich als Vorbild zu kommunizieren.
