description: >-
  Vom 28.9.-6.11.2020 sollten mit der App-basierten Fahrradkampagne bike to
  school die Schüler\*innen und das Schulpersonal im Landkreis und in der Stadt
  motiviert werden, ihre Wege zur Schule mit dem Rad zurückzulegen. Die Kampagne
  in der App rief dazu auf, Teams zu bilden und mit dem Rad zur Schule zu
  fahren. Dabei konnten die Teammitglieder unterschiedliche Wege zu Schule
  nutzen. Die mit der App aufgezeichneten Schulradfahrten generierten für das
  Team und die Schule Punkte, die in einem Ranking in der App dargestellt
  wurden. Dabei wurde technisch sichergestellt, dass nur Radfahrten zur Schule
  in die Punkteberechnung einflossen. Punkte-Booster für das Team verbesserten
  die Platzierung: Fuhr das gesamte Team häufig Fahrrad, wurde das mit Boostern
  belohnt. Durch diesen spielerischen Ansatz motivierten eifrige
  Teilnehmer\*innen ihre Teammitglieder zum häufigeren Radfahren. Im Gegensatz
  zu anderen Fahrradkampagnen lag der Fokus nicht auf reinem Kilometersammeln:
  Vor allem regelmäßiges Radfahren wurde belohnt. Damit sollte die (neue)
  Mobilitätsgewohnheit Radfahren gefestigt werden. Jede\*r konnte durch
  regelmäßiges Schulradfahren – unabhängig von der Weglänge – im Ranking
  aufsteigen. Die wöchentlichen Rankings motivierten auch Späteinsteiger*innen. 


  Für die Kampagne wurde ein besonderer Datenschutzprozess entwickelt und
  technisch in der App umgesetzt, der an das Alter der Schüler*innen angepasst
  war und die Freigabe durch die Eltern zur Grundlage hatte. 


  Für die zweite Durchführung vom 19.4.-14.5.2021 wurde die Kampagne für das
  Homeschooling adaptiert, um dem entfallenen Sport-Unterricht mit Bewegung
  entgegenzuwirken: Bis zu fünf Radfahrten pro Tag brachten Punkte ein,
  unabhängig wo diese Radfahrten stattfanden. Die technische Prüfung, ob es sich
  um Schulradfahrten handelte, entfiel. 

  Am Ende der Kampagne erhielten die bestplatzierten Schulen Geldpreise, die sie
  für Anschaffungen für die Schüler\*innen verwenden konnten. Die Geldpreise
  wurden von der Sparkasse Osnabrück und den Kreissparkassen Bersenbrück und
  Melle gesponsert.
