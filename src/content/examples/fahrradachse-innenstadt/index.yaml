description: >-
  Am 1. August 2021 hat die Stadt Neuss einen Verkehrsversuch zur Stärkung des
  Radverkehrs und der Aufenthaltsqualität in der Innenstadt gestartet. Im Rahmen
  des neunmonatigen Verkehrsversuches wurden Straßen in Fahrradstraßen
  umgewandelt sowie ein Teilstück temporär für den Kraftfahrzeugverkehr
  gesperrt. Insbesondere die Sebastianusstraße wurde durch einen Künstler
  umgestaltet und für den Autoverkehr ab 13 Uhr gesperrt. Die bisherigen
  Parkstände wurden zudem reversibel mit Möbeln und Pflanzen umgestaltet.


  Nach Abschluss des Verkehrsversuchs wurde nach Ratsbeschluss am 1. April 2022
  auf der Sebastianusstraße und dem Glockhammer ein verkehrsberuhigter Bereich
  eingerichtet. Die Zufahrt für Kraftfahrzeuge ist Montag bis Freitag zwischen 6
  und 19 Uhr und am Samstag bis 13 Uhr erlaubt. Ein Stellplatz für Menschen mit
  Behinderung, eine Lieferzone und Kurzzeitstellplätze wurden wieder
  eingerichtet. Die vorhandene E-Ladesäule ist derzeit wieder im Betrieb und
  soll langfristig zu einer E-Bike-Ladestation umgewandelt werden. Derzeit
  vorhandene Pflanzkübel und Möblierungen werden zukünftig durch langfristig vor
  Ort bleibende Produkte ersetzt.


  Die Innenstadt-Fahrradachse bleibt Richtung Drususallee weiterhin
  Fahrradstraße und erhält im Sommer 2022 eine begleitende, auffällige
  Markierung. Zur Aufklärung über die bestehenden Verkehrsregeln werden
  gleichzeitig Informationstransparente errichtet.
