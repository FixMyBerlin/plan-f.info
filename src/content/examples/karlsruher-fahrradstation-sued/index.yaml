description: >-
  Im Zuge der Umgestaltungsmaßnahmen am Karlsruher Hauptbahnhof Süd hat die
  Stadt Karlsruhe beschlossen, das ehemalige Parkhaus P3 mit 38 Kfz-Stellplätzen
  in eine Fahrradstation umzugestalten. An der Nordseite des Bahnhofs wird
  bereits seit 2007 eine Fahrradstation durch die Karlsruher Fächer GmbH
  betrieben, deren ständig hohe Auslastung ein weiterer Auslöser für die Planung
  einer neuen Station war. Zusammen mit dem Architekturbüro TAFKAL wurde ein
  Konzept entwickelt, um das Parkhaus schnellstmöglich und unter vertretbarem
  Aufwand sowie unter Weiterverwendung der technischen Infrastruktur des
  Gesamtparkhauses in eine Fahrradstation mit 680 Stellplätzen umzugestalten.
  Die neue Fahrradstation liegt direkt am Südeingang des Bahnhofsgebäudes
  unterhalb der Gleise und ist von der Fußgänger\*innenpassage aus erreichbar,
  die die Empfangshalle mit allen Gleisen verbindet. 

  Das Konzept beruht auf einer markanten signaltechnischen Gestaltung und viel
  Helligkeit zur Vermeidung von Angsträumen. Das Angebot in der neuen Station
  beinhaltet auch Stellplätze für Lastenräder, Räder mit Anhängern und E-Bikes.
  Als besonderen Service für die vielen Ganzjahrespendler\*innen 

  bietet die Fahrradstation Süd einen Servicebereich mit Sitzbänken und
  verschließbare Spinde, die auch das Laden von E-Bike-Akkus ermöglichen. Eine
  Werkstatt mit den wichtigsten Utensilien steht den Nutzenden zur Verfügung.
  Hier kann man kleinere Reparaturen am Rad direkt vor Ort durchführen. Die
  Fahrradstation ist 24 Stunden geöffnet und wird ausschließlich mit Ökostrom
  betrieben. Kund\*innen der bereits bestehenden Nordstation können auch die
  Fahrradstation im Süden nutzen. Aktuelle Tarife sind auf der Webseite der
  Fahrradstation zu finden.
