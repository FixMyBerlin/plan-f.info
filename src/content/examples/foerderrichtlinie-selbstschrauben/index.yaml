description: >-
  Fahrradmobilität ist ein zentraler Bestandteil für eine Verkehrswende hin zu
  einer nachhaltigen Mobilität.


  Die Fähigkeit, selbst ein Fahrrad reparieren zu können, trägt zu einer
  Schonung von Ressourcen bei, schafft eine höhere Identifikation mit dem
  Fahrrad und ermöglicht eine größere Selbständigkeit und Unabhängigkeit der
  Reparierenden.

  Die Sparkassenstiftung Hannover stellt 15.000 Euro für die eigenständige
  Reparatur von Fahrrädern zur Verfügung. Gemeinnützig organisierte
  Fahrradwerkstätten oder Vereine, in denen Räder kostenlos repariert,
  Spendenräder aufbereitet und an Bedürftige vermittelt werden oder die
  Selbsthilfe Angebote zur Verfügung stellen, sollen unter anderen dadurch
  unterstützt werden.  Förderfähig mit bis zu 1.000 Euro sind Maßnahmen, durch
  die eine (angeleitete) Selbstreparatur von Fahrrädern unterstützt wird, wie
  zum Beispiel Werkzeuge, Verbrauchsmaterialien, Reparaturkurse oder die
  Möglichkeit die Selbsthilfe-Öffnungszeiten zu verlängern. Zwar gibt es bereits
  einige solcher engagierter Initiativen, aber Sie können sich oft nicht
  langfristig finanzieren und haben teils auch personelle Kapazitätsengpässe
  aufgrund häufig ehrenamtlich getragener Strukturen – hier kann eine
  Modellförderung zumindest zeitweise unterstützen und entlasten.


  Dadurch können Mobilität, Teilhabe und Klimaschutz insbesondere auch bei
  Menschen, die sich eine teure Reparatur nicht leisten könnten, sichergestellt
  werden. Selbstorganisierte, oftmals ehrenamtlich betriebene Fahrradwerkstätten
  und Reparaturinitiativen werden zudem in ihrer Tätigkeit gestärkt und ihre
  Bekanntheit erhöht. Durch die finanzielle Förderung können sie mehr
  Selbsthilfe-Angebote zur Verfügung stellen. Dadurch tragen sie zu einer
  Ausweitung der lokalen Fahrradmobilität und somit zu einer nachhaltigen
  Mobilität bei.
goals: |
