  - Fahrrad steigt in der Wahrnehmung / Statussymbol
  - Reduktion Mobilitätsarmut
  - Klima- und Umweltschutz
localChallenges: |-
  - Sehr geringer Radverkehrsanteil 
  - Gesellschaftliche Teilhabe
particularities: |-
  - Nachhaltige Ressourcen
  - Inklusive Maßnahme (Erhöhung Zugänge / Gerechtigkeit)
  - Temporäre Maßnahme
  - Spezifische Zielgruppe: Von Armut betroffene Personen
results: Es sind bereits einige Anträge eingegangen – das endgültige Ergebnis
  der Maßnahme ist aber noch offen.
challenges: Selbsthilfe Werkstätten erreichen und zur Teilnahme motivieren – die
  Förderrichtlinie ist daher besonders niedrigschwellig gestaltet.
communication: Zum Start der Förderrichtlinie hat es einen offiziellen
  Pressetermin gegeben – unter anderem mit dem Verkehrsdezernenten der Region
  Hannover. Die Förderrichtlinie ist auf Hannover.de/selbstschrauben zu finden
  und wurde in einigen lokalen Zeitungen veröffentlicht. Die Unterlagen zur
  Förderung können im Internet direkt heruntergeladen werden.
