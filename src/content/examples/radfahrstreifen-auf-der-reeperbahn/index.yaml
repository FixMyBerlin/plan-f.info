description: >-
  Ein temporärer Radfahrstreifen wurde als Pop-Up Radfahrstreifen auf der
  Reeperbahn im Rahmen eines 12-monatigen Verkehrsversuches (November 2022 –
  November 2023) eingerichtet. Damit schließt die neue Infrastruktur direkt an
  die bestehenden Radfahrstreifen auf der Königstraße an und eine Lücke auf der
  wichtigen Verbindungsachse vom Altonaer Bahnhof bis in die Innenstadt.  
   
  Die Einrichtung des Verkehrsversuchs entspricht auch einem Wunsch aus der
  Bezirksversammlung Mitte. Bislang mussten Radfahrende bei Tempo 50 im so
  genannten Mischverkehr auf der Fahrbahn fahren. Die neue Infrastruktur soll
  die Verkehrssicherheit auf der Reeperbahn maßgeblich erhöhen, die bisher ein
  Unfallschwerpunkt war. 
   
  Durch den neuen Radfahrstreifen werden Kfz-, Fuß- und Radverkehr nun räumlich
  und verkehrlich voneinander getrennt, die Einfädelungen in die Nebenfahrbahnen
  sowie die Kreuzungsbereiche und Furten wurden zudem zur besseren Sichtbarkeit
  rot eingefärbt. Die neu eingerichteten Radfahrstreifen sind zwischen 2,48 und
  3,24 Metern breit. Gleichzeitig reduzieren sich auf der Reeperbahn die
  Fahrstreifen für den Kfz-Verkehr von vier auf zwei Spuren, durchgehend mit
  einer Breite von 3,25 Metern, wobei stadteinwärts der Radfahrstreifen
  teilweise für den Linienbusverkehr freigegeben sein wird. 
   
  Die Erreichbarkeit für den Lieferverkehr wird durch drei zusätzliche Ladezonen
  optimiert: Zwei Ladezonen werden stadteinwärts, eine Ladezone (ab der
  Einrichtung des Radfahrstreifens) wird stadtauswärts eingerichtet. Alle
  Kfz-Parkplätze und auch die Abbiegemöglichkeiten auf der Reeperbahn bleiben
  während des Verkehrsversuchs erhalten.
