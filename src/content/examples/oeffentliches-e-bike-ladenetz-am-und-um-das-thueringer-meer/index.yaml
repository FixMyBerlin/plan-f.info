description: >-
  In der Urlaubsregion rund um das Thüringer Meer wurde ein umfangreiches
  öffentliches E-Bike-Ladenetz eingerichtet. Zuvor gab es in der Region bereits
  ein Verleihsystem von E-Pedelecs. Jedoch bringen Tourist\*innen zunehmend
  eigene E-Bikes mit, sodass die Nachfrage nach öffentlichen Lademöglichkeiten
  stetig zugenommen hat. Somit ist das E-Bike-Ladenetz als Folgeprojekt des
  bestehenden Verleihsystems entstanden, welches stetig weiterwächst. In den
  Landkreisen Saale-Orla und Saalfeld-Rudolstadt wurden bislang insgesamt 99
  Ladestationen errichtet, die sich auf 35 Standorte in 20 Städten und Gemeinden
  verteilen. Die Ladepunkte finden sich zum Teil entlang des Saaleradweges –
  etwa in Rosenthal am Rennsteig, Schleiz, Saalburg, Burgk, Saalfeld, Rudolstadt
  oder Uhlstädt-Kirchhasel. Aber auch in den Städten des Orlatals oder an
  anderen touristischen Anziehungspunkten wie Triptis, Pößneck, Ranis, Bad
  Lobenstein, Lehesten oder Plothen. Zu finden sind diese in den Landkreisen
  Saale-Orla und Saalfeld-Rudolstadt. Damit nimmt die Region eine Vorreiterrolle
  in Thüringen und darüber hinaus ein und schafft sowohl für Tourist\*innen als
  auch für Bürger\*innen auf zwei Rädern einen echten Mehrwert. 
   
  Ausgestattet sind die Ladestationen mit einer Vorrichtung zum Anschließen der
  Räder sowie einem abschließbaren Spind, der beispielsweise Platz für einen
  Rucksack und den Fahrradhelm bietet. Zwei Steckdosen ermöglichen das
  gleichzeitige Laden von E-Bike und einem weiteren Gerät, wie dem Handy oder
  der Kamera. Um eine der Ladesäulen mit dem markanten Schriftzug „Thüringer
  Meer“ zu aktivieren, muss man lediglich einen Euro einwerfen – unabhängig von
  der Nutzungsdauer.
