description: >-
  Die Fußgänger\*innenzone in der Kreisstadt Altenkirchen ist seit dem 1. Januar
  2023 für den Radverkehr freigegeben. Entsprechende Beschilderungen sind
  angebracht. Der Radverkehr ist angehalten, im Schritttempo zu fahren. 


  Die Freigabe erfolgt zunächst probeweise begrenzt auf ein Jahr. Für ein gutes
  Wohlfühlen und Miteinander ist sicherlich eine gegenseitige Rücksichtnahme des
  Rad- und Fußverkehrs und Beachtung der Beschilderungen in den entsprechenden
  Zonen unerlässlich.


  Für die Öffnung des Fahrradverkehrs in der Fußgänger\*innenzone der Kreisstadt
  Altenkirchen ist unter anderem ein Fahrradworkshop bereits im Oktober 2021
  vorausgegangen. Es wurde eingehend erörtert, ob der Radverkehr für die
  Fußgänger\*innenzone (Wilhelmstraße) erlaubt werden kann. Es galt eine Lösung
  dahingehend zu finden, die eine gemeinsame Nutzung durch Fuß- und Radverkehr
  vorsieht. Man kam zu dem Ergebnis, die Fußgänger\*innenzone für den Radverkehr
  zu öffnen.
