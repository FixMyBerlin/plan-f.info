description: >-
  Im Projektgebiet von LandEi mobil gibt es seit dem 1. Mai 2019 ein neues
  Ticket, das viel kann und weniger kostet. Das sogenannte EiTicket kostet für
  das gesamte Projektgebiet nur 36 Euro im Monat für alle Fahrten auch über die
  eigene Gemeindegrenze hinweg und kostet damit weniger als die Hälfte des
  bislang preiswertesten Tarifs. Zudem ist es in sechs Gemeinden und Städten
  gültig sowie an Wochenenden im gesamten Netz Minden-Lübbecke.


  Gerade im ländlichen Raum ist das ÖPNV-Angebot deutlich ausgedünnter als in
  Städten. Das EiTicket geht genau auf diese Problematik ein und bietet sogar in
  einem weiteren Angebot, dem EiTicket plus die Möglichkeit, ein Pedelec
  (EiBike) zur Bus- und Bahnnutzung dazu zu bekommen. Für das EiTicket plus
  zahlen die Abonnent\*innen 79,50€ im Monat und können das EiBike im gesamten
  Projektgebiet und zu bestimmten Umlandbahnhöfen beliebig oft nutzen. Fahrten
  außerhalb dieser Nutzungszone kosten lediglich einen Euro pro Tag. So kann das
  Pedelec beispielsweise auch auf Radtouren quer durch Deutschland genutzt
  werden. Diebstahlversicherung der Pedelecs ist im Preis inbegriffen.
