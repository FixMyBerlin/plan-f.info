communication: Um auf die Touren aufmerksam zu machen, wurde zunächst ein
  Corporate Design mit Logo und Schrift erstellt. Das Angebot der E-Bike Touren
  wurde über die Social Media Kanäle des Bezirksamtes und der
  Kooperationspartner\*innen der Tour (nachhaltige Läden, Initiativen und
  Verbände) verbreitet. Plakate wurden im Bezirk aufgehangen und Visit Berlin
  hat die Touren kommuniziert. Auch haben die Märkischen Oderzeitung, die
  Lausitzer Rundschau darüber berichtet und die RBB Abendschau einen Beitrag
  gezeigt.
