description: >-
  Tourist\*innen sowie interessierte Bürger\*innen konnten sich kostenlos für
  eine Tour anmelden. Es wurden Orte, die im Zusammenhang mit Postkolonialismus
  und Nachhaltigkeit im Bezirk stehen, besucht und Wissen vermittelt. Zwei der
  vier Touren wurden explizit für Familien mit Kindern angeboten. E-Fahrräder
  sowie E-Lastenräder für die Kinderbeförderung wurden gestellt. Im Nachgang
  wurde ein Audioguide mit .gpx Tracks erstellt. So kann die Tour z. B. über
  komoot selbst durchgeführt werden.


  Die Touren wurden im Auftrag des Bezirksamts Friedrichshain-Kreuzberg von fair
  spaces für einen gleichberechtigten Zugang zu nachhaltiger Mobilität an vier
  verschiedenen Terminen angeboten. Jeweils acht Erwachsene konnten an der Tour
  teilnehmen. An zwei Touren konnten vier E-Lastenfahrräder genutzt werden damit
  jüngere Kinder teilnehmen konnten. Zu Beginn der Tour gab es eine Einführung
  in die Nutzung der E-Fahrräder. Alle Personen waren somit willkommen, die
  schon länger nicht mehr auf einem Fahrrad gesessen und/oder noch nie ein
  E-Fahrrad genutzt haben.


  Den Teilnehmenden der Tour wurde ein facettenreiches Kreuzberg abseits
  gängiger Reiseführer- Empfehlungen nähergebracht. Postkolonialismus,
  Entwicklungspolitik und Nachhaltigkeit im Bezirk standen im Fokus der Touren:
  So wird auf der Tour z. B. das nach der antirassistischen Aktivistin und
  Dichterin May Ayim unbenannte Ufer, ein Fahrradladen mit fair und nachhaltig
  produzierten Fahrrädern (nachwachsenden Rohstoffen, recyceltem Material) oder
  der mit fairen Steinen gepflasterte Mehringplatz besucht. Zudem wurde auf
  (neue) Radverkehrsanlagen in dem Bezirk gefahren und darauf hingewiesen, wie
  z. B. auf geschützte Radfahrstreifen, einen modalen Filter und Fahrradstraßen.
  Somit konnte, neben der Radförderung, mittels der Touren auch wichtiges Wissen
  vermittelt und die Radverkehrsinfrastruktur bekannt gemacht werden.
