description: >-
  Das Pendeln mit dem Rad attraktiv machen – das ist das gesteckte Ziel von
  PendlerRatD. Bei dem Mobilitäts-Projekt sollen Berufspendler\*innen, die
  täglich mit dem Auto zur Arbeit fahren, einen vereinfachten Einstieg in das
  Pendeln mit Rad oder den öffentlichen Verkehrsmitteln bekommen. Zielgruppe
  sind Unternehmen und Organisationen, die ihre Angestellten beim nachhaltigen
  Pendeln unterstützen möchten.


  Es wird eine Befragung der Mitarbeitenden bei den Projektpartner\*innen aus
  Verwaltung und Industrie zum Mobilitätsverhalten durchgeführt und
  Versuchspersonen für Pilotphasen und App-Tester\*innen rekrutiert. In zwei
  Testphasen werden Pendeldaten der Teilnehmer\*innen erhoben und Funktionen der
  PendlerRatD-App sowie weitere Motivationsfunktionen erprobt. Darüber hinaus
  wurde während den Testphasen vermehrt der Fokus auf die Medienkampagne gelegt.
  Insgesamt 408 freiwillige Testpersonen bekamen für die Dauer der Testphase ein
  Pedelec gestellt und wurden intensiv durch das PendlerRatD-Team betreut. 


  Die während der Testphasen gewonnenen Erkenntnisse fließen in die Entwicklung
  der PendlerRatD-App ein. Die PendlerRatD-App soll die Vorteile des Radpendelns
  hinsichtlich Umwelt, Gesundheit und Kosten bilanzieren und zusätzlich gezielte
  Anreize zum langfristigen Umstieg setzen.


  Weitere Pilotphasen in: Stuttgart, Heilbronn, Neckarsulm, Ludwigshafen am
  Rhein, Neustadt an der Weinstraße, Frankfurt am Main, Forchheim, Augsburg und
  Regensburg
