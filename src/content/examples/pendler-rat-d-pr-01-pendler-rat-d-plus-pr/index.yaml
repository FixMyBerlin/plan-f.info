  - Temporäre Maßnahme
  - Spezifische Zielgruppe: Pendler\*innen
results: >
  An der Mobilitätsbefragung nahmen mehr als 8.000 Arbeitnehmende teil. Fast 60
  Prozent der Befragten gab an, am liebsten mit dem Fahrrad pendeln zu wollen.
  Einmonatige Testphasen (mit insgesamt 624 Testradelnden) ermöglichten den
  Teilnehmenden ohne finanzielle Risiken ihre Erfahrungen beim Fahrradpendeln zu
  sammeln und individuell zu bewerten. Bestehende Hemmnisse bezüglich des
  Pendelns mit dem Rad konnten abgebaut und Umstiegseffekte in Höhe von 85
  Prozent für den Wechsel von motorisiertem Individualverkehr auf das Fahrrad
  erreicht werden. Ferner wurde festgestellt, dass Radfahrende die zufriedensten
  und gesünderen Pendelnde sind sowie gerne Umwege für grünere und sichere
  Strecken in Kauf nehmen. 


  Am Ende der Projektlaufzeit von PendlerRatD steht ein Handlungsleitfaden,
  welcher Informationen und Empfehlungen für Arbeitgeber\*innen und
  Arbeitnehmer*innen zum Wechsel vom motorisierten Verkehr auf nachhaltige
  Mobilitätsangebote aufzeigt.
challenges: Keine, erfordert nur gutes Zeit- und Logistikmanagement sowie ein
  aktives sich engagierendes Partner\*innennetzwerk (beziehungsweise motivierte
  Arbeitgebende)
