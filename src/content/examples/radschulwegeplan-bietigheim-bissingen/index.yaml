description: >-
  Seit 2011 hat die AG Radschulwegplan (AG RSWP) in 67 Sitzungen mit der
  Zielsetzung gearbeitet, die Ellentalgymnasien radfahrerfreundlicher zu machen
  und dabei ansehnliche Verbesserungen erreicht. Daneben gab es zahlreiche
  Info-Veranstaltungen, Klausurtagungen und sonstige Aktivitäten.  

  Der Radschulwegplan der Ellentalgymnasien wurde am 26. März 2012 in der Aula
  der Ellentalgymnasien im Beisein von Verkehrsminister Winfried Hermann
  (Laudator) präsentiert. Es war der 1. Radschulwegplan in Baden-Württemberg. Er
  steht den Eltern und Schüler\*innen der Ellentalgymnasien zur Verfügung und
  wird ständig aktualisiert und im Aussehen verbessert. 

  Auf Basis der Schüler\*innenbefragungen hat die AG RSWP aber nicht nur einen
  Radschulwegplan, sondern auch einen Problemstellenkatalog erstellt. Dieser
  Problemstellenkatalog wurde im August 2012 der Stadtverwaltung übergeben. Nun
  entwickelt die AG RSWP zusammen mit der Stadt Bietigheim-Bissingen Maßnahmen,
  um die festgestellten Problemstellen zu beseitigen (Maßnahmenkatalog). 

  Da sich viele Dinge in der Stadt geändert haben, wurde 2018 von der AG RSWP
  beschlossen, die Radschulwegpläne für alle weiterführenden Schulen zu
  aktualisieren. Hierfür wurden online alle Schüler\*innen befragt, wie sie den
  Weg zur Schule zurücklegen. In einer zweiten Befragung sollten dann
  diejenigen, die mit dem Rad zur Schule kommen, ihren tatsächlichen Weg samt
  Problem- und Gefahrenstellen einzeichnen. 

  Am 9. November 2019 fand ein ganztägiger Workshop  statt. Jede Schule
  zeichnete in einem Team von Freiwilligen die von den Schüler\*innen vorgegeben
  Wege in einen großen Plan ein. 

  Wichtig war uns, dass die tatsächlich gefahrenen Radwege berücksichtigt
  wurden. Im Anschluss wurden die Fahrradwege aller Schulen von städtischer
  Seite zusammengetragen, so dass nun der neue offizielle Radschulwegplan für
  Bietigheim-Bissingen entstanden ist. 

  Neben den Radschulwegplänen konnte die AG RSWP auch eine Verbesserung der
  Abstellmöglichkeiten für Fahrräder erzielen. Die Überdachung und die
  Beleuchtung der Abstellmöglichkeiten wurde erheblich verbessert. Zudem gibt es
  eine Videoüberwachung, ebenso wie eine Service-Station für Fahrräder auf dem
  Schulgelände und einen Schlauchomaten.
