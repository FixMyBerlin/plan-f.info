description: >-
  Im Jahr 2019 wurde das Bürger\*innenbegehren „Radentscheid“ durch die Stadt
  Aachen angenommen mit dem Zielhorizont dieses bis 2027 umzusetzen. 


  Ziel der Maßnahme „Kommunikation rund um den Radentscheid Aachen“ ist die
  Kommunikation zu aktuellen Meilensteinen, Herausforderungen und zur
  Zielerreichung als permanenter Baustein der Umsetzung des Radentscheides. Die
  Kommunikation findet fortlaufend auf verschiedenen Ebenen statt und richtet
  sich an das Team Radentscheid, die Politik, die Verwaltung, die gesamte
  Bürger\*innenschaft, sowie sonstige Interessensgruppen. 


  Zwischen der Stadt und dem Team Radentscheid findet ein regelmäßiger,
  vertraulicher Austausch auf Arbeitsebene statt. Jährlich erfolgt die
  Erstellung eines Tätigkeitsberichts, welche die Zielerreichung dokumentiert
  und aktuelle Projekte beschreibt.

  Im Jahr 2021 wurde zusätzlich ein begleitendes, zwölfminütiges Video
  produziert, welches die Verwaltungsarbeit zur Umsetzung Radentscheids im Jahr
  2021 erklärt, in einer 25-minütigen Langversion werden die Prozesse noch
  detaillierter erklärt. 


  Auf der Jahresveranstaltung Radentscheid wird die Arbeit der Verwaltung zur
  Umsetzung des Radentscheids vorgestellt. Die Verwaltung zieht Bilanz über das
  Gesamtjahr. Es werden Zahlen, Daten und Fakten (Zielerreichung) präsentiert
  und Meilensteine des vergangenen Jahres vorgestellt. Es gibt Arbeitsgruppen zu
  ausgewählten, aktuellen Themen und die Möglichkeit zum Dialog zwischen
  Verwaltung, Team Radentscheid und Bürger\*innenschaft. Es handelte sich –
  pandemiebedingt in den Jahren 2020 und 2021 – um eine hybride, mehrstündige
  Veranstaltung ohne Publikum vor Ort unter Nutzung unterschiedlicher Formate.
  Im Jahr 2023 wird die Veranstaltung erstmals in Präsenz mit Publikum
  stattfinden können. 


  Um die Zielerreichung des Radentscheids bei allen städtischen Maßnahmen zu
  berücksichtigen, erfolgt auch innerhalb der Verwaltung eine Kommunikation.
  Somit wird sichergestellt, dass der Radentscheid in alle Prozesse mit
  einbezogen wird.
