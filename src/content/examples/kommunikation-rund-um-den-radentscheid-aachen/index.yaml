results: Die Umsetzung des Radentscheids erfordert, den Straßenraum grundlegend
  neu aufzuteilen. Dieser Transformationsprozess kann nur gelingen, wenn die
  gesamte Stadtgesellschaft beteiligt wird. Förderung des Radentscheids darf
  nicht zu Lasten der anderen Beteiligten des Umweltverbundes geschehen, weshalb
  ein umfassender Kommunikationsprozess nötig ist.
challenges: Bis eine personelle Stelle für diese Aufgaben besetzt war (10/2021),
  mussten die Aufgaben von anderen Kolleg\*innen im laufenden Tagesgeschäft
  miterledigt werden. Die Corona-Pandemie erforderte zudem eine veränderte
  Kommunikation. Es wurden digitale Dialogformate eingeführt.
