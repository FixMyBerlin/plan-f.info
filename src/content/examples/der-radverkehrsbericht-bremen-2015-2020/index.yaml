description: >-
  Der Kern des Berichts bildet die Aufbereitung und Darstellung der
  Radverkehrsdaten der letzten fünf Jahre. 


  Es werden Daten zur Fahrradnutzung und -besitz, Sicherheit im Radverkehr, zur
  Infrastruktur aber auch zu Service, Radtourismus und kommunalem
  Mobilitätsmanagement dargestellt. Auch werden „Maßnahmen und Projekte“, teils
  umgesetzte, teils in Planung befindliche vorgestellt. Dies sind einerseits
  „weiche“, d. h. nicht investive Maßnahmen. wie z. B. da Projekt BIKE IT! der
  Wirtschaftsförderung Bremen vorgestellt. Zum Ende wird ein Fazit gezogen, wo
  Bremen als Fahrradstadt steht.  


  Somit stellt der Bericht die Aktivitäten und Erfolge der Radverkehrsförderung
  dar, zeigt aber auch Handlungsbedarfe auf. 


  Hintergrund des Berichtes: 


  In Bremen waren bereits viele Daten zum Radverkehr vorhanden, diese sind aber
  nicht zentral verfügbar oder aufbereitet. Einige Daten werden bisher nicht
  kontinuierlich erfasst. Gerade in einer Großstadt wie Bremen sind viele
  Akteure mit der Radverkehrsförderung befasst.  


  Zukunft: 

  Perspektivisch soll er kontinuierlich fortgeschrieben werden, um die
  Entwicklungen abzubilden.
