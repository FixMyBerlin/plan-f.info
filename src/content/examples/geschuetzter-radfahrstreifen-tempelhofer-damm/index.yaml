description: >-
  In dem Berliner Bezirk Tempelhof-Schöneberg wurde eine durchgängige
  Radverkehrsanlage auf einer Hauptachse ohne grundhaften Umbau geschaffen. Der
  Parkstreifen ist dazu in eine zwei Meter breite, geschützte Radspur
  umgewandelt worden. Auf einer Strecke von rund drei Kilometern wurden ca. 530
  Poller sowie zahlreiche sogenannte Leitboys verbaut, welche die Radfahrenden
  vor dem Kfz-Verkehr schützen und regelwidriges Parken verhindern sollen. Für
  den Lieferverkehr gibt es auf der mittleren Fahrspur Lieferzonen. Das
  funktioniert sehr gut, da diese nicht zugeparkt werden. 


  Es gab viele Beteiligungswerkstätten und Planungsrunden auch mit der
  Senatsverwaltung, allerdings zunächst nur für den Tempelhofer Damm. Durch den
  Prozess wurde viel gelernt, so dass die weiteren Maßnahmen viel schneller
  umgesetzt werden können. Das Konzept des Tempelhofer Damms wurde dann - mit
  Beschluss des Radverkehrsplans in Berlin - auch auf den südlich anschließenden
  Mariendorfer Damm erweitert. Insgesamt werden zweimal drei Kilometer
  durchgehende Radverkehrsanlagen geschaffen. Diese wird schon jetzt stark
  genutzt.
