results: "Die Entscheidung zur Kombination von Ausstellung als Rahmen und
  Bürger*innenbeteiligung als Anreiz zum Besuch der Ausstellung wird als
  gelungen bewertet. Dies war zum Zeitpunkt der Antragstellung noch nicht so
  vorgesehen, erwies sich aber als effektive Öffentlichkeitsarbeit. Als
  Verbesserung wird eine Ausstellung mit interaktiven Elementen gesehen. Ziel
  war es, vor allem die Laufkundschaft und Besucher\\*innen des Rathauses im
  Vorbeigehen zu einem Blick zu motivieren. Hierfür würden sich gegebenenfalls
  interaktivere Ausstellungselemente besser eignen. "
