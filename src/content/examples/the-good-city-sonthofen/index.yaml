description: >-
  Die Ausstellung „THE GOOD CITY“ SONTHOFEN lief von Juni bis zum Ende des
  Jahres 2018 im Foyer des Rathauses parallel zur Erstellung des
  Radverkehrskonzeptes für die Stadt Sonthofen. 


  Das Projekt sollte zeigen, dass kleine Städte genauso oder insbesondere zu
  Radstädten werden können und dafür auch auf die Erkenntnisse aus großen
  Städten mit jahrzehntelanger Erfahrung in erfolgreicher Fahrradkultur
  zurückgreifen können. 


  Darüber hinaus sind die Voraussetzungen von kleinen Städten gegenüber großen
  Städten oftmals besser aufgrund kurzer Wege zu allen städtischen Funktionen
  wie Handel, Dienstleistung, Kultur, Arbeitsstätten in gleichzeitig weniger
  verdichteten Stadt- und Verkehrsinfrastrukturen. 


  Anhand der Ausstellung sollten alle Bürger*innen Sonthofens inspiriert und
  motiviert werden, Sonthofen auf dem Weg zur Radstadt positiv zu begleiten. Die
  Ausstellung war zentrales Element der Öffentlichkeitsarbeit und Rahmen der
  Bürgerbeteiligung an der Netzplanentwicklung des Radverkehrskonzeptes.
goals: |-
  - Sicherheit 
  - Komfort und Fahrspaß 
  - Fahrrad steigt in der Wahrnehmung / Statussymbol 
  - Reduktion privater Autoverkehr (sogenannter MIV) 
  - Klima- und Umweltschutz
