results: 'Neun Kilometer Fahrradstraßen und sechs Achsen erschließen Offenbach
  sowie das Umland neu für den Radverkehr.  Die Hochschule Darmstadt belegt
  anhand von Verkehrszählungen, dass der Anteil der Radfahrenden in den
  Fahrradstraßen gestiegen ist, während die Zahl der Autos sinkt. Auch die
  gefahrenen Geschwindigkeiten im Kfz-Verkehr nehmen deutlich ab, sind aber
  immer noch teilweise zu hoch. Die Bereitschaft, Umwege für die Nutzung der
  Fahrradstraße in Kauf zu nehmen, wuchs im Projektzeitraum, und die
  Radfahrenden fahren nun mittiger - und damit selbstbewusster – auf der
  Fahrbahn. Dadurch ging auch die Zahl der Konflikte zwischen Rad- und
  Kfz-Nutzenden messbar zurück. '
