description: >-
  Um das touristische Angebot im Landkreis zu erweitern und allen
  Tourist\*innen, Bürger\*innen ein schönes Erlebnis in der Natur zu bieten,
  plant der Landkreis gemeinsam mit 14 Städten und Gemeinden ein europaweit
  einzigartiges Mountainbike Projekt, welches unter dem Namen Green Trails
  läuft. Die Green Trails werden, wenn sie fertiggestellt sind, aus rund 200
  Kilometern Trails (Pfade) und 200 Kilometern Verbindungswegen bestehen. Das
  Ziel aller Projektbeteiligten ist, dass nicht nur die Trails von allen
  Personen jeder Altersklasse gefahren werden können, sondern bereits bei der
  Projektplanung die Interessenvertretungen einzubinden. 


  Wesentliches Ziel ist es, durch die Schaffung der neuen
  Mountainbike-Infrastruktur zusätzliche touristische Wertschöpfung zu
  generieren. Diese zusätzliche Wertschöpfung wird sich auf alle
  Projektbeteiligten Kommunen verteilen. Denn in jedem Ort entstehen neue,
  attraktive Angebote, die sich nicht nur an Besucher\*innen aus ganz
  Deutschland, sondern auch an Gäste in den angrenzenden Ländern wie zum
  Beispiel Belgien, den Niederlanden und Dänemark richten. Zudem gibt es noch
  viele positive Nebenfaktoren, die dieses Projekt mit sich bringt. Unter
  anderem sollen Wandernde zukünftig wieder mehr Ruhe auf ihren Wanderwegen
  genießen und der Wald allgemein durch die Lenkung und Kanalisierung, der immer
  mehr werdenden Mountainbike-Fahrenden, geschont werden.
goals: |-
  - Komfort und Fahrspaß
  - Mehr Personen fahren Fahrrad
  - Fahrrad steigt in der Wahrnehmung / Statussymbol
  - Klima- und Umweltschutz
localChallenges: |-
  - Finanzschwache Kommune
  - Geteilte Planungszuständigkeiten
  - Kaum/keine Angebote ÖPNV
particularities: |-
  - Interkommunal
  - Spezifische Zielgruppe: Tourist\*innen
results: Die gesamte Region Waldeck-Frankenberg soll durch die Green Trails für
  Touristen noch attraktiver gestaltet werden. Aber nicht nur für Touristen wird
  ein neues Angebot geschaffen. Auch Einheimische können die Trails nutzen, sich
  sportlich betätigen und das in der schönen Natur des Landkreises. Damit wird
  der Kreis auch als Wohnort und Arbeitsplatz - Stichwort Work-Life-Balance -
  attraktiver. Ob das Projekt den Effekt bringt, den alle beteiligten Kommunen
  sich erhoffen, wird sich in den kommenden Jahren herausstellen. Im Sommer 2023
  – wenn die ersten Trails in Korbach eröffnet sind - können ggf. erste
  Rückschlüsse auf die Effekte gezogen werden.
challenges: >-
  - Die Kommunikation ist eine große Herausforderung bei dem Projekt, da viele
  unterschiedliche Personengruppen gehört werden möchten.

  - Geteilte Planungszuständigkeiten: Die Flächen, auf denen die Trails gebaut
  werden, gehören entweder der Kommune, dem Eigenbetrieb des Landkreises oder
  dem Land Hessen.
communication: Die Maßnahme wird nach Projektfortschritt kommunikativ begleitet.
  Aktuell können sich Bürger\*innen über Facebook (Projekt Green Trails) oder
  über die Internetseite www.projekt.greentrails.de informieren.
funding: >-
  - Eigenmittel: rund 35 Prozent der baubegleitenden Planung und Baukosten

  - Landesmittel: 65 Prozent Land Hessen: Landesprogramm Gemeinschaftsaufgabe
  "Verbesserung der regionalen Wirtschaftsstruktur" 

  - Sonstige: zwischen 50 und 100 Prozent der Kosten für die Vorplanung
  Europäischen Fonds für regionale Entwicklung
personnelExpenses: >-
  - Projektleitung: eine Vollzeitstelle, drei Teilzeitbeschäftigte

  - Projektbüro (Planung): sieben Vollzeitstellen und weitere Personen aus
  beteiligten Ämtern
authorities: Untere Naturschutzbehörde, Jagdbehörde, Landwirtschaftsamt,
  Wasserbehörde, Kämmerei, Vergabestelle, Rechtsamt
stakeholders: Interessenvertretungen (Jäger\*innen, Landwirt\*innen, NABU,
  etc.), Flächeneigentümer\*innen
relatedOffice: Matthias Schäfer, matthias.schaefer@lkwafkb.de
sources: Landkreis Waldeck-Frankenberg, Deutscher Fahrradpreis 2022
notes: >-
  Der Zweckverband Green Trails besteht aus den Kommunen:  Bad Arolsen, Bad
  Wildungen, Battenberg, Diemelsee, Diemelstadt, Edertal, Hatzfeld, Korbach,
  Lichtenfels, Twistetal, Vöhl, Volkmarsen, Waldeck, Willingen sowie dem
  Landkreis Waldeck-Frankenberg.


  Für das Gebiet, wo diese Maßnahme durchgeführt wurde, treffen mehrere
  Raumtypen zu.

