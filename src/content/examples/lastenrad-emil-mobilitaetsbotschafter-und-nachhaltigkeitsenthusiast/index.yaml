communication: "Ganz im Sinne von ,,CO2 kennt keine Grenzen, Emil auch nicht!“
  bündelt Emil auf Instagram Projekte, Aktivitäten und Informationen. Er
  dokumentiert Infrastrukturprojekte, berichtet von Veranstaltungen und tritt
  mit den Menschen dort immer wieder in einen Dialog. Die multifunktionalen
  Einsatzmöglichkeiten und die mit positiven Emotionen verknüpfte Botschaft
  ,,Klimaschutz kann jede\\*r“ zeichnen Emil aus. Durch ein außerordentlich
  breites thematisches Spektrum auf Social-Media, werden zahlreiche
  Personenkreise erreicht, die sich sonst nicht mit Mobilitätsthemen
  befassen.   "
