description: >
  Das Lastenrad Emil ist städtischer Mobilitätsbotschafter und
  Nachhaltigkeitsenthusiast. Er ist ein weiterer Baustein der städtischen
  Mobilitätsstrategie, um das Rad noch stärker als leistungsfähiges
  Transportmittel in das Bewusstsein zu rücken. Drei Bausteine sind dabei
  wesentlich: Er ist als Verwaltungs(draht)esel ein klimafreundliches
  Dienstfahrzeug, er ist als Infostand nutzbar und er hat seinen eigenen Social
  Media Account mit über 1.000 Abonnent\*innen. 


  Als Verwaltungs(draht)esel möchte er nicht nur Bürger\*innen, sondern auch
  seine Kolleg\*innen bei der Stadt erreichen. Im Sinne von ,,mit gutem Beispiel
  voranfahren“ möchte er diese auf das Rad bringen und das Bewusstsein für
  Ressourcen- und Klimaschutz stärken. Außerdem ist er Netzwerker und
  Brückenbauer, da er leidenschaftlich gerne Klimaschutzprojekte mit anderen
  Akteur*innen in der Stadt anstößt. Egal ob Frostpendeln oder Stadtradeln, Emil
  ist als Initiator und treibende Kraft dabei. 


  Dabei geht es Emil immer darum, aufzuzeigen, dass Nachhaltigkeit und
  Klimaschutz mit kleinen Schritten beginnen und diese Schritte sogar Spaß und
  Freu(n)de bringen können. Gewerbetreibende, die mal ausprobieren möchten, ob
  ein Lastenrad in ihren Fuhrpark passt, können Emil auch für mehrere Tage
  ausleihen. Dabei ist das Angebot nicht als regulärer Radverleih gedacht,
  sondern als Einstieg in den Ausstieg aus der fossilen Transportflotte. Aber
  auch Vereine, Einrichtungen und Initiativen dürfen Emil gerne auf Herz und
  Nieren kostenlos testen.


  Bei Veranstaltungen zieht Emil als Infostand schon allein durch seine positive
  Ausstrahlung die Aufmerksamkeit auf sich. Mit seiner ausrollbaren
  Holzabdeckung wird aus ihm mit wenigen Handgriffen ein Infostand. Nutzlose
  Give-aways aus Plastik werden bei Emil vergeblich gesucht. Mit viel Liebe zum
  Detail wurden die Aufsteller für Kartenmaterial aus alten Paletten geschraubt,
  für die Abdeckung wurden alte Autogurte recycelt. 


  Neben Mobilitätsthemen greift Emil auf Instagram ein breites Spektrum an
  klimarelevanten Aspekten auf und erreicht damit viele Menschen auch über die
  Stadtgrenzen von Kamen hinaus.
