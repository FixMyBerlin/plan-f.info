results: 'Das Beschilderungssystem konnte überall umgesetzt werden. Es war ein
  sehr großer Aufwand, die zwölf Kommunen zu leiten und zu koordinieren
  (zeitlich und auch personell). Viele Probleme mussten gelöst und
  Überzeugungsarbeit geleistet werden. Die Resonanz der Tourist*innen und
  Bürger*innen ist durchweg positiv. '
challenges: 'Das Land Sachsen-Anhalt wollte das Knotenpunktsystem nicht
  einführen, da ein anderes Beschilderungssystem existierte. Es musste viel
  Überzeugungsarbeit geleistet werden. Marketingmaßnahmen, wie Veranstaltungen
  zur Bekanntmachung wurden durch die Corona-Pandemie verschoben und abgesagt.
  Dadurch konnte die erste Phase lange nicht abgeschlossen werden. Die Montage
  der Schilder in Eigenleistung wurde vom Fördermittelgeber nicht genehmigt. Die
  Kosten stiegen durch Beauftragung des Fachunternehmens. '
communication: 'Kommunikation in der Öffentlichkeit durch: Presse, TV, Messe,
  Webseite, Social-Media, Radio, Radkarten und Infoveranstaltungen '
funding: >-
  - Eigenmittel: 10 Prozent (erste Phase), 25 Prozent (zweite Phase) 

  -  LEADER/Community-Led Local Development (CLLD) Förderprojekt: 90 Prozent
  (erste Phase), 75 Prozent (zweite Phase)
personnelExpenses: Keine Angabe
authorities: 'Haupt- und Ordnungsamt, Bauamt, Kämmerei, Gemeinderäte '
stakeholders: 'Als Kooperationspartner*innen der Verbandsgemeinde
  Elbe-Havel-Land waren elf weitere Kommunen beteiligt (Seehausen, Osterburg,
  Bismark, Arneburg-Goldbeck, Stendal, Tangermünde, Tangerhütte, Elbe-Parey,
  Genthin, Jerichow, und Havelberg), um das neue Beschilderungssystem
  flächendeckend und einheitlich umzusetzen. Genehmigungen mussten eingeholt
  werden vom Tourismusverband, der Kommunalaufsichtsbehörde, dem Landkreis, dem
  Landesbetrieb für Hochwasserschutz und Wasserwirtschaft Sachsen-Anhalt. '
