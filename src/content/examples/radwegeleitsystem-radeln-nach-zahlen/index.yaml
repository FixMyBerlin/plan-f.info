description: >-
  2015 hat sich die Verbandsgemeinde Elbe-Havel-Land entschieden, dass regionale
  Radwegenetz zu überarbeiten und die bestehende Beschilderung übersichtlicher
  zu gestalten. Die regionalen Rundkurse überschnitten sich an einigen Stellen
  mit überregionalen Radwegen. Es gab regelrechte Schilderbäume, die zu
  Verwirrungen führten. Individuelle Tourenplanungen waren nur schwer möglich.
  Zudem war die Pflege dieser Beschilderung aufwendig und kostenintensiv.  
   
  Es wurde entschieden, die knotenpunktbezogene Wegweisung, auch Radeln nach
  Zahlen genannt, einzuführen. Nachbarregionen hatten ähnliche Probleme und
  wurden angesprochen, sich an diesem Projekt zu beteiligen, um ein
  flächendeckendes, einheitliches und nachhaltiges Radwegeleitsystem zu
  implementieren.  
   
  Zwölf Kommunen aus vier lokalen Aktionsgruppen sind an diesem Projekt
  beteiligt. Gemeinsam wurden Genehmigungen zur Umsetzung des
  Beschilderungskonzeptes erwirkt. Die bestehenden Radwege wurden auf ihre
  Qualität und als Verbindung zu touristischen Themenschwerpunkten (z. B. Straße
  der Romanik, Blaues Band, NaturaTrail 2000, Biosphärenreservat Mittelelbe
  etc.) geprüft. Einige mussten aus dem Angebot genommen werden, andere Stecken
  kamen hinzu. 1.400 km Radweg wurde untersucht. Seit einigen Jahren besteht in
  den Nachbarregionen der Prignitz und im Havelland diese Art der
  knotenpunktbezogenen Wegweisung. Zu diesen Regionen wurden eine Anbindung und
  so eine optimale Vernetzung geschaffen.  
   
  Das Projekt besteht aus zwei Phasen. Die erste Phase ist das
  Kooperationsprojekt der zwölf Kommunen, die die Konzeption, das Marketing und
  die Öffentlichkeitsarbeit beinhaltet. In dieser Phase gab es unzählige
  Informationsveranstaltungen und Treffen der Arbeitsgruppen. Das Radwegenetz
  wurde entwickelt, die Knotenpunkte und die Standorte der Wegweiser und
  Informationstafeln wurden festgelegt. Es entstanden ein Schilderkataster, ein
  Monitoringkonzept, eine Radkarte, Rollups, Tourenvorschläge und Blöcke für
  individuelle Tourenplanungen. Die zweite Phase ist die Anschaffung und
  Errichtung der Beschilderung. Diese Phase wurde von jeder Kommune eigenständig
  abgewickelt. In der Verbandsgemeinde Elbe-Havel-Land wurden neu aufgestellt: 

  122 Zielwegweiser 

  193 Zwischenwegweiser 

  110 Routenwegweiser 

  177 farbige Routenplaketten 

  28 Knotenpunkthüte 

  14 große Informationstafel 

  19 kleine Informationstafeln 
   
  Im Land Sachsen-Anhalt ist dieses Projekt als Pilotprojekt anzusehen und damit
  innovativ und modellhaft für andere Regionen im Land.
