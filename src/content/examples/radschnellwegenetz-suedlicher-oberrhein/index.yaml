challenges: Die Landkreise, die in den meisten Fällen als Baulastträger vom Land
  Baden-Württemberg bestimmt wurden, stoßen mit dem Ausbau der lokalen
  Radinfrastruktur sowie den bisherigen Planungen zu Radschnellverbindungen −
  inklusive den mitzudenkenden Zubringern − sowie weiteren Aufgaben, die in den
  letzten Jahren auf die Kreisebene delegiert wurden, an ihre personellen und
  finanziellen Grenzen, wodurch neue Projekte wohlmöglich nur stark
  zeitverzögert angegangen werden können.
