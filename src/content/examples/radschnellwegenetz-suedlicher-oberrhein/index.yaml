description: >
  Mit der Planung von überörtlichen Radschnellwegen soll der Radverkehr auch
  für größere Entfernungen attraktiv werden. Ziel des Regionalverbands ist es,
  ein durchgängiges und gut mit dem lokalen Radwegenetz verknüpftes
  Radschnellwegenetz als Rückgrat des regionalen Radverkehrs zu schaffen. 

  Auf Basis einer 2016 beauftragten Potenzialanalyse hat der Regionalverband
  zwischen 2017 und 2018 für vier Korridore in den Großräumen Freiburg und
  Offenburg vertiefende Machbarkeitsstudien erarbeiten lassen. Zwischen 2018 und
  2022 wurden sechs weitere Korridore im Auftrag des Regionalverbands anhand von
  Machbarkeitsstudien betrachtet (s. Abbildung).

  Ziel seit 2018 war es, sich nicht nur auf die beiden Verdichtungsräume
  Freiburg und Offenburg zu beschränken, sondern ein Gesamtnetz zu
  ermöglichen. Ferner wurde der Radverkehr erstmals über die Regionsgrenze
  hinaus – insbesondere nach Frankreich – mitgedacht. An dem Erarbeitungsprozess
  waren rund 40 Kommunen sowie über 20 weitere Partner\*innen (z.B. ADFC und
  VCD) über Steuerungsgruppen mit eingebunden. 

  Anhand von Vorzugstrassen konnte nachgewiesen werden, dass die erforderlichen
  Qualitätsstandards des Landes im gesamten Ziel-Netz eingehalten werden
  können. Auch weisen alle untersuchten Trassen ein positives
  Nutzen-Kosten-Verhältnis auf. Bis auf die Teilabschnitte nördlich und
  westlich von Achern sowie südlich von Bad Krozingen erreichen alle Abschnitte
  die vorgegebenen Potenziale von mindestens 2.000 Radfahrenden/Tag. 

  Auf Initiative des Regionalverbands haben die betroffenen Städte, Gemeinden
  und Landkreise zwischenzeitlich Absichtserklärungen unterschrieben, die
  Realisierung der Verbindungen zu unterstützen und weiterzuverfolgen. Die
  Korridore Freiburg–Waldkirch/Emmendingen und Offenburg–Strasbourg wurden 2019
  bzw. 2021 in die Baulastträgerschaft des Landes aufgenommen, die Planung wird
  vom Regierungspräsidium Freiburg vorangetrieben. Der Korridor
  Offenburg–Gengenbach wird vom Landkreis Ortenaukreis als Baulastträger
  konkret geplant. Der Regionalverband wird sich weiterhin für die baldige
  Realisierung aller Korridore einsetzen.
