description: >-
  Gute Fahrradabstellanlagen am Wohn- und am Arbeitsort haben einen großen
  Einfluss auf die Verkehrsmittelwahl. Bei einer gutachterlichen Untersuchung
  zum Thema “Quartiersentwicklung radfahrfreundlich gestalten” wurde
  festgestellt, dass im Wohnungsneubau die bauordnungsrechtlich geforderten
  Fahrradabstellplätze im oder am Gebäude häufig keine gute Qualität haben in
  Bezug auf die Lage im Gebäude, die Erreichbarkeit der Flächen,
  Diebstahlsicherheit, Barrierefreiheit, Bequemlichkeit für Nutzer\*innen etc.
  In älteren Bestandsgebieten sind häufig keine oder zu wenige geschützte
  Abstellflächen vorhanden. Hier stellt sich häufig die Frage, wo und wie
  sinnvoll nachgerüstet werden kann. Ein Leitfaden und ein Förderprogramm haben
  das gemeinsame Ziel, das Bewusstsein für gute Fahrradabstellanlagen zu
  wecken. 


  Das Förderprogramm richtet sich an private Eigentümer\*innnen und
  Gemeinschaften von Wohn- oder gewerblichen Immobilien. Es wird die Nachrüstung
  gefördert sofern diese die Qualitätsanforderungen des Leitfadens erfüllen. Das
  Programm läuft über fünf Jahre.
goals: |-
  - Sicherheit 
  - Komfort und Fahrspaß 
  - Mehr Personen fahren Fahrrad
localChallenges: |-
  - Flächenkonflikte
  - Kostensteigerung im Wohnungsbau
particularities: |-
  - Evaluation
  - Spezifische Zielgruppe: Bewohner\*innen, Arbeitnehmer\*innen
results: Das Bewusstsein bei privaten Grundeigentümer\*innen, was gute
  Fahrradabstellanlagen ausmacht, steigt. Der Nachweis über ein Angebot an
  privater Fahrradinfrastruktur, das über die bauordnungsrechtlichen
  Anforderungen hinausgeht, kann im Baugenehmigungsverfahren zur Abminderung
  “notwendiger” Kfz-Stellplätze geltend gemacht werden. Die Hamburger
  Stellplatzregelungen wurden entsprechenden überarbeitet.
challenges: 'Der geforderte Nachweis von Fahrradabstellanlagen wird aus
  Kapazitätsgründen in den Baugenehmigungsverfahren nur grob geprüft. Daher ist
  es wichtig, ein Bewusstsein bei den Baufrauen und Bauherren zu schaffen. Bei
  bereits genehmigten Gebäuden kann nur mit Hilfe von Fördermitteln Einfluss
  genommen werden. In Zeiten von Wohnungsknappheit und steigenden Baukosten sind
  höhere Anforderungen jedweder Art politisch schwer durchsetzbar. '
communication: "Verbände der Wohnungswirtschaft und der Verband der
  Wohnungseigentümer sowie größere Bestandshalter\\*innen wurden gezielt
  informiert. Das Förderprogramm läuft erst an und muss noch bekannter werden. "
