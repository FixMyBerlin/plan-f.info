description: >-
  In Frankfurt am Main werden seit 2019 großflächig Roteinfärbungen von Rad- und
  schutzstreifen auf Streckenabschnitten sowie Radfurten in Kreuzungen und bei
  Grundstücksein- und ausfahrten vorgenommen.  


  Die Priorität liegt dabei vor allem auf dem Einfärben der Radfurten in
  Kreuzungsbereichen, um die Sicherheit des Radverkehrs zu erhöhen. Dabei werden
  vor allem Radfurten rot markiert, bei denen sich der Radverkehr in oder vor
  der Kreuzung mit dem Kfz-Verkehr verflechtet. Dies ist der Fall, wenn der
  Radverkehr und abbiegende Kfz-Verkehr gleichzeitig grün bekommen, bei
  Radfahrstreifen in Mittellage oder bei sogenannten freien Rechtsabbiegern. Für
  Radfahrstreifen in Mittellage hat eine Untersuchung der TU Berlin gezeigt,
  dass diese einen positiven Sicherheitseffekt haben können, wenn sie in
  richtiger Breite und Länge ausgeführt und eingefärbt sind. Als freilaufende
  Rechtsabbieger bezeichnet man Straßenabschnitte an Kreuzungen, welche das
  Umgehen einer Ampel beim Rechtsabbiegen ermöglichen. 


  Sie sollen in Frankfurt bei Neu- und Umbauplanungen nicht mehr zum Einsatz
  kommen. Lediglich im Bestand werden die Radfurten hier rot markiert, um die
  Wahrnehmung des Radverkehrs durch Autofahrende zu erhöhen.  


  Aus dem gleichen Grund werden Radfurten im Bereich von Grundstücksein- und
  ausfahrten umgesetzt - insbesondere bei solchen mit schlechten
  Sichtbeziehungen unter den Verkehrsteilnehmern. 


  Neben Radfurten werden auf einzelnen Abschnitten auch streckenhaft (nicht
  baulich geschützte) Radfahr- und schutzstreifen rot markiert. Dies soll das
  Bewusstsein der übrigen Verkehrsteilnehmer für den Radverkehr erhöhen.
  Insbesondere soll dadurch die Hemmschwelle zum Falschparken auf den
  Radverkehrsanlagen erhöht werden.
goals: |-
  - Sicherheit
  - Fahrrad steigt in der Wahrnehmung / Statussymbol
localChallenges: Keine spezifische Angabe
particularities: Quick-Win
results: 'Die neuen roten Radfahrstreifen kommen gut an. Sie machen
  Radfahrstreifen in der Stadt deutlich sichtbarer und motivieren aufs Rad zu
  steigen. Die rot eingefärbten Furten an Knotenpunkten scheinen auch zur
  Reduktion von Unfällen beizutragen. Es ist zu vermuten, dass die Roteinfärbung
  Falschparker eher abschreckt. Seit Ende 2019 wurden in Frankfurt ca 29km an
  Radfahrstreifen rot eingefärbt. '
challenges: >-
  Zu den größeren Herausforderungen gehört das Thema Leistungsfähigkeit im
  Straßennetz. Roteinfärbungen von RVA gehen häufig mit der Entnahme von
  MIV-Fahrspuren einher. 


  Sobald der Umbau von Lichtsignalanlagen erforderlich ist, dauern die Projekte
  erheblich länger. Neue Signalanlagen werden aus dem Investitionshaushalt
  finanziert, hierfür sind ab 100 TSD in Frankfurt am Main Beschlüsse des
  Magistrats erforderlich. 


  Ein Zielkonflikt stellt ggf. die ÖPNV-Beschleunigung dar, wenn es unter
  Umständen zu Fahrzeitverlusten im Busverkehr kommt. 


  Hier ist dann im Einzelfall abzuwägen und im Zweifelsfall hat die
  Verkehrssicherheit Vorrang.
communication: >-
  Alle bedeutenden Radverkehrsmaßnahmen werden mittels Pressemitteilung, auf
  radfahren-ffm.de, twitter, fb kommuniziert. 


  Gelegentlich kommen auch Flyer zum Einsatz, das ASE informiert auch mittels
  Plakatierung über anstehende Maßnahmen. 


  Die Plattform mainziel.de informiert über verkehrliche Einschränkungen
  (Umleitungen/Sperrungen)
funding: >-
