description: >-
  Seit dem Jahr der „Grünen Hauptstadt Europas – Essen 2017“ bietet die Stadt
  Essen interessierten Essener Unternehmen gemeinsam mit der EWG - Essener
  Wirtschaftsförderungsgesellschaft regelmäßig Workshops zum Thema
  „Fahrradfreundlicher Arbeitgeber“ gemeinsam mit dem Allgemeinen Deutschen
  Fahrrad-Club (ADFC) an. 


  Ziel ist es, Arbeitgeber\*innen zu motivieren, sich umweltfreundlicher
  aufzustellen und den Mitarbeiter\*innen für den Weg zur Arbeit und für
  dienstliche Wege den Umstieg vom Auto auf das Rad durch geeignete Maßnahmen zu
  erleichtern. 


  Die Grüne Hauptstadt Agentur der Stadt Essen betreibt dazu intensive lokale
  Kommunikation, organisiert Veranstaltungen und bietet interessierten
  Unternehmen eine finanzielle Unterstützung. Sie organisiert die lokale
  Vernetzung zertifizierter und interessierter Essener Unternehmen und geht mit
  gutem Beispiel voran. Die Grüne Hauptstadt Agentur der Stadt Essen fördert
  Unternehmen, die eine Zertifizierung durchführen, aktuell mit jeweils 1.500
  Euro. 


  Bundesweit einmalig hat sich in Essen unter Begleitung der Grünen Hauptstadt
  Agentur der Stadt Essen ein engagierter „Arbeitskreis Fahrradfreundliche
  Arbeitgeber in Essen“ bestehend aus Essener Unternehmen mit mehr als 40
  Teilnehmenden gebildet, deren Arbeitgeber\*innen bereits zertifiziert sind,
  oder dieses anstreben. Gemeinsam gelingt es die Anstrengungen zum Umstieg auf
  das Fahrrad in Essen weiter voranzutreiben und weitere Unternehmen zu
  motivieren, sich fahrradfreundlich aufzustellen.  


  Fahrradfreundliche Unternehmen profitieren direkt, denn sie erhöhen ihre
  Attraktivität, tragen zum Umweltschutz bei, senken gleichzeitig ihre Kosten
  und fördern die Gesundheit der Mitarbeiter\*innen. 


  Mit dem erfolgreichen Projekt „Fahrradfreundlicher Arbeitgeber“ nimmt die
  Stadt Essen eine Vorreiterposition ein. Die hohe Beteiligung und das große
  Interesse bei den Workshops zeigen nachdrücklich die Bedeutung der
  Notwendigkeit, den Radverkehr als gute Alternative zum öffentlichen
  Personennahverkehr (ÖPNV) und zum privaten Autoverkehr, sogenannter
  motorisierter Individualverkehr (MIV), in der Kommune weiterzuentwickeln und
  regionale Akteur\*innen aktiv einzubinden.  


  Aufgabe der Kommune ist es, Input und Ideen einzubringen und so immer mehr
  Menschen und Unternehmen zum Umstieg auf das Rad im privaten als auch
  beruflichen Umfeld zu bewegen. Gleichzeitig ist die Stadt gefordert, für gute
  Radwege und mehr Sicherheit für Radfahrende im Straßenverkehr zu sorgen.  


  Eine Verlagerung der Wege vom Auto auf das Fahrrad um lediglich 1% reduziert
  den Ausstoß von CO² bereits um ca. 9.300 Tonnen pro Jahr.  


  Das Projekt „Fahrradfreundlicher Arbeitgeber“ leistet insoweit einen wichtigen
  Beitrag, die nachhaltige Mobilität in Essen zu steigern.
