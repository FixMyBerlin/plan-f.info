results: >-
  Bis dato (Februar 2023) sind 24 Zertifizierungen an fahrradfreundlicher
  Arbeitgeber\*innen in Essen vergeben worden. Weitere bereiten eine
  Zertifizierung vor. 


  Durch die Förderung der Zertifizierung wird gemeinsam mit Akteur\*innen aus
  Handel, Handwerk und Wirtschaft die effiziente und umweltgerechte Mobilität in
  Essen weiterentwickelt und vorangetrieben. Unternehmen werden motiviert, sich
  umweltfreundlicher aufzustellen und erleichtern Mitarbeiter\*innen den Umstieg
  vom Auto auf das Rad durch geeignete Maßnahmen für den Weg zur Arbeit und für
  dienstliche Wege. Insgesamt werden das Mobilitätsverhalten und die
  Mobilitätsgewohnheiten durch Veränderung von Anreizstrukturen und
  Rahmenbedingungen beeinflusst und gefördert.
challenges: >-
  In Unternehmen:  

  - Bewusstsein schaffen für mehr und besseren Umwelt- und Klimaschutz durch den
  Umstieg vom Auto auf das Rad. 

  - Bereitstellung finanzieller Mittel und personeller Ressourcen für den
  Zertifizierungsprozess.

  - Reduzierung von Autoparkplätzen zugunsten von Radabstellanlagen. 

  - Schaffen von z. B. Umkleiden, Spinden und Duschen. 

  - Anreize schaffen für Mitarbeitende, auf das Rad umzusteigen. 

  - Einbindung in das betriebliche Gesundheitsmanagement.
communication: >-
  Unternehmen und Organisationen werden zu den Workshops eingeladen.  


  Die Essener Wirtschaftsförderung stellt für die Einladungen regelmäßig ihre
  Unternehmensdatenbank zur Verfügung. 


  Industrie- und Handelskammer, Handwerkskammer, Kreishandwerkerschaft und
  Essener Wirtschaftsförderung unterstützen das Projekt „Fahrradfreundlicher
  Arbeitgeber“ durch Werbemaßnahmen zu den Workshops „Fahrradfreundlicher
  Arbeitgeber“.  


  Die erfolgreich zertifizierten Unternehmen begleiteten die Überreichung des
  Zertifikates regelmäßig mit Öffentlichkeitsarbeit intern und extern, meist in
  Anwesenheit des Oberbürgermeisters der Stadt Essen, welcher den Scheck der
  Stadt Essen zur Förderung der Fahrradfreundlichkeit im Unternehmen übergibt.
