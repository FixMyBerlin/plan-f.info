description: >-
  Die Halberstädter Innenstadt ist einerseits durch ein altstadttypisches
  Straßennetz und andererseits durch überdimensionierte Verkehrsräume
  charakterisiert, die Ursache für eine räumlich-funktionale Trennung Altstadt–
  Stadtzentrum sind. Auf dem Weg zur barrierefreien Kommune und vor dem
  Hintergrund des demografischen Wandels und des Klimawandels will sich die
  Stadt zukunftsfähig ausrichten. 


  Das für eine historische Innenstadt untypisch großzügige Platzangebot soll als
  Chance genutzt werden, Angebote für eine höhere Aufenthaltsqualität und
  Nutzungsvielfalt zu schaffen und Maßnahmen zur Begegnung der Folgen des
  Klimawandels zu ergreifen. Die verbliebene kleinteilige Altstadt mit zum Teil
  schmalen Straßen und Gassen ist mit dem übrigen System in Einklang zu bringen.
  Strategisches Ziel der Stadtentwicklung ist es, die zum Teil durch
  überdimensionierte Verkehrsräume zerklüftete Innenstadt neu zu ordnen und als
  attraktive Stadträume neu zu gestalten. 


  Eine Vorort-Bürger\*innenbeteiligung wurde durchgeführt und die Ergebnisse in
  das Konzept übertragen. Wesentliches Ziel des Verkehrskonzeptes ist es,
  Lösungsvorschläge zu erarbeiten.
goals: |-
  - Sicherheit
  - Komfort und Fahrspaß 
  - Fahrrad steigt in der Wahrnehmung / Statussymbol 
  - Reduktion Mobilitätsarmut 
  - Reduktion privater Autoverkehr (sogenannter MIV)
  - Klima- und Umweltschutz
localChallenges: |-
  - Flächenkonflikte
  - Geteilte Planungszuständigkeiten
  - Demographie
  - Überdimensionierte Verkehrsräume 
  - Eingefahrene Verwaltungsstrukturen überwinden
particularities: >-
  - Kosten-Nutzen-Analyse 

  - Evaluation 

  - Beteiligung 

  - Inklusive Maßnahme (Erhöhung Zugänge / Gerechtigkeit) 

  - Einsteiger\*innenmaßnahme

  - Quick-Win 

  - Temporäre Maßnahme 

  - Spezifische Zielgruppe: Pendler\*innen, Schüler\*innen, Lieferverkehr,
  Frauen, Tourist\*innen
results: 'Alle Beteiligten haben ein dynamisch anwendbares Konzept
  hervorgebracht. Detailliert durchdachte Maßnahmenbündel und Einzelmaßnahmen
  lassen sich losgelöst, aber auch in Verbindung miteinander umsetzen und sorgen
  für ein stetiges Vorankommen und Erreichen der übergeordneten Mobilitätsziele
  der Stadt Halberstadt. Die gute Anwendbarkeit bzw. die dynamische Umsetzung
  des Konzeptes zeigt sich in dem Arbeitskreis, der seit dem Beschluss des
  Konzeptes an seiner Umsetzung arbeitet. '
challenges: "Verschiedene Interessenlagen der Verwaltung und Bürger\\*innen in
  Einklang bringen. Eine weitere Herausforderung war die Datenqualität. Wir
  haben den Vorteil Verkehrsdaten aus unserem Verkehrsrechner zu erhalten.
  Jedoch war gab es Komplikationen bei Daten von übergeordneten Behörden. "
communication: Öffentliche Beteiligung durch drei öffentliche Veranstaltungen
  (teilweise zum selbst mitmachen). Außerdem Information durch Presse und in
  Social Media sowie Informationen über unsere Internetseite.
