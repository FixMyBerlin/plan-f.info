description: >-
  Anlass für die Maßnahme war die Novelle der Straßenverkehrsordnung (StVO) im
  April 2022, bei der ein Mindestabstand von 1,5 beziehungsweise 2 Metern beim
  Überholen von Radfahrenden eingeführt wurde. Ziel ist die Bekanntmachung
  dieser sicherheitsrelevanten Änderung bei möglichst vielen motorisierten
  Verkehrsteilnehmer\*innen und die Werbung für ein regelkonformes Verhalten. 


  Das Projekt wird gemeinsam mit der Arbeitsgemeinschaft fahrradfreundlicher
  Kommunen in Thüringen e. V. (AGFK-TH) und den Mitgliedskommunen Arnstadt,
  Ilmenau und Stadtilm umgesetzt. Im Jahr 2020 wurden durch die AGFK-TH Behörden
  angefragt, ob Sie sich mit ihren Fuhrparks beteiligen. Die Aufkleber wurden in
  zwei Größen (für Personenkraftwagen sowie für Busse/Nutzfahrzeuge) entwickelt
  und verteilt. Im Ilm-Kreis erreichten wir die thüringenweit größte
  Beteiligung, da die Fuhrparks der Kommunen Ilmenau, Arnstadt, Stadtilm und des
  Landratsamtes, Busse des IOV Omnibusverkehr GmbH Ilmenau sowie Fahrzeuge der
  Stadtwerke und des Wasser- und Abwasserzweckverbandes Arnstadt mit den
  Aufklebern versehen wurden. Arnstadt hat zusätzlich an Standorten mit
  fehlender separater Radverkehrsanlage entsprechende Hinweisschilder
  aufgestellt. 


  Die Maßnahme ist langfristig angelegt und zielt darauf ab alle motorisierten
  Verkehrsteilnehmer\*innen auf die neue Regelung in der StVO aufmerksam zu
  machen. Dieses Ziel kann nicht in kurzen Zeiträumen erreicht werden, sondern
  bedarf einer stetigen Erneuerung und Wiederholung. Gleichzeitig werden weitere
  Standorte für die Beschilderung und weitere Fuhrparks für die Anbringung der
  Aufkleber in Kommunen angeworben.
goals: '- Sicherheit'
