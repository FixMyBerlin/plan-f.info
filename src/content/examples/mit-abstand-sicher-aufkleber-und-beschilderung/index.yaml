results: "Eine Evaluation zum Verhalten der Verkehrsteilnehmer\\*innen bezüglich
  Überholabstand ist aufwändig, im Gegensatz zu dieser sehr preiswerten Aktion
  zur Öffentlichkeitsarbeit. Es gibt nach wie vor Fälle, wo der Überholabstand
  nicht eingehalten wird und gefährliche Situationen entstehen. Dadurch, dass
  immer wieder neue Beteiligte gefunden werden und begleitende Pressearbeit
  stattfindet, soll das Thema aktuell gehalten werden. "
challenges: 'Da die Fuhrparke größtenteils aus Leasingfahrzeugen bestehen, ist
  Überzeugungsarbeit notwendig, dass die Aufkleber rückstandslos entfernbar
  sind. Das Bekleben und Entfernen der Aufkleber muss beim Auslaufen der
  Leasingverträge jeweils wieder erneuert werden. '
