description: >-
  Das Komplexprojekt Südknoten entstammt dem Generalverkehrsplan 1968. Es
  kreuzen sich die Bundesstraßen 4 und 7, welche zwei Autobahnen verknüpfen. Die
  Ziele der Verkehrsplanung richteten sich auf einen störungsfreien und
  leistungsstarken Kraftverkehr aus. Daraus entstand eine Führung für den Fuß-
  und Radverkehr, welche mit Hinblick auf die Barrierefreiheit und den
  steigenden Radverkehrsanteil keinen heutigen Normen und Zielen entspricht. Die
  Maßnahme gliedert sich in zwei Bauvorhaben. Den Neubau einer
  nicht-barrierefreien Brücke (Maßnahme 1) und die Umgestaltung des Knotens
  (Maßnahme 2) mit der Einrichtung von Radinfrastruktur. Die Umgestaltung soll
  den barrierefreien Fuß- und Radverkehr fördern und einer zukünftigen neuen
  Stadtbahnlinie Platz einräumen.  


  Für die Brückenmaßnahme wurde 2016 eine Bürger\*innenbeteiligung durchgeführt
  und die Planungsleistung gemäß der Vergabeverordnung in 2017 mit einem
  europaweit ausgelobten und durchgeführten Planungswettbewerb 2018 vergeben.
  Die Ausschreibung der Bauleistung erfolgte vom 4. Quartal 2019 bis zum 1.
  Quartal 2020. Baubeginn war 08/2020. Bauende ist 12/2022.   


  Der Maßnahme 2 ging eine Studie im August 2019 voraus. Das Ziel der Studie
  war, inwieweit sich Anlagen für den Radverkehr gemäß ERA 2010 in die
  vorhandene Verkehrsanlage mit teilweise vier Spuren pro Fahrtrichtung ergänzen
  lassen. Die Weiterentwicklung der Studie wurde bis zur Ausführungsplanung im
  Frühjahr 2022 fortgeführt. Die Umsetzung begann im Juli 2022 und wurde im Jahr
  2022 beendet.
goals: |-
  - Sicherheit 
  - Komfort und Fahrspaß 
  - Mehr Personen fahren Fahrrad 
  - Fahrrad steigt in der Wahrnehmung / Statussymbol
  - Reduktion privater Autoverkehr (sogenannter MIV)
  - Klima- und Umweltschutz 
  - Flächengerechtigkeit
