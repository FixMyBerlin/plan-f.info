  - Spezifische Zielgruppe: Alltagsradverkehr
results: 'Die Maßnahmen sind Teil, die Anpassungen einer 1972-1976 autogerecht
  um- und neugebauten, großen Verkehrsschleuse um die Führung von Fuß- und
  Radverkehrs mit breiteren und barrierefreien Wegen zu verbessern und
  zukünftige Erweiterungen des Fuß-, Rad- und ÖPNV-Netzes vorzuhalten. So können
  Radfahrende den Knoten zukünftig auf breiteren und barrierefreien Wegen und
  ohne abzusteigen queren. Es wurde erfolgreich ein Update ins 21. Jahrhundert
  der Verkehrsplanung der 70er Jahre auferlegt.  '
challenges: 'Für die Brückenbaumaßnahme waren die Anbindung an drei verschiedene
  Höhenpunkte, die Beachtung der lichten Höhe für den Hochwasserschutz, den
  Schwerlastverkehr und eine spätere Straßenbahntrasse mit Haltestelle und dazu
  eine barrierefreie Wegeführung planerisch, technisch und technologisch
  aufwendig. Beide Maßnahmen sind durch umfangreiche Eingriffe in den
  Verkehrsablauf und das aufwendige Umrüsten der Baustellen- und
  Umleitungseinrichtungen geprägt.  '
communication: 'Informationen zu den Projekten wurden überwiegend über den
  Internetauftritt der Stadt Erfurt veröffentlicht. '
