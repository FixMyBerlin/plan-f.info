description: >-
  Mithilfe einer automatischen Detektion werden Radfahrende an Ampeln
  (sogenannte Lichtsignalanlagen) in Oberhausen beschleunigt. Die Radfahrenden
  werden beim Anfahren auf die Ampel frühzeitig erkannt und ein entsprechendes
  Signalprogramm zur schnellen Grünschaltung initialisiert. Hierdurch wird die
  Wartezeit erheblich reduziert und der Komfort für Radfahrende gesteigert.  
   
  Im besten Fall können Radfahrende die Signalanlage beim Eintreffen sogar ohne
  Wartezeit passieren. Durch die Reduzierung der Wartezeiten wird auch die
  Anzahl der Rotlichtverstöße reduziert und ein wichtiger Beitrag zur
  Verbesserung der Verkehrssicherheit geleistet. Im Rahmen eines einzigartigen
  Förderprojektes des Bundeswettbewerbs Klimaschutz im Radverkehr konnten 30
  Ampeln mit der automatischen Detektion von Radfahrenden ausgestattet werden.
