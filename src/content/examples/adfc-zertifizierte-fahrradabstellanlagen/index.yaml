description: >-
  Förderung der Fahrradnutzung durch neue und hochwertige Fahrradabstellanlagen
  am Bahnhof, in der Innenstadt und bei städtischen Liegenschaften. Es handelt
  sich dabei um durch den Allgemeinen Deutschen Fahrradclub (ADFC) zertifizierte
  Anlagen. Alte Anlagen wurden ersetzt und durch neue ergänzt. Am Bahnhof wurde
  dafür extra ein Parkplatz von der Bahn gekauft und 30 Auto-Stellplätze
  gestrichen für die neuen, überdachten Doppelstockanlagen. Damit wird
  beigetragen, den Fahrradanteil weiter zu erhöhen. 


  Beim Bahnhof wurde 2018 mit einer Bedarfsanalyse gestartet bis im Jahr 2022
  die neue Anlage mit 149 Fahrradständern und 276 überdachten Stellplätzen die
  neuen Anlage in Betrieb genommen wurde. In der Innenstadt wurden außerdem 301
  neue Einstellmöglichkeiten an 30 Standorten realisiert. 

    

  Ebenfalls an den städtischen Liegenschaften wurden über 200 neue
  Fahrradständer errichtet. Beim neuen Hallenbad wurden zudem 51 überdachte
  Fahrradstellplätze und 273 nicht überdachte Fahrradständer erbaut.
goals: |-
  - Sicherheit 
  - Komfort und Fahrspaß 
  - Mehr Personen fahren Fahrrad 
  - Fahrrad steigt in der Wahrnehmung / Statussymbol
  - Reduktion privater Autoverkehr (sogenannter MIV) 
  - Klima- und Umweltschutz
localChallenges: |-
  - Flächenkonflikte
  - Kaum/keine Angebote ÖPNV 
  - Viel Kopfsteinpflaster
particularities: "Spezifische Zielgruppe: Pendler\\*innen "
results: Die Abstellanlagen werden von den Radfahrenden sehr gut angenommen auch
  optische Aufwertung der Innenstadt durch die Entfernung der alten teilweise
  sehr alten Felgenkiller.
challenges: >-
  Nicht möglich Firmen für die notwendigen Baumaßnahmen zu bekommen, mussten
  deshalb vom Bauhof durchgeführt.  

  Sehr lange Bearbeitungszeiträume bei der Bahn und anfangs unklare
  Zuständigkeiten. Abstellanlagen bei Liegenschaften werden nicht gefördert,
  hohe finanzielle Belastung.
