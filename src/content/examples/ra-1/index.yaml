description: >-
  Eine der größten Herausforderungen des öffentlichen Raums ist der Platz –
  gerade im Innenstadtbereich. Auf den wenigen Metern von Fassade zu Fassade
  konkurrieren die verschiedensten Nutzungen und Bedürfnisse um den knappen
  Raum. Das Fahrrad gilt hier als wahres Raumwunder, stellt es doch mit
  vergleichsweise wenig Flächenverbrauch ein erstaunliches Maß an Mobilität zur
  Verfügung. Mehr Rad bedeutet weniger Auto bei gleichzeitig mehr Platz. Um den
  Bürgerinnen und Bürgern schon heute zu zeigen, dass innerstädtischer Raum
  wertvoll ist und so viel mehr als ein Parkplatz sein kann, hat die Stadt
  Mönchengladbach die RAUMWUNDER-Kampagne entwickelt. 
   
  Das RAUMWUNDER bringt Aufenthaltsqualität dorthin, wo sie bisher fehlt – auf
  den Parkplatz. Auf dem mobilen Plateau finden verschiedene Sitzgelegenheiten,
  ein Bücherschrank und eine solarbetriebene Handy-Ladestation Platz. Hinzu
  kommt ein wenig Grün und schon verwandelt sich die Parkbucht zum Wohlfühlort.
  Per Lastenrad fährt die Plattform jeden Tag der Europäischen Mobilitätswoche
  (EMW) 2020 einen anderen Ort an. Zusätzlich gibt es jeden Tag eine Aktion, die
  gemeinsam mit Akteur\*innen vor Ort umgesetzt wird. So bietet das RAUMWUNDER
  Platz für einen Spieleabend, wird Leselounge und Wohnzimmer zum Polizeiruf
  gucken. Es wird Bühne für einen Poetry-Slam und ein Elektronik-Konzert und an
  den beiden letzten Tagen sogar Klassenzimmer und Pop-up-Coworking-Space. 
   
  Auch künftig soll das RAUMWUNDER eingesetzt werden und durch Aktionen
  weiterhin auf das Flächenpotenzial im innerstädtischen Raum durch den Umstieg
  auf das Fahrrad aufmerksam machen. In der Europäischen Mobilitätswoche 2021
  wurde es z. B. eingesetzt als mobile Bühne, auf der an verschiedenen Orten in
  der Stadt kleine Konzerte stattgefunden haben. Die Resonanz war sehr positiv.
