description: >-
  Die Gemeinde Gröbenzell steht hinter dem Trend zu mehr Lastenrädern und möchte
  deren Nutzung fördern und die Erreichbarkeit des Zentrums für diese
  erleichtern. Außerdem sollen die zentralen Einkaufsmöglichkeiten besser
  erschlossen werden können, sodass sich Großeinkäufe oder die Mitnahme der
  Kinder einfacher gestalten. 
   
  Aus diesem Grund wurden in der Kirchenstraße am 30. Juli 2020 Stellflächen für
  mindestens vier Lasten-Fahrräder bzw. Fahrrad-Anhänger Gespanne geschaffen.
  Hierzu wurden zwei Kfz-Stellplätze offiziell umgewidmet. 
   
  Die Stellplätze befinden sich direkt vor einem Supermarkt und verfügen über
  zwei Anlehnbügel, damit die Lastenräder nicht nur ab- sondern auch angesperrt
  werden können, falls der Einkauf länger dauert. Entsprechend der
  Straßen-Verkehrsordnung (StVO) Novelle aus 2020, in der offiziell das Sinnbild
  „Lastenfahrrad“ eingeführt wurde, wurden die Stellplätze mit einem Parken- und
  dem entsprechenden Zusatzzeichen beschildert. Durch die blaue Grundfläche sind
  die Stellplätze auch nicht zu übersehen. 
   
  Der Stellplatz wurde so gewählt, dass es nun die Möglichkeit gibt, sein
  Lastenrad während des Einkaufs auf dem Gröbenzeller Wochenmarkt jeden Freitag
  dort abzustellen. Dieses muss beziehungsweise sollte dann nicht mehr mit in
  den Marktbereich genommen werden, aus Rücksicht gegenüber den anderen
  Marktbesucher\*innen. Auf den Stellflächen können aktuell nicht nur
  Lastenräder abgestellt werden – auch Fahrräder mit Anhänger, Rikschas usw.
  sind gerne gesehen! 
   
  Da Lastenfahrräder in der neuen StVO als „als Fahrräder zum Transport von
  beweglichen Gütern“ eingestuft werden, der Begriff aber ansonsten nicht weiter
  definiert ist, sind alle Fahrrad-Arten, bzw. –Gespanne zum Transport von
  Lasten und Personen von Seiten der Gemeinde ausdrücklich erlaubt.
