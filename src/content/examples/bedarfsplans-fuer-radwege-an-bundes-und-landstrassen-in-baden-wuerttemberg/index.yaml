particularities: '- Interkommunal'
results: 'Der Bedarfsplan für Radwege an Bundes- und Landesstraßen in BW wurde
  Anfang 2023 veröffentlicht. Bis 2040 sollen so über 2.000 Kilometer an neuen
  Radwegen entlang von Bundes- und Landesstraßen entstehen. Der Ausbau der
  Radwege findet in mehreren Stufen statt. Zuerst werden bis 2030 die Radwege
  mit der höchsten Priorität (Vordringlicher Bedarf) realisiert. Das betrifft
  rund 860 Kilometer an neuen Wegen. Ab 2030 sollen dann weitere Radwege
  entstehen, bei denen der Bedarfsplan eher eine mittlere oder geringere
  Priorität sieht (Weiterer Bedarf mit Planungsrecht & Weiterer Bedarf). Das
  betrifft etwa 1.200 Kilometer an Radwegen. '
