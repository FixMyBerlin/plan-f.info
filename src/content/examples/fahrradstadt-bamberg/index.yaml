description: >-
  Die Entwicklung einer Marke „Fahrradstadt Bamberg“ hat zum Ziel, die
  erreichten Erfolge im Zuge der Radverkehrsstrategie in der Stadt zu vermitteln
  und darzustellen. Es soll mehr Bewusstsein in der breiten Öffentlichkeit für
  bereits umgesetzte Maßnahmen der Radverkehrsförderung geschaffen und die
  Wahrnehmung Bambergs als Fahrradstadt gestärkt werden. Eine insgesamt positive
  Wahrnehmung der Radverkehrswirklichkeit in Bamberg soll auch dazu dienen,
  weiteren Menschen den Anreiz zu geben, das Fahrrad vermehrt oder erstmals zu
  nutzen. Zudem soll das wechselseitige Verständnis zwischen den
  Verkehrsteilnehmenden gestärkt werden. Bamberg soll bewusst als
  „Radfahrstadt“, als fahrradfreundliche Kommune, mit einem breiten
  Fahrradangebot wahrgenommen werden.   

    

  Zugleich steht die gegenseitige Rücksichtnahme im Fokus: Die Wahrnehmung der
  jeweils anderen Verkehrsteilnehmenden soll positiv beeinflusst und damit die
  Sicherheit im Verkehr gestärkt werden. Dafür steht der gewählte Leitspruch
  „ZUSAMMEN UNTERWEGS“.  

    

  In einem öffentlichen Ideenwettbewerb wurde ein modernes Logo mit hohem
  Wiedererkennungswert gesucht. Durch die Beteiligung der Öffentlichkeit wird
  eine hohe Identifizierung mit dem Logo erwartet. Aus einer Vorauswahl der
  zahlreichen Einreichungen von Privatpersonen und Agenturen wählten über 3.600
  Bürger*innen in einer Online-Abstimmung ihre Favoriten. Auf dem Mobilitätstag
  wurde das neue Logo „Fahrradstadt Bamberg“ schließlich der Öffentlichkeit
  vorgestellt. Zum Info-Stand „Fahrradstadt“ führte ein roter Teppich, auf dem
  auch die Preisträgerin geehrt wurde. Zusätzlich wurden erste Werbemittel und
  Streuartikel verteilt (Aufkleber, Magnete, Buttons).  

    

  Im Rahmen der Imagekampagne wurden zudem weitere Aktionen durchgeführt: Es gab
  eine Plakataktion „SEHEN UND GESEHEN WERDEN“ in Kooperation mit der lokalen
  Fahrradwirtschaft. Unterstützt von der Verkehrswacht Bamberg wurden zudem
  Warnwesten mit der Kernbotschaft „Lichtgestalten“ verteilt. Am Eingang des
  neuen Fahrradquartiers „Bamberg-Mitte“ wurde die Öffentlichkeit über das
  richtige Verhalten in Fahrradstraßen informiert. Eine
  Bürger\*innensprechstunde, zu der die Radverkehrsbeauftragte einlud sowie eine
  „Dankeschön“-Aktion für Radfahrende auch im Winter sind weitere Aktionen der
  „Fahrradstadt Bamberg“.
