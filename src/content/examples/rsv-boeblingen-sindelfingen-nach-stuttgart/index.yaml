results: 'Erfolgreiche Umsetzung der ca. acht Kilometer lange
  Radschnellverbindung (RSV) zwischen den Mittelzentren Böblingen und
  Sindelfingen sowie der Landeshauptstadt Stuttgart. Die RSV verbindet die
  jeweils städtischen Radwegnetze miteinander und sorgt für eine verbesserte
  Radverkehrserschließung von Wohn- und Gewerbestandorten. '
challenges: 'Herausforderungen bei der Planung und Umsetzung stellten
  insbesondere die Beleuchtung und der Denkmalschutz dar, aber auch die
  verkehrsrechtliche Widmung sowie die Ausführung des Winterdienstes. Für die
  Installation einer insektenfreundlichen und mittels Bewegungssensor
  gesteuerten LED-Beleuchtung bedurfte es eines Kompromisses mit dem
  Sindelfinger Gemeinderat und der Naturschutzbehörde, welcher den
  Beleuchtungszeitraum eingrenzt. Den Belangen des Denkmalschutzes hinsichtlich
  eines gepflasterten Wegabschnittes einer Militärstraße aus den 1930er-Jahren
  wurde u.a. durch das Offenhalten eines rund 80 m langen Sichtfensters Rechnung
  getragen. Durch die Lage im Wald wird beim Winterdienst ein drei Meter breiter
  Streifen gestreut, um den direkten Salzeintrag über die Bankette hinaus
  (Wurzelbereich der Bäume) zu vermeiden. '
