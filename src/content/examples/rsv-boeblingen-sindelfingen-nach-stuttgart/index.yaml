description: >-
  Baden-Württembergs erste, knapp acht Kilometer lange Radschnellverbindung
  (RSV) führt durch ein bewaldetes Gebiet zwischen den Mittelzentren Böblingen
  und Sindelfingen sowie der Landeshauptstadt Stuttgart. Die RSV verbindet die
  jeweils städtischen Radwegnetze miteinander und sorgt für eine verbesserte
  Radverkehrserschließung von Wohn- und Gewerbestandorten. Sie wurde
  abschnittsweise auf einer alten Militärstraße gebaut und ist mit einer
  bewegungssensorgesteuerten LED-Beleuchtung ausgestattet. 
   
  Zentraler Bestandteil der Strecke ist die historische die historische
  Römerstraße – eine alte gepflasterte Militärstraße aus den 1930er Jahren,
  welche unter der Asphaltdecke konserviert und zu einem kleinen Teil noch
  befahrbar ist. 
   
  Nachdem das Projekt im März 2017 in ein entsprechendes Landes-Förderprogramm
  aufgenommen worden war, konnte im 

  Mai der politische Planungsbeschluss des Kreistages gefasst werden. Die
  Abstimmung mit den Flächeneigentümern und Behörden wie Stadtverwaltungen,
  Natur- und Denkmalschutzämtern sowie den Forstämtern wurde intensiv betrieben,
  um Interessenskonflikte frühzeitig zu erkennen und Kompromisse zu finden. 
   
  Auf eine verkehrsrechtliche Trennung von Fuß- und Radverkehr wurde aufgrund
  der relativ geringen Fußgänger\*innenfrequenz an Werktagen verzichtet. Die
  Wegabschnitte sind zwischen 5,5 und 4 m breit und bieten für alle
  Verkehrsteilnehmenden ausreichend Platz.
