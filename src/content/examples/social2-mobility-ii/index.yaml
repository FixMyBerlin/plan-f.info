description: >-
  In drei Kommunen der Region Hannover werden verschiedene Maßnahmen zur
  Fahrradmobilität und Teilhabe umgesetzt und wissenschaftlich evaluiert. Die
  Maßnahmen umfassen dabei unter anderem die Stärkung selbstorganisierter
  Fahrradwerkstätten, Fahrradkurse, Informationskampagnen, Fahrradaktivitäten
  durch soziale Einrichtungen, Nutzung von Bildungs- und Teilhabeleistungen
  sowie Dialog und Vernetzung. Fahrradmobilität soll damit soziale Teilhabe
  ermöglichen, unter anderem in Hinblick auf Bildung, Versorgung,
  Freizeitgestaltung, Arbeitsplatzwahl, politische Beteiligung und die Pflege
  von sozialen Kontakten. 


  Die Maßnahmen werden in drei Kommunen der Region Hannover (den Städten
  Laatzen, Langenhagen und Ronnneberg) geplant und umgesetzt. Diese umfassen
  kommunenspezifische armutssensible Informationsangebote, ein Mobilitätskonzept
  für ein Familienzentrum, eine mobile Selbsthilfe-Fahrradwerkstatt, die Ausgabe
  von Fahrradreparaturgutscheinen und Fahrradkurse. 


  In zwei Quartieren in Langenhagen und Ronnenberg wurde eine Haushaltsbefragung
  durchgeführt. Die Maßnahmen werden wissenschaftlich evaluiert. Im letzten
  Drittel des Projektes werden ein Handlungsleitfaden erarbeitet und
  Empfehlungen für die Politik und zur Überarbeitung von Förderprogrammen
  formuliert.
goals: |-
  - Sicherheit
  - Mehr Personen fahren Fahrrad
  - Reduktion Mobilitätsarmut
localChallenges: |-
  - Finanzschwache Kommune
  - Hoher Anteil an armutsbedrohten Personen
particularities: |-
  - Evaluation 
  - Beteiligung
