  - Inklusive Maßnahme
  - Spezifische Zielgruppe: armutsbedrohte Menschen
results: 'Ausgangspunkt des Projektes sind die Ergebnisse aus der ersten
  Projektphase: Menschen mit geringem Einkommen fahren seltener Fahrrad, obwohl
  das Fahrrad ein verhältnismäßig günstiges Verkehrsmittel ist. Darüber hinaus
  lernen Kinder aus armutsbedrohten Haushalten im Vergleich zu anderen
  Haushalten erst später Fahrradfahren. Im Rahmen des aktuellen Projektes sollen
  die Gründe dafür (z. B. fehlende Fähigkeiten zum Fahrradfahren und zur
  Reparatur, mangelnde Informationen über kostengünstige Zielgelegenheiten,
  fehlende Versorgung mit Fahrrädern) erforscht und durch Maßnahmen adressiert
  werden.'
challenges: 'Eine wesentliche Herausforderung im Projekt ist in Kontakt mit
  armutsbedrohten Menschen zu kommen und deren Perspektive zur Entwicklung von
  Maßnahmen aufzugreifen. Idealerweise werden Maßnahmen mit armutsbedrohten
  Menschen gemeinsam entwickelt, allerdings ist das Thema Armut mit
  Stigmatisierungen und Vorurteilen behaftet. Die Zusammenarbeit mit sozialen
  Einrichtungen ist dafür ein zentraler Ansatz. Darüber hinaus ist es eine
  Herausforderung, dass Thema Mobilitätsarmut in der Verkehrsplanung zu
  verankern. Die Einbeziehung exkludierter Personengruppen ist zunächst
  ungewohnt und erfordert einen Perspektivwechsel. '
communication: 'Für die Kommunikation der Maßnahmen werden
  zielgruppenspezifische und armutssensible Kampagnen in den drei Kommunen
  organisiert. Darüber hinaus finden regionsweite Dialog- und
  Vernetzungsveranstaltungen statt. '
funding: 'Bundesmittel: 100 Prozent (BMBF: Zukunftsstadt)'
personnelExpenses: Eine Vollzeitstelle in der Kommune, weitere an den
  Universitäten (Universität Frankfurt a. M. und Kassel).
