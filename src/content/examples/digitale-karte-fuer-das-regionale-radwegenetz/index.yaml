description: >-
  Mit dem Regionalen Radwegenetz hat der Regionalverband Ruhr ein
  kategorisiertes und priorisiertes Netz mit – im Endausbau – einer Gesamtlänge
  von über 1.800 Kilometern und 189 Verbindungen für die Metropole Ruhr
  geschaffen. Gemeinsam mit den vier Kreisen, 53 Kommunen, zahlreichen
  Institutionen und Verbänden wurde ein Bedarfsplan für das
  Alltagsradverkehrsnetz in der Metropole Ruhr entwickelt. Erstmals in NRW wurde
  ein Radverkehrsnetz in einer solchen Größenordnung mit 53 Städten
  konzeptioniert. Prämisse bei der Netzplanung war es, unter weitestgehender
  Nutzung des Bestandes eine Anbindung aller Städte und Gemeinden in einem
  verbandsweiten Radverkehrsnetz sicherzustellen. Relevante Verbindungen über
  die Grenzen des Verbandsgebietes hinaus werden ebenfalls berücksichtigt. Die
  kommunale Binnenerschließung wird weiterhin in eigenen Radverkehrskonzeptionen
  der Städte und Gemeinden behandelt.  


  Ein weiterer elementarer Baustein ist das Umsetzungskonzept zur Realisierung
  (2022). Aufbauend auf dem Regionalen Radwegenetz wurde auf Basis einer
  Nutzwertanalyse eine kategorisierte Projekt-Priorisierung der Verbindungen
  erarbeitet. Dazu wurde ein valides und nachvollziehbares Bewertungsschema
  konzipiert und auf die 189 Verbindungen angewendet. Mit der vorliegenden
  Bewertung soll der Ausbau der regionalen Radinfrastruktur vorangetrieben
  werden und eine rasche Umsetzung durch eine Priorisierung aus regionaler Sicht
  unter Berücksichtigung kommunalfachlicher Perspektiven abgeleitet werden. 


  Die maßgeblichen Ergebnisse aus beiden Projekten stehen als Webanwendung zur
  Verfügung. Sie zeigt den Bedarfsplan, die Ausbaustandards und die
  Umsetzungsprioritäten. Nähere Informationen können in den Konzepten zur
  Weiterentwicklung des Regionalen Radwegenetzes für den Alltagsradverkehr und
  zum Umsetzungskonzept eingesehen werden
  (https://www.rvr.ruhr/themen/mobilitaet/bedarfsplan-radwegenetz/).  


  Die Webanwendung stellt den Planungsstand 2019 dar. Die Verbindungen befinden
  sich daher teilweise noch im Ausbau und die Linienführungen können sich noch
  ändern.
