description: >-
  Seit August 2007 verschickt die Stadt Offenburg jeweils zum Monatsbeginn
  Neubürger\*innenbegrüßungspakete an Menschen, die sich im Bürger\*innenbüro
  angemeldet haben. Mit an Bord sind jede Menge Informationen rund ums Radfahren
  in der Stadt und der Umgebung: Diese sind inzwischen in einem großen Faltblatt
  kombiniert, das auch eine Radwegekarte und weitere Informationen zur
  nachhaltigen Mobilität enthält. Ergänzt wird das Paket noch durch jährlich
  aktualisierte Informationsbroschüren (Infos zu Radfahrvereinen und
  Verkehrsclubs, ein Informationsblatt mit Aufkleber des Scherbentelefons, die
  Broschüre „Offenburger Fahrradsommer“ Radtourenvorschläge und einige
  Gutscheine. Der Inhalt des Begrüßungspakets kann saisonal abweichen.
  Anmerkung: Derzeit ist das Paket wieder in einer Überarbeitungsphase.
  PDF-Dateien mit den aktuellen Informationen und Gutscheinen werden
  mitgeschickt. Die sonstigen Beilagen variieren je nach aktuellen Projekten. 
    
  Neubürger\*innen, die sich die sich verspätet umgemeldet haben, können aus
  technischen Gründen nicht automatisch ein Begrüßungspaket geschickt bekommen.
  Zum Teil haben sie bei der Stadt dann proaktiv ein Paket angefordert und
  erhalten. Das zeigt, dass das Neubürger\*innenbegrüßungspaket positiv
  aufgenommen und weiterempfohlen wird.  
    
  Menschen sind nach einem Umzug besonders empfänglich für Informationen in
  Bezug auf die Mobilität, da sie ihre Wege neu planen müssen. Die Radwegekarte
  trägt dazu bei, Radfahrende auf sichere und komfortable Routen zu leiten.
  Somit hilft die Karte beim Steigern des Radverkehrsanteils. Denn wer sicher
  und bequem mit dem Fahrrad unterwegs ist, radelt auch gerne.
goals: |-
  - Mehr Personen fahren Fahrrad 
  - Fahrrad steigt in der Wahrnehmung / Statussymbol 
  - Reduktion Mobilitätsarmut 
  - Reduktion privater Autoverkehr (sogenannter MIV) 
  - Klima- und Umweltschutz
localChallenges: |-
  - Flächenkonflikte
  - Viele MIV-Einpendler\*innen, da Offenburg sehr viele Arbeitsplätze bietet
particularities: |
  - Einsteiger*\innenmaßnahme
  - Spezifische Zielgruppe: Neubürger\*innen
results: >-
  Stichprobenartige Rückfragen bei den Neubürger\*innen zeigen, dass diese die
  erhaltenen Informationen als sehr nützlich erachten. Insbesondere die
  Radwegekarte sei hilfreich, um für Arbeits- und Schulwege strecken zu finden,
  die hauptsächlich über Radwege und durch fahrradfreundliche Straßen
  verlaufen.  
   
  Lebensumbrüche, wie Umzüge, sind Momente, wo sich Mobilitätsroutinen ändern.
  An diese knüpft die Stadt Offenburg mit dem Begrüßungspaket an und fördert die
  nachhaltige Mobilität der Neubürger\*innen. 
challenges: Die Informationen aktuell und übersichtlich zu halten
