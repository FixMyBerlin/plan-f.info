description: >-
  Wer mit dem Fahrrad auf eine Ampel zufährt und weiß, wann sie umschaltet, kann
  die Geschwindigkeit anpassen, um komfortabel und im „Flow“ bei Grün
  durchzufahren. Das ist die Idee hinter dem Grüne-Welle-Assistent Leezenflow:
  Auf einer digitalen Anzeige ist anhand des Farbverlaufs bereits mehrere Meter
  vor der nächsten Straßenkreuzung zu sehen, wie lange die aktuelle Ampelphase
  noch andauert. Dadurch können Radfahrende die Geschwindigkeit individuell
  anpassen und kommen flüssiger und sicherer ans Ziel. Der Leezenflow ist mit
  der jeweiligen Fahrradampel verbunden und ändert die Länge des Farbverlaufs
  dynamisch. Das System bietet nicht nur mehr Komfort, sondern führt im
  Idealfall zu weniger Rotlichtverstößen. 
   
  Seit dem 17. Mai 2021 wird der Prototyp Leezenflow an der Kreuzung Hörstertor
  auf Münsters Promenade getestet. Im Rahmen der Testphase führte das Institut
  für Verkehrswissenschaft der WWU Münster im Auftrag der Stadt Münster eine
  wissenschaftliche Evaluation durch. Diese bestand aus einer
  Online-Bürger\*innen-Umfrage, an der 546 Personen teilgenommen haben, sowie
  Verkehrsbeobachtungen und -messungen vor Ort. Das Ziel der Untersuchung war,
  Aussagen darüber treffen zu können, inwiefern Leezenflow den Radverkehrsfluss
  verbessert, die Verkehrssicherheit nicht beeinträchtigt und die
  Radfahrer\*innen mit dem Prototypen zufrieden sind. 
   
  Insgesamt ist das Leezenflow-System positiv bewertet worden, so dass der
  Ausschuss für Verkehr und Mobilität der Stadt Münster im Mai 2022 beschlossen
  hat,  bis zu zehnweitere Leezenflow-Systeme an geplanten Velorouten
  (Anbindungen an das Umlandgemeinden) zu installieren. Diese Geräte werden bis
  zum Sommer 2023 in Betrieb genommen und durch eine weitere Untersuchung
  begleitet.
