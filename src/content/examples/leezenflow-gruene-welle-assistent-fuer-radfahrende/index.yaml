results: 'Der Leezenflow erhöht den Komfort für Radfahrende und verbessert den
  Verkehrsfluss. Die Bevölkerung nimmt den Leezenflow gut an, sodass die Stadt
  Münster nun weitere Anzeigetafeln installiert. '
challenges: >-
  Die größte Herausforderung ist, zu erklären wie Leezenflow funktioniert. An
  der aktuellen Teststelle dürfen wir keine Erklärschilder dauerhaft befestigen.
  Auf der Homepage erklären wir das System, aber nicht vor Ort. 

  Via twitter kritisierten Münsteraner „Fahrrad-Freaks“ immer mal wieder das
  System, weil sie es nicht verstanden haben bzw. verstehen wollten und somit in
  Frage stellten.
