description: >-
  Das Projekt verfolgt die Ziele des Landes Nordrhein-Westfalen (NRW), durch die
  Förderung von Radinfrastruktur mehr Lebensqualität zu schaffen und
  Alternativen zum Pkw anzubieten. Im Rheinischen Revier stoßen die für die
  Verflechtung zu den umgebenden Ballungsräumen notwendigen Infrastrukturen an
  ihre Kapazitätsgrenzen. Durch eine koordinierte, übergreifende und
  insbesondere durchgängige Gesamtentwicklung eines innovativen
  Radverkehrsnetzes werden Qualität und Quantität der Infrastruktur erhöht,
  sodass die Attraktivität und Bedeutung des Radverkehrs als Mobilitätsform für
  Alltagsverkehre steigt. 


  Die Stärke des entstehenden regionalen Radverkehrsnetzes liegt sowohl in der
  Schaffung von Synergien zwischen Alltagsverkehren und touristischen Routen als
  auch in einer engen Verzahnung des Radverkehrs mit anderen Verkehrsträgern und
  Mobilitätskonzepten. 


  Durch das stetige Netzwerkmanagement wird der gesamte Prozess mit Blick auf
  das Rheinisches Revier als Einheit koordiniert und die Entwicklung hin zu
  einer Modellregion für innovativen Radverkehr unterstützt. Durch die zeitnahe
  Maßnahmenumsetzung entsteht die für den Radverkehr im Rheinischen Revier
  notwendige Infrastruktur.
goals: |-
  - Komfort und Fahrspaß  
  - Mehr Personen fahren Fahrrad 
  - Fahrrad steigt in der Wahrnehmung / Statussymbol  
  - Reduktion privater Autoverkehr (sogenannter MIV)
  - Klima- und Umweltschutz
localChallenges: |-
  - Flächenkonflikte
  - geteilte Planungszuständigkeiten
  - Topographie
  - Sehr geringer Radverkehrsanteil (unter 5 Prozent)
  - polyzentrale Struktur/Zersiedelung 
  - fehlende Konzepte
  - Kaum/keine Angebote ÖPNV 
  - Finanzschwache Kommune
particularities: |-
  - Interkommunal
  - Einsteiger\*innenmaßnahme
results: 'Das Ergebnis des Gesamtregionalen Radverkehrskonzeptes (Projektphase
  1) umfasst u. a. den Netzplan eines idealtypischen Radverkehrsnetzes für das
  Rheinische Revier sowie einen detaillierten Maßnahmenplan mit ca. 1.300
  Einzelmaßnahmen, der als Grundlage für die tatsächliche Umsetzung des
  Netzplans und den Aus- bzw. Neubau von Radverbindungen dienen soll. '
challenges: 'Die Koordinierung und Abstimmung zwischen den verschiedenen
  Fördermöglichkeiten zum Teil zeitlich personell und rechtlich sehr aufwendig.
  '
