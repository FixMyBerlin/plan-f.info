description: >-
  Bei den sogenannten „fahrradfreundlichen Nebenstraßen“ werden zunächst
  provisorische Maßnahmen wie z. B. Markierungslösungen, Beschilderung für
  geänderte Verkehrsführungen, Fahrradbügel, Poller, markierte „Gehwegnasen“
  (gedanklich vorgezogene Bürger\*innensteige an Kreuzungen, welche das Zuparken
  dieser verhindern und das sichere Überqueren erleichtern) und weitere
  stadtgestalterische Elemente, umgesetzt. Bei Bewährung der Maßnahmen sollen
  diese in einer zweiten Realisierungsstufe baulich umgesetzt werden. Falls die
  Folgen negativ sein sollten, kann auch eine Rücknahme oder Anpassung
  erfolgen. 


  Ab dem Herbst 2022 erfolgte eine Bestückung des Multifunktionsstreifens mit
  mobilem Straßenraummobiliar in Form von nichtkommerziellen Parklets sowie
  großen, mit geeigneten Bäumen und passender Unterpflanzung versehenen
  nachhaltigen Pflanzbehältern. Weitere auffällige Pflanztöpfe stehen als hot
  spots an exponierten Stellen. 


  Bis zum Frühjahr 2023 wurde die provisorische Umgestaltung abgeschlossen.
  Einzelne Flächen sind mit ansprechenden Sitzgelegenheiten und weiterem
  Mobiliar nachgerüstet worden und tragen hoffentlich zu einem positiven
  Lebensgefühl der Anwohnenden und Flanierenden in ihrer Straße bei. Die
  wissenschaftliche Evaluierung erfolgt bis zum Sommer 2024 und wird die Frage
  beantworten, ob eine bauliche Manifestierung der Maßnahmen erfolgen soll. 


  Im Rahmen der wissenschaftlichen Begleitung nutzt das Research Lab for Urban
  Transport (ReLUT) diverse Methoden (Zählungen, Befragungen, Beobachtungen
  etc.), um die Wirkungen der Umgestaltungsmaßnahmen zu ermitteln und
  übertragbare Handlungsempfehlungen für die kommunale Praxis abzuleiten.
goals: >-
  - Sicherheit 

  - Komfort und Fahrspaß

  - Mehr Personen fahren Fahrrad 

  - Fahrrad steigt in der Wahrnehmung / Statussymbol

  - Reduktion privater Autoverkehr

  - Klima- und Umweltschutz 

  - Flächengerechtigkeit 

  - Verkehrsberuhigung, Geschwindigkeitsreduktion des MIV, Verbesserung für Fuß-
  und Radverkehr, Steigerung der Aufenthalts- und Lebensqualität, Innovative und
  bisher nicht erprobte Maßnahmen auf ihre Wirkung in Bezug auf den Fuß-, Rad-
  und Kfz-Verkehr evaluieren
