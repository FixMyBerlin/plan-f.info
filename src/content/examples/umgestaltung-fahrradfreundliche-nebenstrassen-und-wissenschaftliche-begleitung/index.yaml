results: 'Es sollen in den kommenden Jahren insgesamt elf Nebenstraßen
  fahrradfreundlich umgestaltet werden. '
challenges: "Unterschiedliche Akteur\\*innen und Betroffene mit verschiedenen
  Erwartungen/ Wünschen zusammenbringen (Anwohner\\*innen, Geschäftstreibende,
  Gastronomie, Durchgangsverkehr/ Zu Fuß Gehende, Radfahrende, Kfz-Nutzende),
  Reduktion der Parkflächen sowie Zufahrtbeschränkungen mit der Folge
  unerwünschter Verkehrsverlagerungen werden stark diskutiert. Anteil der
  öffentlichen Beteiligung ist sehr hoch. Politisches Interesse stark.
  Medienecho sehr stark und oft negativ.   "
