description: >-
  Noch sieht man sie selten im Bergischen Land, aber die Zahl ihrer Fans wächst:
  E-Lastenräder sind umweltschonende Kraftpakete. 38 davon hat der Verein LEADER
  Bergisches Wasserland für Nutzende angeschafft und im Rahmen einer
  Nutzungsvereinbarung an die Nutzenden weitergegeben. Sie erhalten letzten
  Endes 75 Prozent des Anschaffungspreises, die Deckelung betrug jedoch 4.500
  Euro Förderung. Finanziert wird die Anschaffung über das EU-Förderprogramm
  LEADER, aufgestockt mit Vereinsmitteln. Das Institut für Mobilität und
  Verkehrssysteme an der Hochschule Bochum begleitet und evaluiert die Nutzung
  der Lastenräder. 


  Wichtig für die Auswahl der geförderten Bewerber\*innen war neben der
  voraussichtlich gefahrenen Strecke auch die Vorbildwirkung gewesen. Welches
  Fahrrad geeignet ist, wurde je nach Bedarf entschieden - eine junge Familie
  braucht ein anderes Modell als eine Person, die schweres Material
  transportieren möchte. Daher wählten die Nutzenden auch E-Lastenräder von ganz
  vielen unterschiedlichen Hersteller\*innen aus. Die Preisspanne fange bei etwa
  2.500 Euro an und gehe bis zu 8.000 Euro.  


  Die Jury zur Auswahl der Bewerber\*innen bildeten jeweils ein\*e Vertreter\*in
  vom Zukunftsnetzwerk Mobilität NRW, der Wirtschaftsförderung des
  Oberbergischen Kreises, LEADER, der Hochschule Bochum und dem
  Mobilitätsmanagement des Rheinisch-Bergischen Kreises.
