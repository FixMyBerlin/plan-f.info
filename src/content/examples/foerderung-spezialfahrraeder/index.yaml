description: >-
  Die Stadt Bocholt unterstützt Bürger\*innen mit körperlichen Einschränkungen
  oder Assistenzbedarf bei der Anschaffung eines geeigneten Spezial-Fahrrades. 


  Voraussetzung: Es muss sich um ein Dreirad oder ein Spezialrad für den
  Transport einer weiteren Person handeln und es muss ein
  Schwerbehindertenausweis vorgelegt werden können. Die Höhe der Unterstützung
  beträgt einmalig 30 Prozent des Kaufbetrages, maximal jedoch 2.500 Euro. 


  Mit dem Fahrrad unterwegs zu sein, ist in Bocholt Teil der Lebensqualität,
  Spaß an der Bewegung im Freien, Alltags- und Freizeitvergnügen. Die Stadt
  hofft, dass dies in Zukunft noch für ein paar Menschen mehr gilt. 


  Das Antragsformular steht digital zur Verfügung und kann direkt am Computer
  ausgefüllt und versendet werden. Wer inhaltliche Fragen hat, kann sich an die
  Bocholter Umweltreferentin wenden.
