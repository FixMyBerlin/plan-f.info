description: >-
  Ziel dieser Umgestaltung war es, dem besonders hohen Radverkehrsaufkommen auf
  diesem Schlüsselabschnitt zwischen der östlichen Alsterachse und dem
  Rathausmarkt komfortable und zügig befahrbare Radfahrstreifen in beiden
  Richtungen anzubieten und gleichzeitig dem hohen Fußverkehrsaufkommen Raum zu
  geben. Dazu wurden die ca. ein Meter breiten und teilweise aufgebrochenen
  Radwege ausgebaut und der Kfz-Verkehr wird künftig auf zwei Fahrspuren
  geführt. Die Verkehrszahlen der letzten Jahre zeigen auf diesem
  Straßenabschnitt rückläufige Kfz-Mengen (zirka 19.000 Kfz pro Tag in 2014 auf
  zirka 13.500 Kfz pro Tag in 2017) bei gleichzeitig steigendem Radverkehr
  (knapp 1.000 Radfahrende pro Tag in 2017). 
   
  Auf einer Länge von fast 700 Metern wurde der gesamte Straßenraum ohne den
  Knoten Glockengießerwall / Ferdinandstor / Lombardsbrücke bis zu den
  Alsterarkaden / Höhe Reesendammbrücke am Jungfernstieg in mehreren Bauphasen
  umgebaut und aufgewertet. Die Baumaßnahme erstreckte sich dabei vom Geländer
  der Böschung Binnenalster bis zu den Gebäudefassaden auf einer Breite von
  durchschnittlich 33 Metern. 
   
  Seit der Umsetzung ist der Radverkehr auf 2,25 bis 4,75 Meter breiten
  Radfahrstreifen komfortabel unterwegs. Die Entwässerungsrinne wurde außerhalb
  des Radfahrstreifens Richtung Fahrbahnmitte verlegt, sodass faktisch die
  gesamte Breite zum Radeln zur Verfügung steht. Durch zusätzliche bauliche
  Schutzmaßnahmen im Bereich der Kreuzungen wird der Radverkehr nun gegenüber
  dem Kfz-Verkehr gesichert.  
   
  Durch die Kooperation mit Stromnetz Hamburg und anderen Leitungsträgern wurden
  mehrere Bautätigkeiten in einer Baustelleneinrichtung gebündelt.
goals: |-
