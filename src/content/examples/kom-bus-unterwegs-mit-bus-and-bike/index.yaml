description: >
  „Fahrradmitnahme leicht gemacht.“ So lautet das Motto bei KomBus GmbH aus Bad
  Lobenstein. Im Regionalverkehr ist dauerhaft die Mitnahme von ein bis zwei
  Fahrrädern gestattet, wobei Rollstühle und Kinderwägen Vorrang haben. Die
  Beförderung des Fahrrades kostet 1,70 Euro für 360 Minuten im gesamten Gebiet
  des Verkehrsverbundes Mittelthüringen.


  Für den touristischen Verkehr wird das Angebot an Wochenenden und Feiertagen
  deutlich ausgeweitet, mit entsprechenden Anhängern oder Gepäckträgern. Dafür
  wurde auch eine Broschüre mit Routenvorschlägen veröffentlicht.


  Während vier Fahrradbusse mit Anhängern für jeweils 16 Räder überwiegend an
  Wochenenden und Feiertagen von Saalfeld nach Neuhaus und auf der
  Thüringer-Meer-Linie verkehren, ist inzwischen auf fast allen anderen Linien
  durchgängig die Mitnahme von Fahrrädern möglich. Dafür wurden über 100 Busse
  mit Radgepäckträgern, einer Eigenentwicklung von KomBus, ausgestattet.
