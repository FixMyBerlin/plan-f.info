description: >-
  Die knappen finanziellen und personellen Ressourcen der Stadt verzögern nicht
  nur strategisch gewünschte Maßnahmen wie den Bau von Radschnellwegen, sondern
  sind auch bei kleineren Maßnahmen nicht immer effizient, weil die genaue
  Kenntnis der lokalen Gegebenheiten in der Verwaltung nicht immer vorhanden
  ist. 
   
  Zwei Personen helfen daher als Radwegepat*\innen aus. Diese wurden im Juni
  2020 von der Oberbürgermeisterin der Stadt Ludwigshafen für einen
  Pilotzeitraum von zwei Jahren ernannt.   


  Durch die Präsenz vor Ort können sie die aktuelle Situation vor Ort schnell an
  die Stadtverwaltung mittels moderner Techniken (Fotos, E-Mail, GPS-Daten usw.)
  übermitteln. Durch bessere Kommunikation zwischen den Radwegpat\*innen, der
  fachlich agierenden Verwaltung, dem Baudezernat als Vertretung des
  Stadtvorstands und dem Ortsvorstand als Vertretung des Ortsbeirats können
  schnellere und bessere Lösungen erarbeitet werden. 
   
  Die Radwegepat\*innen müssen folgende Voraussetzungen mitbringen: 


  • Ausgeprägte Ortskenntnisse 


  • Regelmäßige Nutzung des Fahrrads vor Ort 


  • Ehrenamtliche und unentgeltliche Mitarbeit 


  • Ernennung durch Stadtverwaltung/Ortsvorstehende 


  • Wünschenswert: arbeiten als Tandem (zeitnahe Ansprechbarkeit, interner
  Diskussionspartner\*innen als mögliches Korrektiv)
goals: |-
  - Sicherheit 
  - Mehr Personen fahren Fahrrad 
  - Reduktion privater Autoverkehr (sogenannter MIV)
  - Klima- und Umweltschutz
localChallenges: |-
  - Finanzschwache Kommune
  - Fehlende Konzepte
  - Geld- und Personalmangel bei der Stadt sowie verteilte Zuständigkeiten
particularities: |-
  - Beteiligung
  - Einsteiger\*innenmaßnahme 
  - Quick-Win
  - Temporäre Maßnahme
results: 'Innerhalb des ersten halben Jahres konnten bereits einige
  Verbesserungsvorschläge umgesetzt werden. '
challenges: "Kommunikation auf Augenhöhe! Das bedeutet Informationsfluss in
  beide Richtungen. Bedingt durch die Ressourcenengpässe der Stadtverwaltung
  erhalten wir nur selten Rückmeldungen. Auch wenn Maßnahmen umgesetzt wurden,
  sind wir Radwegpat\\*innen meist die ersten, die das mitbekommen und
  informieren die Stadtverwaltung. Es müsste meiner Ansicht nach andersherum
  sein. "
communication: Keine Angabe
funding: 'Eigenmittel: 100 Prozent'
personnelExpenses: 'Das kann nur die Verwaltung abschätzen. Auf jeden Fall
  Zusatzaufwand erforderlich, um Dinge umzusetzen, die sonst nicht angegangen
  würden. Langfristige Maßnahmen, die auf Dauer Wartungsaufwand sparen würden
  (z. B. Verlegung Radweg von einer unbefestigten auf eine asphaltierte
  Strecke), wurden noch nicht angegangen. '
