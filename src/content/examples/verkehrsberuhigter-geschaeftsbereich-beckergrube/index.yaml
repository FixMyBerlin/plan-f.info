description: >
  Die Neugestaltung der Beckergrube wurde bei der Beschließung des Rahmenplans
  Innenstadt mit Mobilitätskonzept im Jahr 2019 als Schlüsselprojekt der ersten
  Umsetzungsstufe benannt. Die Verwaltung ist beauftragt, unter Durchführung
  eines Verkehrsversuchs und anschließenden freiraumplanerischen Wettbewerbs,
  eine Neugestaltung vorzunehmen. Übergeordnete Aufgaben sind eine
  Verkehrsberuhigung in Verbindung mit einer Stärkung des klimafreundlichen
  Verkehrs, attraktive Aufenthaltsqualitäten sowie eine baukulturelle und
  funktionale „Wiedereingliederung“ in die Lübecker Altstadt. 

  Unter dem Motto „Lübeck geht los!“ startete in 2020 ein Verkehrsversuch, um
  die Umsetzbarkeit der verkehrlichen Zielsetzung zu prüfen. Autoverkehr ohne
  Ziel auf der Altstadtinsel wird umgelenkt. Der Straßenraum wurde provisorisch
  zurückgebaut und die freigewordenen Flächen mit temporären Maßnahmen, wie
  Fahrradmodulen, mobilen Baumstandorten und Sitzbänken bespielt. 


  Der Verkehrsversuch wurde als Planungsinstrument herangezogen, um testweise
  aufzuzeigen, welche Veränderungen möglich sind und wie bereits mit geringen
  Mitteln Qualitäten geschaffen und Problemstellungen behoben werden können. Es
  konnte eine Reduzierung des Verkehrsaufkommens von mehr als 50 Prozent
  erreicht werden. Etwa 3.000 Kfz pro Tag sind weiterhin zufahrtsberechtigt,
  darunter der ÖPNV, Anlieferverkehr und Anlieger\*innen. 

  Der provisorische Umbau umfasste eine Verringerung der Fahrbahnbreite von zehn
  auf sechs Meter, die Verlegung und den barrierefreien Ausbau der zwei
  Bushaltestellen sowie die Anordnung von Seitenstreifen, die als
  Multifunktionsflächen dem Lieferverkehr, dem Parken für Menschen mit
  Behinderung, Taxen sowie als Abstellfläche für Fahrräder dienen. Insgesamt
  wurden in diesem Zuge 19 Kurzzeitparkplätze umfunktioniert und so eine
  Neuaufteilung der Flächen erreicht. Zusätzlich wurden Abstellanlagen für über
  100 Fahrräder installiert sowie zehn urbane Sitzmöbel und neun Bäume in großen
  Pflanzkisten aufgestellt. Der provisorische Umbau ist auf drei Jahre angelegt.


  Bereits nach kurzer Zeit konnten Aneignungsprozesse in der Beckergrube
  beobachtet werden: Gastronomische Betriebe erweiterten ihre Außenbereiche,
  eine Initiative organisierte ein Urban Gardening-Projekt und auf einer
  Multifunktionsfläche finden Tanzabende und kleinere Veranstaltungen statt. Die
  Resonanz auf den Verkehrsversuch wurde als sehr positiv wahrgenommen. Ein
  gegründeter Beirat aus Anlieger\*innen, Vertreter\*innen der lokalen
  Wirtschaft, der Technischen Hochschule Lübeck und einer kritischen Fachwelt
  sind von Beginn konstruktive Begleiter\*innen.


  Der 2022 ausgelobte freiraumplanerische Wettbewerb knüpft an den
  Verkehrsversuch an und überträgt die bereits spürbaren positiven Entwicklungen
  auf die gesamte Beckergrube. Die bauliche Umsetzung des ersten, östlichen
  Bauabschnitts wird durch Fördermittel aus dem Bundesprogramm Nationale
  Projekte des Städtebaus finanziert. 

  Auch der Straßenraum der westlichen Beckergrube soll auf ein Mindestmaß
  zurückgebaut werden. Es erfolgt eine Neuordnung des ruhenden Verkehrs in der
  gesamten Beckergrube durch Verlagerungen von Parkplatzangeboten und die
  Ausweisung von Ladezonen.


  Der Stadtraum wird neu aufgeteilt und mit einer hochwertigen
  Oberflächengestaltung, vielen Baumpflanzungen und einer ästhetischen
  Möblierung ausgebildet. Die „zurückgewonnenen“ Flächen erhalten durch neues
  Stadtgrün, platzartige Aufweitungen, konsumfreie Sitzgelegenheiten sowie
  Aneignungsflächen für urbane Initiativen und kulturelle Angebote, heute nicht
  vorhandene Qualitäten. Gleichzeitig sollen die vielfältigen Nutzungen in der
  Beckergrube durch eine bewusste Ausbildung der Schnittstelle von bebautem und
  unbebautem Raum, mit Flächen für Außengastronomie und Warenauslagen und einem
  „Ort“ für das Stadttheater gestärkt werden.
goals: >
  - Sicherheit

  - Reduktion privater Autoverkehr (sogenannter MIV)

  - Flächengerechtigkeit

  - Priorisierung der Bedarfe des langsamen Verkehrs (zu Fuß gehende und
  Radfahrende)

  - Steigerung der Aufenthaltsqualität, um dem Strukturwandel zu begegnen
localChallenges: |-
  - Flächenkonflikte
  - Mobilitätswende umsetzen
particularities: >
  - Evaluation

  - Beteiligung

  - Verkehrsversuch oder Modellvorhaben

  - Inklusive Maßnahme (Erhöhung Zugänge / Gerechtigkeit)

  - Spezifische Zielgruppe: Lasten- und Lieferverkehr, Tourist\*innen, Sonstige
  Anlieger\*innen
results: Im Ergebnis zeigt sich, dass mit der neuen Verkehrsführung und den
  begleitenden Maßnahmen eine Reduzierung des Kfz-Verkehrs um die Hälfte
  erfolgte, wobei die Veränderung allein durch die Herausnahme des Verkehrs ohne
  Ziel in der Innenstadt (Durchgangsverkehr) erreicht wurde. Dem ÖPNV sowie dem
  Rad- und Fußverkehr konnte eine erfahrbar höhere Priorität eingeräumt werden.
  Es entstanden sichere und staufreie Wegebeziehungen ohne negative Auswirkungen
  auf angrenzende Straßenräume. Die Ausweisung eines verkehrsberuhigten
  Geschäftsbereichs mit Zufahrtsbeschränkungen und einem Tempolimit von 20 km/h
  ist ein funktionierendes Instrument zur Umsetzung des Schlüsselprojekts
  Beckergrube.
challenges: Das Motto des Projekts – Lübeck geht los! – konnte aufgrund der
  durch die Covid-19 Pandemie bedingten Einschränkungen zunächst nicht in vollem
  Umfang umgesetzt werden. Bau- und Sanierungsmaßnahmen im direkten Umfeld
  schränken die Zugänglichkeit und Aufenthaltsqualität ein.
communication: Zwei rote Hinweis-, Info- und Ausstellungscontainer mit einer
  wechselnden Ausstellung (das Öffnen und Schließen haben Paten übernommen),
  Gläserner Planungsworkshop, Informationsrunden mit Gewerbetreibenden etc.,
  verschiedene Aktionen in der Beckergrube während des Verkehrsversuchs,
  Teilnahme Europäische Aktionswoche, erfolgreiche Bewerbung um Deutschen
  Verkehrsplanungspreis 2022.
