description: >-
  Der große Lückenschluss im Mannheimer Radverkehrsnetz ermöglicht es, dass
  Radfahrende nun sicher und komfortabel über die Bismarckstraße (40.000
  Kfz/Tag) fahren können. Außerdem sind die Universität und der Hauptbahnhof
  seit Abschluss der Arbeiten optimal an das Radnetz angebunden. Möglich macht
  dies die neugestaltete Verkehrsführung auf der rund 1,5 Kilometer langen
  Bismarckstraße, die als Bundesstraße eine große verkehrliche Bedeutung
  genießt. 
   
  Im Zuge der Neugestaltung wurden neben einem Radweg ebenso eine Umweltspur
  gebildet, die Ampeln auf den neuesten Stand gebracht und die Barrierefreiheit
  erhöht.  
   
  Die Bismarckstraße ist nicht nur eine wichtige innerstädtische Route für den
  Radverkehr – sie ist auch Teil des RadNETZ-Baden-Württemberg. Durch den Ausbau
  konnte nicht nur die Verkehrssicherheit erhöht, sondern auch Flächen zugunsten
  des Umweltverbundes umverteilt werden.  
   
  Die Fläche des überplanten Gebietes beträgt auf einer Länge von rund 1,5
  Kilometern rund 24.000 Quadratmeter. Auf dieser Fläche wurde eine 2.200 Meter
  lange Radwegführung hergestellt. Im Streckenabschnitt L 4 bis A 5 wurde zudem
  eine drei Meter breite "Umweltspur" eingerichtet. Hierbei handelt es sich um
  einen Radfahrstreifen mit einer Freigabe für den Busverkehr. Im Vergleich zu
  Bussonderfahrstreifen dürfen Busse einen solchen Sonderfahrstreifen benutzen,
  müssen dies aber nicht.
