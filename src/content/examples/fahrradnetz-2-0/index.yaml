description: >-
  Münster ist „Fahrradstadt“. Der Radverkehr ist omnipräsent und seit
  Jahrzehnten - auch als Marke – Stadtbild-prägend. Durch das dynamische
  Bevölkerungswachstum wird ein noch weiter zunehmendes Radverkehrsaufkommen
  erwartet. Hierbei treffen die Herausforderungen einer wachsenden Stadt
  zusammen mit den wichtigen Fragestellungen des Klima- und Umweltschutzes, der
  Klimaanpassung, der Flächenumverteilung des öffentlichen Raumes sowie damit
  verbunden der Lebens- und Aufenthaltsqualität einer Stadt. Um diesen
  Anforderungen gerecht zu werden und eine zukunftsgerechte und
  angebotsorientierte Radverkehrsinfrastruktur zu entwickeln, hat die Stadt
  Münster erstmalig sowie unter Einbindung der Öffentlichkeit und einer Vielzahl
  relevanter Stakeholder ein hierarchisches und lückenloses Radverkehrsnetz
  erarbeitet: das Fahrradnetz 2.0.  


  Ablauf  


  1. Grundlagenbeschluss (2020)  

  2. Erster Netzentwurf (2021)  

  3. Workshops (Verwaltung Stakeholder) (2021)  

  4. Öffentliche Trackingkampagne (2021)  

  5. Zweiter Netzentwurf (2021)  

  6. Workshop und öffentliche digitale Beteiligung (2022) 

  7. Politischer Beschluss des finalen Netzentwurfs (2022) 

  8. Handlungsempfehlungen und Maßnahmenliste (2022/2023)  


  Das Projekt zeichnet sich durch eine umfangreiche Beteiligung aus. Neben
  verschiedenen Workshops mit Politik, Verwaltung und Interessensgruppen gab es
  zwei öffentliche Beteiligungsveranstaltungen: Im Frühjahr 2021 wurde eine
  Trackingkampagne per App durchgeführt, bei der sich 2.000 Menschen mit fast
  23.000 Einzelwegen und 160.000 aufgezeichneten Wegen beteiligt haben. Im Jahr
  2022 konnte der Netzentwurf digital kommentiert werden – hier haben über 600
  Interessierte über 3.000 Hinweise eingereicht.
