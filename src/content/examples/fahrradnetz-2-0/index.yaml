results: "Die frühzeitige und intensive Beteiligung unterschiedlicher
  Akteur\\*innen ist wichtiger Bestandteil des Prozesses: Einerseits kann damit
  auf ein umfangreiches Wissen zurückgegriffen und mit dieser Expertise
  verfeinert werden, andererseits erhöht sich die Akzeptanz des Vorhabens.
  Wichtig ist, dass es sich um eine ehrliche Beteiligung mit
  Mitgestaltungsspielraum handelt, die deutlich über eine einfache Information
  des Vorhabens hinausgeht."
challenges: 'Die größte Herausforderung bestand sicherlich darin die
  unterschiedlichen Detailinteressen miteinander in Einklang zu bringen - auch
  wenn das große Ganze (Fahrradnetz 2.0) unstrittig ist. Insbesondere die
  ausgewogene Berücksichtigung der unterschiedlichen Stadtteile sowie der
  Innenstadt ist hier zu nennen. '
