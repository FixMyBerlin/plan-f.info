description: >-
  Erste Überlegungen zu einem automatisierten Fahrradparkhaus gab es bereits im
  Jahr 2013 im Rahmen der Konzeption „Bahnhof der Zukunft“. Konkretisierung im
  Zuge des RegioWin-Projekts „Regionale Mobilitätspunkte“ des Verbands Region
  Stuttgart (2014-2020) - Leuchtturmprojekt „Automatisches Fahrradparkhaus“ als
  Teilbeitrag. 


  Projektinhalt und -ziele:  

  - Schaffung von regionalen Mobilitätspunkten als Drehscheibe für
  unterschiedliche Verkehrsarten mit großem Mobilitätsangebot sowie guten
  Abstellmöglichkeiten insbesondere für Fahrräder; Steigerung der Attraktivität
  eines Umstieges auf den ÖPNV und Förderung des Radverkehrs in der Region
  Stuttgart; Förderung von Multimodalität   

  - Städtebauliche Aufwertung des Fellbacher Bahnhofsbereiches sowie Gestaltung
  der Freiflächen; Förderung nachhaltiger Mobilität (insbesondere
  Berufspendler\*innen)  


  1. Entwurf und Bau eines oberirdischen vollautomatisierten Fahrradparkhauses
  am Fellbacher Bahnhof: Paternoster-Anlage mit 79 Stellplätzen (vier Module à
  19 Gondeln auf einer Grundfläche von 533m x 574m) 
   
  2. Entwicklung einer App zur Abwicklung von Buchungs- und Bezahlvorgängen:
  Managementsystem für Tages- Kurz- und Langzeitmieten inkl. Reservierungs- und
  Bezahlmöglichkeiten via betreiberseitigem Stripe Account  


  3. Integration PolygoCard (VVS Stuttgart) als Zugangskarte zum
  Fahrradparkhaus 
goals: |-
  - Sicherheit 
  - Komfort und Fahrspaß 
  - Überwindung weiter Distanzen 
  - Mehr Personen fahren Fahrrad 
  - Stärkung Umweltverbund und Multimodalität
localChallenges: Flächenkonflikte
particularities: |-
  - Evaluation
  - Spezifische Zielgruppe: Pendler\*innen, Schüler\*innen, Tourist\*innen
results: >-
  - Erfolgreicher Betrieb eines automatisierten Fahrradparkhauses (79
  Stellplätze) mit App-Zugang und flexibler Nutzungsmöglichkeit (Abos
  Tagesparken)  

  - sichere und zugleich kostengünstige (gleiche Preise wie Fellbacher
  Radstation) Abstellmöglichkeit an zentralem Verkehrsknotenpunkt insbesondere
  für hochwertige Fahrräder und Pedelecs  

  - Schaffung einer attraktiven Lösung für Pendler\*innen, aber auch für
  Freizeitradelnde und Tourist\*innen (24 Stunden zugängliches Fahrradparkhaus,
  Zugriffzeit 15 - maximal 35 Sekunden) 
challenges: "Insbesondere Pandemie als Faktor, der zu zeitlichen Verzögerungen
  beim Abschluss des Bauvorhabens geführt hat (unter anderem Einreise der
  Monteur\\*innen aus der Schweiz zeitweise nicht möglich); Pilotprojekt
  automatisiertes Fahrradparkhaus mit App-Lösung zum Ein- und Ausparken
  insgesamt herausfordernd (Stichwort Definition Leistungskatalog App;
  Kombinierbarkeit/Integration bestehender regionaler Mobilitätsangebote -
  VVSPolygo-Karte)  "
communication: 'Presseberichte, Flyer, Webseiten (Stadt Fellbach und VVS),
