shortDescription: Radfahrende können mit der DB Rad+ App ein Kilometerguthaben
  erradeln. Dieses Guthaben kann bei lokalen Unternehmen gegen Prämien oder
  Rabatte eingetauscht werden.
subcategory: Kampagnen
commune: Wiesbaden
countryState: Hessen
