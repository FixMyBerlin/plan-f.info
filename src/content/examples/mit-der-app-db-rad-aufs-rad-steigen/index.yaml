centrality: Sehr zentral
period: Seit 01/2021
population: 278950
costs: 25000
financiallyWeak: false
beginnerFriendly: false
description: >
  Mit der App DB Rad+ setzt die Landeshauptstadt Wiesbaden Anreize für die
  Nutzung des Fahrrads. Die App wurde im Rahmen der Klimaschutzkampagne
  “Frischer Wind für Wiesbaden” eingeführt. 


  Seit dem 1. Februar 2021 können Wiesbadener\*innen mit Rad+ in die Pedale
  treten. Radfahrende können mit der DB Rad+ App ein Kilometerguthaben erradeln.
  Mit diesem Guthaben werden die Fahrrad-Kilometer zur Währung, die bei lokalen
  Unternehmen  gegen Prämien oder Rabatte eingetauscht werden können. Damit wird
  die nachhaltige Fortbewegung belohnt. Das Radfahren lohnt sich aber auch für
  die Gemeinschaft. Die Kilometer aller Teilnehmende im Aktionsgebiet werden
  summiert, um Meilensteine zu erreichen. Dies sind Maßnahmen und Events, die
  die Fahrradcommunity oder die -infrastruktur stärken.


  Die mit der App von den Nutzer\*innen generierten Daten, werden regelmäßig
  ausgelesen um die Nutzungsentwicklung zu analysieren und ggf. nachzubessern.
  Daten sind z. B.: Anzahl der gefahrenen Kilometer, Anzahl aktiver
  Nutzer*innen, Anzahl eingelöster Kilometer, sowie welche Prämien wie häufig
  eingetauscht werden.
goals: |
  - Komfort und Fahrspaß
  - Mehr Personen fahren Fahrrad
  - Fahrrad steigt in der Wahrnehmung / Statussymbol
  - Klima- und Umweltschutz
localChallenges: '- Radverkehr konkurriert stark mit privatem Autoverkehr (sogenannter MIV)'
particularities: |
  - Evaluation
  - Beteiligung
  - Verkehrsversuch oder Modellvorhaben
  - Quick-Win
results: 'Die Verkehrswende muss auch Spaß machen, emotional ansprechen und
  Anreize setzen. Der Community-Gedanke ist ein wichtiger Promotor. Bis heute
  wurden in Wiesbaden 844.000 Kilometer mit der App erradelt. Über 2.000
  Nutzende verwenden die App aktiv. '
challenges: >
  Zahlreiche Fragen zur Finanzierung technischen Ausführung und zum Datenschutz
  mussten abgearbeitet werden
communication: Plakate, Social Media, Pressemitteilungen, Pressetermine,
  Webseite, städtischer Newsletter, Anzeigen, Aktionstage, persönliches
  Vorstellen der App in der IHK Wiesbaden usw.
funding: '- Eigenmittel: 100 Prozent'
personnelExpenses: 200 Personenstunden (für Implementierung in Klimakampagne,
