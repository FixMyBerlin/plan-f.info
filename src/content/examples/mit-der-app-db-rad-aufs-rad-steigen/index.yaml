notes: Der Anbieter der App (DB Station&Service AG) hat den Preis für
  Neuabschlüsse erhöht. Aktuell ist für Wiesbaden mit Kosten von 37.000 Euro
  (brutto) zu rechnen. Generell sind die Kosten abhängig von der Größe einer
  Stadt.
