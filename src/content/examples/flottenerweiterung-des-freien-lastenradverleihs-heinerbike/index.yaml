description: >-
  Das städtisches Projekt Heinerbike startete 2018 mit fünf identischen
  E-Lastenfahrrädern der Marke Bakfiets in einer markanten grünen Lackierung mit
  Heinerbike Logo und individuellen Radnamen. Jetzt soll die Vielfalt der
  Cargobikes gezeigt werden und ein Ausprobieren ermöglicht werden.  


  Im Jahr 2020 begann dieser umfangreiche Prozess: Geeignete Fahrzeuge
  auswählen, weitere Partner\*innen finden, eine Förderung des Landes Hessen
  nutzen sowie Grafiken gestalten. Im Februar stimmte der Magistrat der
  Flottenerweiterung zu und die feierliche Übergabe vom Stadtrat erfolgte am 8.
  Juli 2022.  


  Damit ging die Trägerschaft von der Stadt an den Verkehrsclub Deutschland e.V.
  (VCD) und es rollen elf weitere attraktive Räder und „Persönlichkeiten der
  Verkehrswende“ durch Darmstadt.  


  Neben drei einspurigen Lastenrädern mit Ladefläche vorne gibt es zwei
  Lastendreiräder, einen Lastendreiradroller, zwei Rikschas und ein Sozialtandem
  für den Personenbedarf. Zudem gibt es zwei Anhänger. Dadurch wächst die Flotte
  der kostenfrei buchbaren Räder auf 19 an.  


  Privatpersonen und in Darmstadt ansässige Firmen haben so ein
  niederschwelliges Angebot nachhaltige Mobilitätsangebote zu testen. Ziel ist
  es durch attraktive Angebote Menschen dazu zu bewegen, die Zahl der
  Kraftfahrzeuge zu reduzieren.  


  Das kostenfreie Lastenradangebot Heinerbike startete 2018 mit fünf
  Lastenrädern wurde 2019 auf sechs und 2021 auf 14 erweitert. Im Sinne einer
  quantitativen und qualitativen Weiterentwicklung sollte die Flotte diverser
  und inklusiver werden.
