  Spezifische Zielgruppe: Lasten- und Lieferverkehr
results: 'Ein in dieser Form einzigartiges Projekt in dieser Größenordnung
  verlangt ein hohes Maß an Engagement. Die zivilgesellschaftliche und
  städtische Zusammenarbeit funktionierte. Das gemeinsame Ziel der Verkehrswende
  und Stärkung nachhaltiger Mobilität vor Augen, wurden zahlreiche kleine und
  große Herausforderungen im Planungsprozess erfolgreich bewältigt. Die Räder
  sind richtig schön geworden und unabhängig von der erwünschten Wirkung auf das
  Mobilitätsverhalten echte Hingucker.   '
challenges: 'Es gab zahlreiche Herausforderung im gesamten Prozess. Somit ist
  der Zeitfaktor als erstes zu nennen. Zahlreiche Detailfragen, die deutlich
  über die Flottenerweiterung hinausgehen, wie Neugestaltung des
  Internetauftritts, Ausarbeiten von AGB und Verträgen, Designfragen und etliche
  Abstimmungen waren nötig.  '
communication: Keine Angabe
funding: |-
