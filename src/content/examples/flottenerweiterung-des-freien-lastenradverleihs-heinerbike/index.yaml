  - Landesmittel: 90 Prozent
personnelExpenses: 'Verwaltungsseitig waren für das Projekt unter anderem der
  Fördermittelantrag beim Land, die Ausschreibung und Anschaffung, Versicherung
  der Räder und die Vertragsgestaltung mit der Übergabe an den VCD zu regeln. Es
  waren zahlreiche Fachstellen beteiligt. Die Koordination auch mit dem Land
  Hessen erfolgte durch eine hauptamtliche Kraft, die im 1. Halbjahr 2022 die
  Neuregelung der Heinerbikes zur Hauptaufgabe hatte.  '
