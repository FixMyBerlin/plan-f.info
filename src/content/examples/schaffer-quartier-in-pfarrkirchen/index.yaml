description: >-
  Ein “Mobilitätsvertrag” zwischen der Gemeinde Pfarrkirchen und dem
  Projektentwickler sorgt dafür, dass nicht-gebaute Stellplätze (-20 Prozent)
  durch ein multimodales Mobilitätsangebot  kompensiert werden. Der
  Mobilitätsvertrag regelt und gewährleistet den Betrieb für den Zeitraum der
  nächsten zehn Jahre. Zudem sieht der “Mobilitätsvertrag eine regelmäßige
  Evaluierung der Mobilitätsmaßnahmen vor.  


  Zu den Mobilitätsmaßnahmen, die der Projektentwickler im Rahmen des Baus
  geschaffen hat: An zwei Mobilitätsstationen stehen den Bewohner\*Innen des
  Wohnquartiers sharingfähige E-Cargobikes, E-Bikes und ein E-Auto so
  entsprechende Lademöglichkeiten zur Verfügung. Das Angebot wurde vom
  Mobilitätsbetreiber evhcle geplant, aufgebaut und betrieben. Die Fahrzeuge
  werden über die evhcle-App gemietet. Für die Bereitstellung der Fahrzeuge
  entrichtet der Standortpartner eine monatliche Gebühr, die mit den
  Mieteinnahmen verrechnet wird. Dieser kooperative Ansatz sorgt u.a. dafür,
  dass die Bewohner\*innen nach Vorgabe der Stadt einen Promotionscode erhalten,
  mit dem sie die elektrischen (Lasten-)räder zwei Stunden lang - pro Fahrt -
  kostenfrei nutzen können. Den Bewohner\*innen stehen zudem zehn Jahreskarten
  für den Pfarrkirchner Stadtbus zur Verfügung.
