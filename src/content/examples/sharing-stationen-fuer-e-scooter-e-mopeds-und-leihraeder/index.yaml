description: >-
  Mit 150 markierten Parkflächen (Sharing-Stationen, Stand: 01.09.2023) für das
  sichere und ordentliche Abstellen von Leih-Rädern, Leih-Scootern und
  Leih-Mopeds haben die Landeshauptstadt Düsseldorf und ihre Unternehmung für
  neue Mobilität, die Connected Mobility Düsseldorf GmbH, das bislang größte,
  digital überwachte Netzwerk an Stationen in Deutschland geschaffen. Das
  Parkchaos von E-Scootern und Co. ist in der gesamten Innenstadt und Kernstadt
  beendet. Das Free-Floating ist stark eigenschränkt und gilt nur noch für die
  Außenbereiche der Stadt.


  Bislang deckt das engmaschige Netzwerk mit einer Stationsdichte von 32
  Stationen pro Quadratkilometer flächendeckend die Stadtteile Altstadt,
  Carlstadt und Stadtmitte ab. Der weitere Ausbau für das restliche Stadtgebiet
  folgt, insbesondere an strategisch entscheidenden Orten. Dazu zählen besonders
  die Stadtteilzentren sowie die Haltepunkte des öffentlichen
  Personennahverkehrs und andere Orte öffentlichen Interesses, um inter- und
  multimodale Wegeketten sowie den ÖPNV zu fördern.


  Grundlage für die effiziente und wirksame Steuerung von E-Scootern und
  ähnlichen Fahrzeugen ist eine moderne IT- und Datenbank-Architektur, der
  sogenannte Shared-Mobility-Data-Hub. Dieser wird von der Stadttochter
  Connected Mobility Düsseldorf GmbH (CMD) betrieben. Es liegen die notwendige
  Datenverträge mit den jeweiligen Anbietern vor, sodass die gesamte Verkehrs-
  und Parksituation von Zweirad-Leihfahrzeugen kontinuierlich überwacht und
  gesteuert werden kann. Die Plattform erfasst, verwaltet und visualisiert Daten
  der verschiedenen Mobilitätsformen. So können unter anderem Parkvorgänge
  automatisiert überwacht werden. Unsachgemäßes Abstellen auf Brücken oder in
  Rheinnähe wird verhindert. Die Auswertung der Daten liefert zudem wertvolle
  Erkenntnisse für die Planung und den Betrieb des Mikronetzwerkes.


  An den Sharing-Stationen gibt es Hinweise in Form eines Zusatzschildes auf die
  begleitende Kommunikationskampagne und die neue Multi-Modalitäts-App des
  Verkehrsunternehmens Rheinbahn. Diese heißt „Redy“ und ist eine
  tiefen-integrierte MaaS-Lösung mit Zugang zu allen Shared-Mobility-Anbietern.
