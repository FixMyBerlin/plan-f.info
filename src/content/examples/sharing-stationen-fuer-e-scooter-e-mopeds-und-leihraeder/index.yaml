  - Evaluation

  - Beteiligung

  - Spezifische Zielgruppe: Pendler\*innen, Tourist\*innen, alle Bürger\*innen
  Düsseldorfs
results: Aktuell besteht das Netzwerk aus rund 150 Sharing-Stationen. Bis 2030
  wird es mehrere hundert Sharing-Stationen im gesamten Stadtgebiet geben, die
  zusammen mit den parallel im Aufbau befindlichen Netzwerk an
  Mobilitätsstationen ein leistungsstarkes Netzwerk an neuer, effizienter
  Mobilität bieten.
challenges: Akzeptanz der Stationen, bspw. aufgrund der Umwandlung von
  Parkplätzen. Außerdem Akzeptanz der Sharing-Fahrzeuge im Allgemeinen (Sorge um
  Ordnung und Sicherheit in der Stadt). Management und Digitalisierungsstrategie
  zur Steuerung. Abstimmung und Koordination mit den verschiedenen
  Sharing-Anbietern.
communication: >-
  Am Informations- und Fahrsicherheitstag konnten sich die Bürger\*innen über
  das bestehende Netzwerk mit den aktuellen Standorten sowie den künftigen
  Ausbau informieren.

  Außerdem wird durch Pressemitteilungen, Online-Beiträge der CMD sowie weitere
  Veranstaltungen auf die Projekte der Stadt zur Mobilitätswende aufmerksam
  gemacht.
