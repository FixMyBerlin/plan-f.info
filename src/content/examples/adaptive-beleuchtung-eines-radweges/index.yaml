description: >-
  Die Stadt Ibbenbüren in Westfalen hat ihre ländlich geprägte Fahrradstraße
  „Wieskebrook“ mit einem innovativen Beleuchtungssystem ausgestattet. Auf einer
  Länge von 1,5 km sorgen 43 LED-Leuchten mit Bewegungssensoren und präziser
  Leuchtensteuerung für eine moderne Ausleuchtung der Straße. Das sogenannte
  „Lauflicht“-System sorgt dafür, dass die Beleuchtung nur dann voll
  eingeschaltet wird, wenn auch tatsächlich Radfahrende oder andere
  Verkehrsteilnehmende unterwegs sind. Für die Erkennung der Nutzenden sind 34
  LED-Leuchten zusätzlich mit Sensoren und Bewegungsmeldern ausgestattet, welche
  heranfahrende Radfahrende erkennen. Ein ausreichendes Grundlicht ist durch
  eine kontinuierliche Beleuchtung mit rund 20 Prozent der Leistung gegeben.
  Wenn das intelligente Licht Personen erkennt, steigt die Leistung in dem
  Bereich, wo diese sich befinden, auf 100 Prozent an und sinkt wieder, sobald
  sie diesen Bereich verlassen hat.  
   
  Ohne Verkehr und somit Bewegung liegt die Leistung dieser 18-Watt-Leuchten bei
  lediglich 20 Prozent. Das sorgt für ausreichend Grundlicht. Nähert sich ein
  Fahrrad oder ein sonstiges Gefährt, geht die Leistung auf 100 Prozent hoch –
  und das abschnittweise, der Bewegungsrichtung entsprechend. Genauso fährt die
  Leistung in jenen Bereichen wieder auf 20 Prozent Grundleistung herunter, die
  der Passierende eben verlassen hat.  
   
  Das Einsparpotential durch die adaptive Beleuchtung ist enorm, gleichzeitig
  wird die Sicherheit für den Radverkehr verbessert und Lichtverschmutzung
  außerorts entgegengewirkt.
