description: "Die eigenständige Mobilität der Senior\\*innen möglichst lange zu
  erhalten und gleichzeitig ihre Verkehrssicherheit zu erhöhen: dies sind die
  Hauptziele einer Veranstaltungsreihe zum Thema Mobilität, die von der Stadt
  Unna im November 2007 gestartet wurde. Im Rahmen der Veranstaltungsreihe
  werden die unterschiedlichen Verkehrssysteme – angefangen von Bus und Bahn
  über das Auto, das Fahrrad und zu Fuß unterwegs -behandelt. Je Thema ist eine
  Nachmittagsveranstaltung von ca. zwei bis drei Stunden Dauer vorgesehen. In
  Abhängigkeit vom Verkehrssystem werden unterschiedliche Partner\\*innen
  eingebunden. Die einzelnen Veranstaltungen in Unna umfassen Themen zu Bus und
  Bahn (Theorie und Praxis), Auto- und Fußverkehr."
