description: >-
  Die Kreise Gütersloh, Herford, Höxter, Lippe, Minden-Lübbecke, Paderborn, die
  Stadt Bielefeld und die OWL GmbH arbeiten mit Unterstützung der
  Bezirksregierung Detmold und Straßen.NRW seit 2019 zusammen an der Entwicklung
  und Umsetzung des Regionalen Alltagsradwegenetzes OstWestfalenLippe, dem
  Radnetz OWL. Dabei entstand nicht nur das Konzept zum Radnetz OWL, sondern es
  entwickelt sich derzeit eine Region mit gemeinsamen Zielen und einer starken
  Stimme für den Radverkehr.  


  Zum ersten Mal wird die Förderung und der Ausbau der Radinfrastruktur in
  Kooperation der sieben staatlichen Gebietskörperschaften mit der
  Regionalentwicklungsgesellschaft vorangetrieben. Gemeinsame Standards und die
  Zusammenarbeit sind in der Region politisch beschlossen und die Planungen
  bereits im Regionalplan verankert. Die Partner\*innen setzen für die Region
  OWL ein zukunftsfähiges Hauptroutennetz von 1.992 km Länge für den
  Alltagsradverkehr um.  Eine Region mit einem auch topografisch sehr
  heterogenen Raum von ca. 6.500 km², mit zwei Millionen Einwohner*innen und 69
  Gemeinden in sechs Kreisen und einer kreisfreien Stadt. Diese Zusammenarbeit
  hat sich als sehr wirkungsvoll erwiesen.  
   
  Ziel ist ein zukunftsfähiges Pendlernetz mit direkten Führungen zur Erhöhung
  des Radverkehrsanteils im Modal Split. Während der Planungszeit wurde
  offensichtlich, wie hilfreich und nutzbringend eine regionale Koordination
  ist. Die Projektpartner\*innen arbeiten daran, diese Zusammenarbeit auszubauen
  und zukunftsfähige Koordinationsstrukturen aufzubauen, zur Beschleunigung der
  Umsetzung und um mehr Nachdruck bezüglich der Bedeutung des Radverkehrs für
  die gesamte Region zu erzielen. Derzeit wird an Instrumenten gearbeitet, auf
  die die Region zugreifen kann, um Ressourcen zu bündeln.  


  Dies stellt eine neue Qualität der Zusammenarbeit dar. Am Beispiel des
  Regionalverband Ruhr und verschiedener Verbände des Öffentlichen
  Personennahverkehrs (ÖPNV) zeigt sich, dass ein Zusammenschluss in der
  Zielerreichung wesentlich effektiver ist. Das soll auf den Radverkehr
  übertragen und für die Region OWL genutzt werden. So können zukünftig
  ambitionierten Zielen, wie dem Radschnellweg OWL 2.0 über drei Kreise und eine
  kreisfreie Stadt oder dem Lückenschluss zwischen RS1 und RS3 im Kreis
  Paderborn sowie weiteren Radwegeführungen in herausfordernden Zusammenhängen
  stärkerer Nachdruck verliehen werden.
