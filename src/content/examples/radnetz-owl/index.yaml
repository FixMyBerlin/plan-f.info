notes: >-
  Es handelt sich um eine sehr große und heterogene Region mit einer kreisfreien
  Stadt und sechs Kreisen, die ländlich sind aber auch Verdichtungsansätze haben
  (polyzentrische Region). Aus diesem Grund treffen diverse Raumtypen sowie
  lokale Herausforderungen zu.  


  Für das Gebiet, wo diese Maßnahme durchgeführt wurde, treffen mehrere
  Raumtypen zu.

  Besiedlung: Gemeinden: Überwiegend städtisch, teilweise städtisch, überwiegend
  ländlich; Kreise: Städtischer Kreis, ländlicher Kreis mit
  Verdichtungsansätzen, dünn besiedelter ländlicher Kreis
