challenges: >-
  Der Prozess fiel genau in den Beginn der Coronazeit – wir sind daher ganz neue
  Wege gegangen und haben alle Prozesse zum ersten Mal digital durchgeführt mit
  Online-Konferenzen (klingt jetzt normal, war es aber anfangs nicht). 


  Die eigentlichen Herausforderungen liegen in der Beschleunigung der weiteren
  Umsetzung.
