results: "Der Markt ist voller neuer Lösungen und Angebote, die man sehr einfach
  im Stadtgebiet einsetzen kann. Wie stark die Angebote von den Bürger\\* innen
  angenommen werden, ist vorher nicht abzusehen. Aber mit Mut zur Veränderung
  und den Rückhalt der eigenen Verwaltung kann man auch andere/ungewöhnliche
  Wege gehen und somit Erfahrungen für die Zukunft sammeln. "
challenges: 'Die Billigkeitsrichtlinie ist an einige Auflagen gebunden und eine
  geförderte Projektidee muss noch im selben Jahr umgesetzt werden. Die
  besonderen Anforderungen, die an den Solar-Ladesäulen zu Änderungen geführt
  haben, waren zeitintensiv. Längere Lieferzeiten führten zu kleineren
  Verzögerungen in der Umsetzung. '
