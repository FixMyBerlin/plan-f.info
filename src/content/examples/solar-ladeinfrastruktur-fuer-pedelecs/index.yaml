description: >-
  Die Stadtverwaltung möchte den Bürger\*innen ein breiteres Angebot zur
  Förderung der Fahrradnutzung machen, da im Stadtgebiet zunehmend mehr Pedelecs
  als Fortbewegungsmittel verwendet werden. Mit der Installation einer
  Pedelec-Ladeinfrastruktur von Solar-Ladesäulen soll die gestiegene Nachfrage
  einer Lademöglichkeit gefördert werden. 

   

  Nach der Antragstellung bei der Bezirksregierung in Arnsberg im März, wurden
  zeitnah über die Billigkeitsrichtlinie (Kompensationsleistung) Fördermittel
  zugewiesen. Die E-Fahrrad-Solar-Ladesäulen mit Sonnenkollektor wurden so
  umkonstruiert, dass diese im innerstädtischen Bereich zum Einsatz kommen
  können. Jede der sieben Anlagen, die aussehen wie eine 45 Meter hohe
  Straßenleute, produziert Strom, speichert diesen in der Mitte der Säule in
  einem Speicher und gibt den gespeicherten Strom über drei normale Steckdosen
  und zwei USB-Schnittstellen wieder an alle akkubetriebenen Endgeräte wie
  Smartphones, Tablets und ähnliches ab. Aber natürlich sollen im Vordergrund
  bis zu drei Pedelecs zeitgleich beladen werden. Nutzer\*innen müssen dafür
  zwar ihr eigenes Ladegerät mitführen, der Strom ist jedoch völlig kostenfrei.
  Durch Münzfangschlösser können die Ladegeräte sicher verwahrt werden.
  Insgesamt sieben dieser Säulen werden uns in den nächsten Tagen angeliefert
  und auch unmittelbar errichtet. Voraussetzung sind kleiner Fundamentarbeiten.
  Einen Anschluss an ein Stromnetzt ist nicht nötig, wodurch auch später der
  Standort einfach neu gewählt werden kann.
