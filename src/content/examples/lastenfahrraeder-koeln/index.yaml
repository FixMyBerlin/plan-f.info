description: >-
  Die Förderung von Lastenrädern unterstützt die Maßnahme „Förderung des
  Radverkehrs im laufenden Betrieb des Maßnahmenprogramms Green City Masterplan
  der Stadt Köln für die Gestaltung nachhaltiger Mobilität. Zudem werden die vom
  Rat beschlossenen Leitlinien und Handlungsempfehlungen des
  Stadtentwicklungskonzepts Logistik mit dem Ziel unterstützt, negative
  Auswirkungen von Liefervorgängen zu reduzieren. 


  Zur Beantragung sind die folgenden drei Gruppen berechtigt: 


  Nutzungsgruppe 1: Private Kleinstunternehmen bis zu einer Betriebsgröße von
  bis zu neun Mitarbeitenden sowie sonstige Selbstständige und freiberuflich
  Tätige mit Firmensitz oder Niederlassung in Köln. 


  Nutzungsgruppe 2: Vereine und Verbände, Einrichtungen in freier
  Trägerschaft.  


  Nutzungsgruppe 3: Haushaltsgemeinschaften von mindestens drei Haushalten mit
  Erstwohnsitz in Köln.   


  Aufgrund des großen Erfolgs wurde die Förderrichtlinie zur Anschaffung von
  Lastenrädern in den darauffolgenden Jahren mit einem Budget von jeweils
  500.000 Euro fortgeführt. Erste Ergebnisse einer Evaluation zeigen, dass die
  erwarteten Verlagerungen vom Kraftfahrzeug auf das Lastenrad eintreten. Zudem
  haben sich Mobilitätsvorteile (Reduzierung der Fahrtzeit und Erhöhung der
  Flexibilität in der Routenwahl) eingestellt. Die Geförderten berichten
  außerdem davon, dass die Einsatzmöglichkeiten sowie die Fahrleistung teilweise
  deutlich über den eigenen Erwartungen liegen.
goals: |-
  - Reduktion privater Autoverkehr (sogenannter MIV)
  - Klima- und Umweltschutz
localChallenges: Keine spezifische Angabe
particularities: 'Spezifische Zielgruppe: Lasten- und Lieferverkehr'
results: >-
  Im Rahmen von insgesamt drei Förderaufrufen (2019, 2020 und 2021) wurden
  bisher Finanzmittel in Höhe von rund 2,9 Millionen Euro bewilligt. Mit diesen
  Mitteln wurden rund 1.350 Lastenräder gefördert. Bei der Konzeption der
  Förderung ist die Verwaltung von einer Marktsättigung innerhalb der drei Jahre
  ausgegangen, die bisher nicht erreicht wurde. So konnten in den Förderaufrufen
  2020 bis 2022 zusammen knapp 700 Anträge nicht bedient werden. Der Bedarf für
  weitere Förderperioden ist damit gegeben. 


  Der Förderaufruf 2022 wurde auf politischen Wunsch um eine regionale
  Komponente ergänzt, die eine Priorisierung bestimmter Stadtteile vorsieht. Das
  Zuteilungsverfahren aus dem Förderaufruf 2022 ist noch nicht abgeschlossen und
  ausgewertet.   


  Die Ergebnisse einer studentischen Masterarbeit sowie Auswertungen des
  Verwendungsnachweisverfahrens zeigen, dass die Förderung den erhofften Beitrag
  zur Verkehrswende liefert. Für die Förderaufrufe 2019 und 2020 wurde eine
  Fahrleistung über alle geförderten Lastenfahrräder in Höhe von über zwei
  Millionen Fahrzeugkilometern gemeldet. Nach überschlägigen Berechnungen
  entspricht dies in etwa einer Emissionseinsparung von rund 354 Tonnen CO2.
  Bedingt durch die pandemische Lage war es insbesondere Antragsstellenden der
  Nutzungsgruppen 1 und 2 nicht möglich, das geförderte Fahrzeug wie geplant
  einzusetzen. Daher ist davon auszugehen, dass die tatsächlich mögliche
  Fahrleistung geringfügig über den gemeldeten Fahrleistungen liegt.
challenges: >-
  Da die Lastenradhersteller durch verschiedene öffentliche Förderungen vor
  erhebliche Kapazitätsprobleme in der Produktion der Lastenräder und
  Komponenten gestellt wurden, hat sich die Lieferzeit für viele Modelle auf
  mehrere Monate erhöht.  


  Aufgrund des hohen Beratungsbedarfes hinsichtlich der Lastenradförderung im
  Zusammenhang mit allen Prozessen (Lastenradanschaffung, Lieferzeiten von bis
  zu sechs Monaten und daraus resultierenden Fristverlängerungen,
  Verwendungsnachweisverfahren) kam es teilweise zu Verzögerungen bei der
  Antragsbearbeitung.  


  Die Grenzen liegen in der Skalierbarkeit sowie in den begrenzten
  Haushaltsmitteln für eine umfassende Förderung aller Akteur\*innen.
  Perspektivisch ist ein solches Förderprogramm lediglich auf bestimmte Gruppen
  mit entsprechenden Fahrleistungen im urbanen Wirtschaftsverkehr zu
  beschränken.
