description: >-
  Im radrevier.ruhr wurde ein „touristisches“ Knotenpunktsystem mit rund 1.200
  km Länge installiert. Das Radeln nach Zahlen erleichtert die Orientierung
  insbesondere für nicht-ortskundige Personen und ist für die meisten
  Personengruppen gut verständlich. Zahlen lassen sich bei der Planung schnell
  notieren und können leicht im Gedächtnis behalten werden. So müssen die
  Radfahrenden nicht an Wegweisern stehen bleiben, sondern können direkt in die
  richtige Richtung weiterradeln. 


  Zusätzlich wurden Infotafeln aufgestellt, die über das Wegenetz informieren.
  Das Knotenpunktsystem wurde primär entlang attraktiver Radwege für eine
  Freizeitradtour installiert und adressiert Radreisende und
  Freizeitradfahrende. Diese können sich auf ihrer Route anhand der Zahlen
  leicht orientieren. 
   
  Viele Industriedenkmäler liegen direkt am Knotenpunktsystem, denn jeder
  sogenannte „Ankerpunkt der Industriekultur“ hat eine eigene Knotenpunktnummer
  erhalten. Ob das UNESCO-Welterbe Zollverein, das Dortmunder U oder der
  Landschaftspark Duisburg-Nord, sie alle können direkt über das
  Knotenpunktsystem angesteuert werden. Außerdem ist jede Stadt im Ruhrgebiet
  mit mindestens einem Knotenpunkt angeschlossen und auch wichtige Bahnhöfe sind
  für eine leichte An- und Abreise angebunden. Einige Knotenpunkte liegen an
  Treffpunkten von wichtigen Radwegen, wie zum Beispiel an der Erzbahnbude, wo
  die Kray-Wanner-Bahn auf die Erzbahntrasse trifft.
