description: >-
  Projektziel war es, zum Erkenntnisgewinn bedarfs- und qualitätsorientierter
  Knotenpunktgestaltungen beizutragen. Für die Gewährleistung der
  Übertragbarkeit der Ergebnisse waren folgende Projektpartnerstädte an der
  Projektdurchführung beteiligt: 


  - Stadt Leipzig (Projektinitiator und Antragsteller im NRVP (Nationaler
  Radverkehrsplan) Verbundprojekt), 

  - Stadt Hannover, 

  - Stadt Frankfurt am Main, 

  - Stadt Oldenburg. 


  Das Projekt war in drei Bearbeitungsphasen unterteilt. In der ersten Phase
  wurde eine Literaturanalyse durchgeführt, die zu untersuchenden Knotenpunkten
  in den Städten ausgewählt und das Verkehrsgeschehen analysiert. Der
  Verkehrsablauf wurde mit Hilfe von Mikroverkehrssimulationen nachgebildet.
  Über Videoerhebungen wurden verschiedene verkehrstechnische Kenngrößen
  bestimmt, die sowohl zur Kalibrierung der Simulationsumgebung als auch zur
  Aufnahme des Ist-Zustandes dienten. 


  In der zweiten Phase wurden durch den wissenschaftlichen Verbundpartner
  (Technische Universität Berlin) Lösungsvorschläge zur Verbesserung des
  Verkehrsablaufs für den Radverkehr erarbeitet, in den Simulationsumgebungen
  hinsichtlich der Wirksamkeit untersucht und durch die kommunalen Partner
  bezüglich der Anwendbarkeit bewertet. Als anwendbar eingestufte Maßnahmen
  sollten am realen Knotenpunkt jeder Partnerstadt umgesetzt und in der dritten
  Projektphase einer Evaluation unterzogen werden. 


  In der dritten Phase wurde die empfohlene Lösung am Knotenpunkt der Stadt
  Frankfurt am Main erneut mittels Verkehrserhebungen (Verkehrszählungen,
  Videoerhebungen sowie Befragungen von Radfahrenden) untersucht, um die
  Wirksamkeit der dortigen Maßnahme und die Akzeptanz durch die Nutzer in der
  Praxis zu verifizieren.
