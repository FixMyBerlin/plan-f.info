results: >-
  Gestalterische Ansätze erscheinen besonders geeignet, die bestehende
  Infrastruktur mit geringen Anpassungen besser auszunutzen. So kann
  Radfahrenden schon mit einer Bodenmarkierung und nahe der Haltlinie
  aufgestellten Griffen ein erwünschtes Aufstellverhalten angezeigt werden.  
   
  Die Radverkehrsqualität lässt sich ebenfalls durch Entkoppelung der Furten des
  Rad- und Fußverkehrs mit getrennter Signalisierung verbessern. So kann die
  gegenüber dem Fußverkehr deutlich höhere Räumgeschwindigkeit des Radverkehrs
  ausgenutzt und die Freigabe hoch belasteter Ströme verlängert werden.  


  Zur Entlastung von Engstellen im Straßenraum lassen sich, falls die
  geometrischen und betrieblichen Randbedingungen des Knotenpunkts derartiges
  erlauben, zusätzliche Furten für den Radverkehr markieren, die die direkte und
  zielgerichtete Führung von bedeutenden Radverkehrsströmen an den neuralgischen
  Stellen vorbei ermöglichen. 


  Hinsichtlich des Verkehrsflusses lassen sich deutliche Verbesserungen mit
  einer verkehrsabhängigen Steuerung der Lichtsignalanlagen mit
  Radverkehrsdetektion erreichen. So kann, basierend auf kurzen Freigabezeiten
  im Radverkehr, dynamisch auf die Entwicklung der Radverkehrsbelastung reagiert
  werden. 


  Erlauben die Gegebenheiten vor Ort keine räumliche Trennung der Verkehre, so
  kann die Qualität des Radverkehrs ebenfalls mit Hilfe einer zeitlich
  getrennten Nutzung gemeinsam frequentierter Verkehrsflächen positiv
  beeinflusst werden. 


  An den untersuchten Knotenpunkten ließen sich mit Hilfe der Simulationen
  positive Effekte auf die Verkehrsqualität im Radverkehr ermitteln. So konnten
  Verbesserungen verschiedener Bewertungsparameter, darunter die Wartezeit und
  die Zahl der Halte bei der Knotenpunktpassage, beobachtet werden. Wo
  entwickelte Maßnahmen umgesetzt und evaluiert werden konnten, ließen sich die
  simulierten Effekte in der Realität bestätigen. Weiterer Forschungsbedarf
  besteht insbesondere dahingehend, die Simulationsergebnisse anhand
  zusätzlicher Praxisbeispiele zu verifizieren.
challenges: Bauliche Umsetzung der Maßnahmen hat sich häufig aufgrund von
  langwierigen Planungs- und Abstimmungsprozessen verzögert, so dass die
  Evaluation teilweise schwierig war.
