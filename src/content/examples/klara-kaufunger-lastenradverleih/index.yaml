description: >-
  Die Gemeinde Kaufungen hat gemeinsam mit dem Spurwechsel Kaufungen e.V. das
  Projekt KLARA – Kaufunger Lastenradverleihsystem gestartet. Als
  zivilgesellschaftliche Initiative hat Spurwechsel Kaufungen e.V., ein Verein
  zur Gestaltung der lokalen Mobilitätswende, die Idee 2021 an die Gemeinde
  herangetragen und gemeinsam mit der Verwaltung und Politik zur Realisierung
  gebracht. 


  Mit Hilfe von Fördergeldern aus dem Programm zur „Förderung von kommunalen
  Klimaschutz- und Klimaanpassungsprojekten sowie von kommunalen
  Informationsinitiativen CO2-arme Mobilitätssysteme“ des Hessischen Ministerium
  für Umwelt, Klimaschutz, Landwirtschaft und Verbraucherschutz konnte die
  Gemeinde die Anschaffung von 18 Lastenrädern und die wettergeschützte
  Aufstellung an 15 dezentralen Standorten leisten. 


  Der Fuhrpark besteht aus elf einspurigen Lastenrädern für Kinder und/oder
  Last, drei Dreirädern mit Box für größere Lasten, zwei Sonderfahrzeugen
  (Schwerlastenrad und großer Anhänger) sowie zwei Rikschas, um
  mobilitätseingeschränkten Menschen ein Fahrraderlebnis zu ermöglichen. Durch
  einzelne Abstellboxen sind die Räder vor Witterung geschützt, sie können
  direkt geladen werden und Zubehör kann verstaut werden. Jedes Lastenrad hat
  eine\*n Pat\*in, welche\*r, die regelmäßig nach dem Rad und seiner Abstellbox
  sieht. Die Kosten für den Unterhalt werden von der Gemeinde getragen, die
  Betreuung wird durch Spurwechsel e.V. geleistet.


  Die betreuenden Personen sind ein Teil der erheblichen ehrenamtlichen
  Unterstützung. Sie haben einen Namenswettbewerb organisiert, an dem über 100
  Einsendungen abgegeben wurden, bei der Auswahl der Standorte unterstützt, die
  Homepage erstellt und führen Einweisung der Erstnutzer*innen durch. So
  entstand eine größere Identifikation der Kaufunger\*innen mit KLARA.
goals: |
  - Reduktion privater Autoverkehr (sogenannter MIV)
  - Klima- und Umweltschutz
localChallenges: Keine spezifische Angaben
particularities: >-
  - Beteiligung

  - Spezifische Zielgruppe: Lasten- und Lieferverkehr, Mobilitätseingeschränkte
  Menschen
results: >
  Seit Oktober 2022 läuft der Probebetrieb, persönlich können die Lastenräder
  bereits kostenlos ausgeliehen werden. Witterungsbereinigt war der Start sehr
  erfolgreich! Über 100 Menschen wurden bereits in die Nutzung eingewiesen und
  auch im Ortsbild sind die Lastenräder sichtbar. Ab dem Frühjahr 2023 wird die
  Ausleihe per App und rund um die Uhr, ebenfalls kostenlos, eingeführt. Das
  reduziert Zugangsbarrieren und macht unabhängig von Ladenöffnungszeiten.


  Mit dem Projekt KLARA wurde eine attraktive Möglichkeit geschaffen die
  Emissionen und den Flächenverbrauch von Nahmobilität zu reduzieren. Es wird
  erlebbar, wie unsere Bürger*innen auch ohne Pkw mobil unterwegs sein und
  Lasten transportieren können, egal ob Kinder, einen Kasten Bier oder ein neuer
  Staubsauger. Einkaufen, Leben und Freizeitgestaltung in Kaufungen wird so
  attraktiver und die Nutzenden erleben Bewegung und Begegnung in der Gemeinde. 


  Klimaschutz, Steigerung der Gemeindeattraktivität und Erweiterung der
  Mobilität durch Zusammenarbeit von Zivilgesellschaft und Gemeinde zeichnen
  unser Projekt im Besonderen aus. Die Gemeinde Kaufungen will als Vorbild
  anderen Gemeinden zeigen, wie ein Beitrag zur Mobilitätswende geleistet werden
  kann.
challenges: >
  Es sind die vielen kleinen Dinge, die ineinandergreifen müssen, etwa im
  Bereich Versicherung: Wer kann die Räder versichern, wer die Pat*innen, wer
  den Betrieb? Aber auch: Welches Betriebssystem wird gewählt (geringe Kosten
  bei gleichzeitig einfacher Handhabung)? Gibt es an allen vorgeschlagenen
  Standorten der E-Lastenräder Strom? Dennoch ist die Gemeinde zuversichtlich,
  bald den regulären Verleihbetrieb starten zu können.


  Den Aufwand zur Etablierung wurde etwas unterschätzt, die einzelnen
  Arbeitsschritte sind trotz akribischer Vorbereitung aufwendiger als gedacht.
communication: 'Erste Öffentlichkeitsarbeit durch den Namenswettbewerb
