description: >-
  Die "Kooperative Nutzung von Mikro-Depots durch die Kurier-, Express-,
  Paket-Branche für den nachhaltigen Einsatz von Lastenrädern in Berlin"
  (KoMoDo) ist ein Forschungsprojekt, an dem sich die fünf größten nationalen
  Paketdienstleistende aktiv beteiligen. Im Fokus stehen die nachhaltige und
  stadtverträgliche Auslieferung von Paketen auf den letzten Kilometern per
  Lastenrad - den sogenannten Cargobikes sowie den Einsatz eines
  dienstleisteroffenen Systems von Mikro-Depots in einem Stadtteil.  


  Die Ziele des Projekts sind vielseitig. Zum einen soll herausgefunden werden,
  wie gut Lastenräder für die Auslieferung von Paketen auf den letzten
  Kilometern geeignet sind, zum anderen wird das anwenderoffene System der
  Mikro-Depots getestet. Dafür haben verschiedene Paketdienstleistende erstmals
  ein einheitliches System genutzt.  


  Mit diesem Projekt soll die durch Lieferverkehre entstehende Verkehrsbelastung
  reduziert werden. Diese ist speziell in Innenstädten durch beispielsweise
  Parkplatzknappheit angespannt. Das Parken in zweiter Reihe durch
  Zustellfahrzeuge verschärft die verkehrliche Lage zusätzlich. Radfahrende sind
  von dieser Problematik direkt betroffen.  


  Die fünf operativ tätigen Dienstleister waren Deutsche Post DHL, DPD, GLS,
  Hermes und UPS. An dem Projekt KoMoDo wirkten zudem Verbände und Institutionen
  als assoziierte Partner\*innen mit. Die Projektkoordination übernahm die LNC
  LogisticNetwork Consultants GmbH.  


  An fünf Werktagen waren durchschnittlich elf Lastenfahrräder im Einsatz. So
  konnten, nach anfänglich niedrigen Beförderungsmengen, schlussendlich bis zu
  16.000 Sendungen pro Monat ausgeliefert werden. Gleichzeitig konnten 28.000
  Fahrzeugkilometer durch die Lastenfahrräder substituiert werden. Die Räder
  selbst legten hierfür eine Gesamtfahrleistung von 38.000 Kilometern zurück.
  Dies ist dadurch erklärbar, dass mehrfach pro Tag das Lastenrad mit neuen
  Sendungen beladen werden musste. So fielen zusätzliche Verbindungswege an. Die
  reduzierten Fahrzeugkilometer führten dazu, dass weniger Nutzfahrzeuge in dem
  Gebiet Pakete zustellten. Somit wurde die Verkehrsbelastung wirksam reduziert
  und der Straßenverkehr, in dem sich auch Radfahrende bewegten, wurde flüssiger
  und übersichtlicher. 
