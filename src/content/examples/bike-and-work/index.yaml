description: >-
  Aufgrund der bundesweit zu hohen CO2-Emissionen im Verkehrsbereich möchte das
  Projekt zur Reduktion dieser beitragen. Daher werden Betriebe und Kommunen des
  Rems-Murr-Kreises dabei unterstützt, die Fahrradmobilität ihrer Mitarbeitenden
  zu erhöhen.   
   
  Im Rahmen einer mehrstündigen Vor-Ort-Begehung durch eine\*n
  Mobilitätsexpert\*in wird der Standort analysiert, der Status Quo dargestellt
  und Möglichkeiten aufgezeigt, den eigenen Standort fahrradfreundlicher zu
  gestalten und so die Mitarbeitenden zum Radfahren zu motivieren. Insbesondere
  für Kurzstreckenfahrten und kurze Dienstfahrten soll so die Pkw-Nutzung
  reduziert und das Fahrrad als gesunde und klimaschonende Alternative gefördert
  werden.  


  Ablauf der einzelnen Projektphasen mit den Betrieben:


  1: Auftaktveranstaltung mit teilnehmenden Betrieben und Kommunen: Erläuterung
  des Projekts und der nächsten Schritte. 
   
  2: Vor-Ort-Begehung (Ist-Analyse) ca. ein bis zwei Monate nach Beginn des
  Projekts. 


  3: Mitarbeitendenbefragung (Ermittlung der Wünsche und Anforderungen der
  Mitarbeitenden an Fahrradmobilität). Teilnehmende erhalten Link zur Befragung
  & Plakate mit Aufruf zur Teilnahme an dieser. Befragung wird ca. zwei bis vier
  Monate nach Projektbeginn durchgeführt und Ergebnisse an den Betrieb
  übermittelt. 


  4: Aktionsplan. Aus den Daten der Vor-Ort-Begehung, dem Gespräch mit dem
  Betrieb und den Ergebnissen der Befragung, wird für jeden Standort ein
  individueller Aktionsplan mit Maßnahmen (priorisiert von A bis C) erstellt. 

  Parallel: Ideen- und Best-Practice-Workshop 


  5: Abschlussveranstaltung
goals: |-
  - Mehr Personen fahren Fahrrad
  - Reduktion privater Autoverkehr (sogenannter MIV)
  - Klima- und Umweltschutz
localChallenges: Keine spezifische Angabe
particularities: |-
  - Quick-Win
  - Spezifische Zielgruppe: Pendler\*innen
results: 'In jeder Projektrunde werden in den teilnehmenden Betrieben ca. 25-30
  Maßnahmen umgesetzt und etwa 25-35 Maßnahmen für die nahe Zukunft konkret
  geplant. Von Reparaturset, über Sanierung der Duschen, Neubau von
  Abstellanlagen, bis hin zu sicheren Fahrradwegen auf dem Betriebsgelände.
  Besonders wichtig: das Angebot für Betriebe muss kostenfrei sein,
  längerfristige Beratung beinhalten und die Mitarbeitenden müssen eingebunden
  sein. Bisher wurden sechs Projektrunden mit jeweils ca. zehn Betrieben
  durchgeführt.'
challenges: 'Wirtschaftliche Schwierigkeiten in einzelnen Betrieben beeinflussen
  die Intensität, mit der am Projekt gearbeitet werden kann. '
