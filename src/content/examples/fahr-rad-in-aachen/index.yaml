description: >-
  Die städtische Kampagne „FahrRad in Aachen“ des Fachbereichs Stadtentwicklung,
  -planung und Mobilitätsinfrastruktur der Stadt Aachen bietet seit dem
  Schulhalbjahr 2015/2016 eine umfangreiche Mobilitäts- und Verkehrserziehung
  für Grundschüler\*innen auf dem Gelände der Feuerwehr Aachen an. In dem
  sogenannten Floriansdorf lernen Kinder, was im Straßenverkehr wichtig ist: Im
  theoretischen Unterricht  werden Informationen über Verkehrszeichen,
  verkehrssicheres Fahrrad, Toter Winkel und zu dem Verhalten und genereller
  Sicherheit im Straßenverkehr vermittelt. Eine Besonderheit bei dem Training im
  Floriansdorf istdie Mölichkeit, den Tote Winkel auch praktisch an einem
  Feuerwehrauto erlebbar zu machen. Dadurch wird diese Gefahr für die Kinder
  verständlicher gemacht. Beim praktischen Unterricht   werden verschiedene
  Übungen wie Spurgassen, Ballsport, Rampen, Wippen, Kreisel, Schneckenrennen
  und Vieles mehr durchgeführt, mit denen die Kinder sicherer auf dem Fahrrad
  werden  .   Im Anschluss daran erfolgt das freie Fahren, d.h. die Kinder
  können unter Einhaltung der Verkehrsregeln wie rechts vor links, Handzeichen
  geben, Ampeln und Verkehrszeichen beachten das Gelände frei befahren. 


  Damit die Kinder einen Eindruck vom Straßenverkehr bekommen, hat die
  Stadtverwaltung in dem Schonraum auf dem Feuerwehrgelände Verkehrsschilder
  aufgestellt und Radwege sowie Aufstellflächen markiert. Außerdem steht seit
  diesem Jahr eine Ampelanlage zur Verfügung.
goals: |-
  - Sicherheit 
  - Fahrspaß
  - Mehr Personen fahren Fahrrad 
  - Verständnis für die Gefahren im Straßenverkehr
