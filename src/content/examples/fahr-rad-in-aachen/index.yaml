  Topographie
particularities: |-
  - Inklusive Maßnahme
  - Spezifische Zielgruppe: Schüler\*innen
results: 'Das Angebot musste ausgeweitet werden, da die Nachfrage sehr groß ist.
  Immer mehr Kinder können nicht Fahrradfahren oder sind nach der Fahrradprüfung
  in der 4. Klasse nicht in der Lage sicher zu fahren. Meist handelt es sich um
  Kinder mit Migrationshintergrund. Daher ist es wichtig das Angebot für
  Grundschulen weiterhin anzubieten, denn zu den Nachmittagsterminen kommen
  diese Kinder nicht. '
challenges: "Da das Angebot sehr gut angenommen wurde, war die größte
  Herausforderung ausreichend Helfer\\*innen zu bekommen, die bei der
  Durchführung der Fahrradtrainings Hilfestellung geben können. Bei den Geräten
  muss immer mindestens ein\\*e Helfer\\*in stehen und bei den Übungen sind
  manchmal auch zwei erforderlich. Es kommen jetzt auch vermehrt
  Grundschulkinder, die nicht Fahrradfahren können. Das erfordert noch mehr
  Personal. "
communication: 'Jedes Jahr wird eine Terminkarte mit den Fahrradkursen
  herausgegeben. Es gibt eine Internetseite www.aachen.de/fahrrad, Anzeigen und
  Texte werden in Zeitung und Magazinen veröffentlicht und die Schulen werden zu
  jedem Schulhalbjahr angeschrieben. '
