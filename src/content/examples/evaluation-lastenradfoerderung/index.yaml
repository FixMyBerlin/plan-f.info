description: >-
  Für die Befragung hatte die Landeshauptstadt Menschen angeschrieben, die
  Fördermittel für die Anschaffung von Lastenrädern erhalten hatten. Das
  Förderprogramm der Stadt Düsseldorf startete im Juni 2021. 869 von 1.230
  Menschen, die eine Förderung erhalten hatten und angeschrieben wurden, nahmen
  an der Umfrage teil. 


  Die geförderten Lastenräder werden zu knapp 90 Prozent privat genutzt.
  Einsatzzwecke sind dabei überwiegend Einkäufe, Freizeitbeschäftigungen,
  Kindertransporte und Ausflüge. 


  Die Lastenräder werden vier bis sechs Mal pro Woche überwiegend für Fahrten
  unter 50 Kilometern genutzt und ergänzen somit insbesondere die
  innerstädtische Mobilität der Familien.
