results: '85 Prozent der 869 Befragten ersetzen wöchentlich bis zu drei
  Autofahrten mit dem Lastenrad. 20 Prozent der befragten Düsseldorfer *innen
  haben ein Auto abgeschafft (insgesamt 173 Pkws, 121 Personen davon hatten aber
  vorher auch zwei Pkws, 37 Personen haben ihr einziges Auto abgeschafft) und 23
  Prozent planen die Abschaffung eines Pkws. Paare mit Kindern sind die
  Hauptzielgruppe des Förderprogramms. Altersgruppe 35 – 44 nutzen überwiegend
  die Lastenräder. Zu 64 % nutzen beide Elternteile das Lastenrad. Zu 89 Prozent
  wird das Lastenrad zum Einkaufen eingesetzt. Für Kindertransporte wird es von
  76 % der Befragten genutzt. Ausflüge werden damit von 74 Prozent der Befragten
  durchgeführt. Die gewerbliche Nutzung (Förderung nur bei Kleinbetrieben bis
  neun Mitarbeitenden möglich) ist bisher mit vier Prozent sehr gering. Zu 81
  Prozent wird das Lastenrad im privaten Parkraum abgestellt. Öffentlicher Raum
  wird zum Abstellen zu 27 Prozent genutzt. Die eigene Garage wird am häufigsten
  als Abstellraum angegeben. 357 Tonnen CO²-Äquivalente werden pro Jahr bisher
  durch die Wirkung des Förderprogramms vermieden. '
