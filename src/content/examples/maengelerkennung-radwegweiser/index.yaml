description: >-
  Radwegweiser werden nicht regelmäßig gewartet. Nicht erkannte Mängel führen
  aber zu Fehlinformationen für die Radfahrenden. Aus diesem Grund wurde von der
  Gemeinde Adelsdorf ein Meldesystem entwickelt. 


  Jedem Radwegweiser ist eine Gemeindeschlüsselnummer zugeordnet. Daher wurden
  für alle Radwegweiser Aufkleber angefertigt mit den letzten drei Stellen der
  Nummer, z. B. 116. Zusätzlich wurden Aufkleber mit einem QR-Code angefertigt.
  Beide Aufkleber werden auf jeden Radwegepfosten angebracht. Nach dem Scannen
  der QR-Codes werden die Nutzenden durch ein Menü geführt, um den
  Schaden/Mängel zu melden, bestenfalls mit Foto. Diese Meldung wird von der
  Gemeinde entgegengenommen und an die entsprechende Dienststelle (Bauhof)
  weitergeleitet, damit die Mängel schnellstmöglich behoben werden können.
