description: >
  Wie kann der Verkehrsraum gerechter zugunsten des Umweltverbundes aus Bus und
  Bahn, Fahrrad und Fußverkehr aufgeteilt werden? Wo besteht der Bedarf nach
  Fahrradstellplätzen und weiteren Mobilitätsoptionen wie Bike-Sharing oder
  Car-Sharing? Das erprobt das Projekt „Be-MoVe“ mit fünf Fahrradplattformen der
  holländischen Firma Fietsvlonder (Fahrradflunder). Mit den beweglichen
  Fahrradplattformen kann gezielt der Bedarf an Fahrradstellplätzen anstelle von
  Autoparkplätzen an verschiedensten Standorten im Stadtgebiet getestet werden. 

  Die Fahrradplattformen stehen seit Ende Oktober auf fünf ausgewählten
  Parkplätzen in den Stadtteilen Holsterhausen und der Innenstadt. Auf jeder
  Fahrradplattform befinden sich vier Anlehnbügel, die Platz für bis zu acht
  Fahrräder bieten. So entstehen insgesamt 40 neue Abstellmöglichkeiten für
  Fahrräder. Die Testphase der Standorte in Holsterhausen und der Innenstadt
  läuft fünf Monate. In der Zeit kann dort kein Auto parken. Das Institut für
  Mobilitäts- und Stadtplanung der Universität Duisburg-Essen (imobis) wird
  während der Testphase die Nutzung der Fahrradplattformen evaluieren. Werden
  die Standorte gut angenommen, sollen diese durch fest eingebaute Fahrradbügel
  ersetzt werden. Wird ein Standort nicht gut angenommen, soll die
  Fahrradplattform wieder entfernt werden. In beiden Fällen ist vorgesehen, die
  Fahrradplattform dann an einen anderen Standort zu versetzen, um dort den
  Bedarf und die Akzeptanz zu testen.

  In Zusammenarbeit mit der Ruhrbahn, Metropolrad Ruhr und Stadtmobil entstehen
  an einigen Standorten der Fahrradflunder sogenannte Mobilpunkte. An einem
  Mobilpunkt gibt es neben den Fahrradabstellmöglichkeiten auch Leihräder von
  Metropolrad Ruhr und / oder Car-Sharing Angebote von Stadtmobil.
