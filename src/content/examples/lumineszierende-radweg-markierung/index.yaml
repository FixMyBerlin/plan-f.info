description: >-
  Separat geführte Rad- und Gehwege durch Grünflächen haben außerhalb zentraler
  Lagen meist keine Beleuchtung und bedingen bei Dunkelheit ein eingeschränktes
  Sicherheitsgefühl sowie eine mangelhafte Orientierung. Hier setzt die Idee an,
  eine Kaltplastikmarkierung mit speziellen Pigmenten aufzubringen, die tagsüber
  das Sonnenlicht absorbieren und nachts grüngelb nachleuchten. Sie stammt von
  Schüler\*innen der Gesamtschule Duisburg-Meiderich, die beim Wettbewerb für
  Schüler\*innen „Förderturm der Ideen“ 2016/2017 Sieger in der Kategorie
  „Lebenswerte Stadt“/Sekundarstufe II wurden.  
   
  Eine Projektgruppe erarbeitete unter der Moderation der den Wettbewerb
  begleitenden Agentur ein umsetzbares Konzept. Beteiligt waren das
  Schüler\*innenteam nebst Lehrerin und Schulleiter, die Stadt Duisburg, die
  Wirtschaftsbetriebe Duisburg sowie zwei Unternehmen und ferner der
  Regionalverband Ruhr als Baulastträger dieser auch regional bedeutsamen
  Radtrasse (radrevier.ruhr).  
   
  Die Wahl fiel auf einen 2,6 km langen, kurz zuvor asphaltierten
  Streckenabschnitt des „Grünen Pfads“ im Bereich des Landschaftsparks
  Duisburg-Nord, der Bedeutung für den Alltags- wie den Freizeitradverkehr hat.
  Bei Dunkelheit gibt es keine Beleuchtung auf der Trasse, die durch einen
  Grünbereich führt, und an der auch eine Jugendherberge liegt. In seinem Umfang
  geht das Projekt, das einen wesentlichen Abschnitt der insgesamt etwa zehn km
  langen Trasse umfasst, deutlich über Pilotvorhaben mit wesentlich kürzeren
  Strecken hinaus.  
   
  Im Ergebnis wurde eine fünf Zentimeter breite Markierungslinie an den Rändern
  des an sich unbeleuchteten Rad- und Fußwegs gewählt. Zur Erhöhung des
  Kontrasts wurde sie auf einem etwas breiteren weißen Begrenzungsstrich
  aufgebracht. Die erforderliche gute Qualität des Untergrunds (Asphalt) war
  gegeben.
