results: 'In Ergänzung zur an sich erforderlichen Fahrradbeleuchtung ist
  deutlich eine wahrnehmbare durchgehende Orientierung erreicht worden. Zwar ist
  dies nicht mit einer Beleuchtung gleichzusetzen, aber eine Beleuchtung separat
  geführter Wege ist mit hohem baulichem Aufwand verbunden, dem die Betriebs-
  und Wartungskosten hinzuzurechnen sind. Außerdem sind die vermiedenen
  Umweltwirkungen des Stromverbrauchs zu berücksichtigen. '
challenges: >
  Die Dauer und Intensität der Lichteinwirkung bei Helligkeit spielt eine
  zentrale Rolle hinsichtlich der Nachleuchtwirkung bei Dunkelheit. Daher wirkt
  insbesondere Verschattung, etwa durch Vegetation (vor allem Bäume) negativ auf
  die Wirkung und ist bei etwaigen Standorten zu bedenken.
