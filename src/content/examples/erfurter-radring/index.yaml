  - Geteilte Planungszuständigkeiten 
  - Viel (denkmalgeschütztes) Kopfsteinpflaster
particularities: |-
  - Beteiligung
  - Interkommunal
  - Spezifische Zielgruppe: Tourist\*innen
results: Der Radring Erfurt lädt ein auf 110 km und acht Abschnitten die
  Thüringer Landeshauptstadt Erfurt zu umrunden und in das ländliche Idyll der
  Landkreise Sömmerda, Weimarer Land, Ilm-Kreis und Gotha einzutauchen. Neben
  schönen und vielfältigen Landschaften sind es die zahlreichen Highlights und
  Informationen rechts und links am Wegesrand, die zu einer Rast einladen. Der
  Radring schafft außerdem eine Radwegeverbindung zwischen der Stadt Erfurt und
  dem Umland.
challenges: Die erste Herausforderung bestand darin alle angrenzenden Gemeinden
  und Landkreise für das Projekt zu begeistern und von ihnen eine schriftliche
  Bereitschaftserklärung (für Beteiligung an Umsetzung Finanzierung laufender
  Unterhaltung) zu erhalten. Weiterhin stellte die Corona-Pandemie eine
  unerwartete Herausforderung dar da es im Planungs- und Umsetzungsprozess
  fortwährend zu Ausfällen bei Projektbeteiligten kam. Viele Arbeitsschritte
  (Planungsrunden Materialbeschaffung Beschilderungsarbeiten) konnten nicht
  planmäßig durchgeführt werden.
communication: Zu Beginn der Radsaison 2022 wurden noch Marketingmaßnahmen
  (Flyer Internetauftritt) realisiert.
