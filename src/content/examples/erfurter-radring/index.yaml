description: >-
  Es wurden sieben Radialen ausgebaut, um die 110 km lange Rundtour vom Zentrum
  aus zu erreichen und von ambitionierten Radfahrenden in einer oder mehreren
  Etappen befahren zu werden. Da der Rundweg immer wieder die Stadtgrenze
  überschreitet profitieren auch die angrenzenden Landkreise von diesem Angebot.
  Weiterhin wird mittels großformatiger Hinweisschilder Wissen und Wertschätzung
  über die regionale Landwirtschaft vermittelt. Um den baulichen Aufwand gering
  zu halten, wurde sich an bestehenden Rad- und Wirtschaftswegen orientiert.
  Dabei sollten interessante Orte miteinander verknüpft werden. 


  Frühzeitig wurden die drei betreffenden regionalen LEADER-Aktionsgruppen
  (LEADER-RAG) einbezogen, welche den Radring zum gemeinsamen
  Kooperationsprojekt erklärten. LEADER ist eine Fördermaßnahme der Europäischen
  Union zur Entwicklung des ländlichen Raumes. 


  Folgende Arbeitsschritte wurden definiert: Trassenfindung Mängelbeseitigung
  Wegebau Beschilderung Finanzierung Fördermittelakquise und
  Öffentlichkeitsarbeit. Die Arbeiten fanden überwiegend 2018- 2022 statt. Im
  Herbst 2021 war die Route fertig beschildert. Im Mai 2022 erfolgte die
  feierliche Eröffnung. Ergänzend stellte der Thüringer Bauernverband e.V. 25
  großformatige Hinweisschilder mit thematischem Bezug zur Landwirtschaft
  entlang der Route auf.
