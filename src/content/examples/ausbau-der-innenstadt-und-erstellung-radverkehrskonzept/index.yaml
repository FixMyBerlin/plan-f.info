description: >-
  Das Projekt umfasst die Umgestaltung des zentralen Knotenpunkts und Errichtung
  eines Shared Space Bereiches. Bereits bei den ersten Überlegungen wurde viel
  Wert auf die Sichtbarkeit der Verkehrsteilnehmenden gelegt. Anfangs stand das
  Fahrrad nicht im Fokus der Planungen. Dies hat sich inzwischen – wie beim
  Klimaschutz – immens geändert. Dadurch wurde die Aufenthaltsqualität in der
  Innenstadt erheblich verbessert. Die Fahrbahn und Nebenanlagen werden nur
  durch Pflasterrinnen getrennt. Der Radverkehr wird im Mischverkehr geführt,
  die zulässige Höchstgeschwindigkeit wurde auf 20 km/h reduziert. Die Belange
  schwächerer Verkehrsteilnehmenden werden dadurch berücksichtigt. 


  Zudem wurde der Zentrale Omnibusbahnhof neugestaltet. Für das gesamte
  Stadtgebiet wird außerdem ein Radverkehrskonzept erstellt und es wurde dem
  Projekt moobil+ vom Landkreis Cloppenburg beigetreten. Dieses fördert ein
  Rufbussystem in den Landkreisen Vechta und Cloppenburg,


  Die Neuplanung der Innenstadt wurde in enger Abstimmung mit den Bürger\*innen
  geplant (Erarbeitung des Ausbaukonzepts im Rahmen einer frühzeitigen
  Einbeziehung der Anwohnenden). Mit dieser Vorgehensweise wurden die zu
  erwartenden Widerstände reduziert. Insgesamt hat die Stadtsanierung durch die
  intensive Beteiligung der Anwohnenden und der Bevölkerung gewonnen. 
   
  Bei der Erarbeitung des Radverkehrskonzept ist die Öffentlichkeitsbeteiligung
  abgeschlossen. Daran anschließend bearbeitet das Planungsbüro alle
  entsprechenden Eingänge, um diese in das abschließende Konzept einfließen zu
  lassen. Es wird damit gerechnet, dass der Rat das Radverkehrskonzept im Mai
  2023 beschließt. 


  Die Umsetzung der Maßnahmen aus dem Radverkehrskonzept bindet personelle und
  haushaltspolitische Kapazitäten. Die Akquise von Fördermitteln spielt in
  Zukunft eine wesentliche Rolle bei der Herstellung von Radverkehrsanlagen.
goals: |+
  - Sicherheit
  - Komfort und Fahrspaß
  - Mehr Personen fahren Fahrrad
  - Fahrrad steigt in der Wahrnehmung / Statussymbol
  - Reduktion privater Autoverkehr (sogenannter MIV)
  - Klima- und Umweltschutz
  - Flächengerechtigkeit
  - Attraktivität des Fahrens im Mischverkehr für Radfahrende erhöhen
  - Steigerung der Wahrnehmung von zu Fußgehenden

localChallenges: |-
  - Flächenkonflikte
  - Polyzentrale Struktur/Zersiedelung
  - Kaum/keine Angebote ÖPNV
  - Die Anpassung der unterschiedlichen Höhen der Eingänge der Ladengeschäfte
particularities: >+
  - Beteiligung

  - Nachhaltige Ressourcen

  - Verkehrsversuch oder Modellvorhaben

  - Inklusive Maßnahme (Erhöhung Zugänge / Gerechtigkeit)

  - Spezifische Zielgruppe: Schüler\*innen, Lasten- und Lieferverkehr,
  Tourist\*innen

results: 'Bei knappen Verkehrsraum ist die Führung des Radverkehrs im
  Mischverkehr bei einem verkehrsberuhigenden Ausbau zielführend. Die
  Verkehrsteilnehmenden sind im Nachgang über eine Art „Gebrauchsanweisung"
  weiter zu informieren. '
challenges: 'Die angespannte Lage bei den Baufirmen (knappes Personal und
  Materialbeschaffung) haben zu stets gestiegenen Baukosten geführt. Teilweise
  sind bei der Beschaffung keine Angebote eingegangen. '
