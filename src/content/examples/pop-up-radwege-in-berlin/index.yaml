description: >-
  Berlin hat mit dem Mobilitätsgesetz ein anspruchsvolles Programm zum Ausbau
  des Radverkehrsnetzes beschrieben und die rechtliche Grundlage für eine
  fahrradgerechte Stadt gelegt. Infolgedessen wurde es nötig, die Planungs- und
  vor allem die Umsetzungsprozesse zu beschleunigen. Die tradierten Verfahren
  brauchten bis dato deutlich zu lange. 


  Infolge intensiver Prozessanalysen durch das Bezirksamt
  Friedrichshain-Kreuzberg als Baulastträger in Zusammenarbeit mit der
  zuständigen zentralen Straßenverkehrsbehörde (SVB) der Senatsverwaltung für
  Umwelt, Mobilität, Verbraucher- und Klimaschutz (SenUMVK) sowie der
  Koordinierungsstelle Radverkehr (KRF) wurde deshalb ein Verfahren entworfen,
  welches rein über die Anwendung von Regelplänen auf großen mehr streifigen
  Hauptverkehrsstraßen einzelne Fahrstreifen zu Radfahrstreifen umwandelt. Mit
  Gelbmarkierungen und mobilen Baken, wie sie aus der Baustellensicherung
  bekannt sind, richteten diese Verwaltungseinheiten und weitere Bezirke in
  einem agilen Verfahren insgesamt 25 km neue Radstreifen in fünf Berliner
  Bezirken ein. Von der Entscheidung zur Umsetzung über die Anordnung bis zur
  Verkehrsfreigabe vergingen so im Schnitt nur ca. zehn Arbeitstage. Zur
  Anwendung über den Einzelfall hinaus wurden TEER-Regelpläne (Temporäre
  Einrichtung und Erweiterung von Radverkehrsanlagen) veröffentlicht, die auch
  schon in weiteren Städten (z. B. München, Wien, Stuttgart) Anwendung fanden. 


  Der gesamte Prozess wurde von der Koordinierungsstelle Radverkehr
  dokumentiert, um als Vorlage für ein künftiges Regelverfahren zu dienen. Die
  zunächst zeitlich befristete Anordnung erlaubt in Kombination mit der
  Umsetzung durch temporäre Mittel jederzeit ein Nachsteuern, um die konkrete
  Ausgestaltung auf Basis von Verkehrsbeobachtungen anzupassen. Für nahezu alle
  Strecken ist nunmehr eine Verstetigung der Anordnung und eine dauerhafte
  Umsetzung erfolgt. Schon zu Beginn trafen die Pop-up-Bike-Lanes auf eine hohe
  Akzeptanz: Nicht repräsentative Daten der App Strava zeigen eine Steigerung
  des Radverkehrsaufkommens zwischen 55,6 Prozent (Kottbusser Damm) und 252,7
  Prozent (Kantstraße) im September 2020 im Vergleich zum Vorjahresmonat.
