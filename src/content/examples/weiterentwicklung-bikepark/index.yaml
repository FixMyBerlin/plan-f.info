description: Auf dem städtischen Gelände wurde durch den Verein RSK Kirchheim
  ein Bikepark gebaut, der allerdings nicht, wie mit der Stadtverwaltung
  vereinbart, betrieben werden konnte. Deshalb hat der Verein im Sommer 2018 das
  Gelände an die Stadt zurückgegeben. Daraufhin wurde nach einer Lösung zur
  Weiterentwicklung des Bikeparks gesucht. Über das Beteiligungsprojekt „bePart“
  wurde mit Kindern und Jugendlichen der Bikepark als öffentlich zugängliche
  Fläche ohne Vereinszwang entwickelt. Ziel war es, eine multifunktionale
  Nutzung für alle Altersstufen und Schwierigkeitslevel zu entwickeln. Ebenfalls
  standen Bildung, Gesundheit und Soziale Integration im Vordergrund. Nach den
  ersten Projektveranstaltungen und der Aufstellung einer Konzeption wurde die
  Firma Radquartier mit der weiteren Planung beauftragt. In den weiteren
  Planungsprozessen entstand aus der Konzeption das im Jahr 2019 umgesetzte
  Projekt, bestehend aus verschiedenen Dirt-Lines (Strecken mit Erdhügeln für
  Sprünge), einem Asphalt-Pumptrack und einer Minirampe. Der Asphalt-Pumptrack
  ist multifunktional mit allen Rollsportarten ab drei Jahren (Laufrad) nutzbar.
  Auch die Minirampe kann mit Skatebord, Scooter und BMX befahren werden. Die
  Dirt-Lines sind so konzipiert, dass diese von Fahrer\*innen mit
  unterschiedlichen Schwierigkeitsleveln genutzt werden können. Der Bikepark
  wurde in einer Bauzeit von vier Wochen unter Beteiligung der Kinder und
  Jugendlichen (Bauworkshops) gebaut und am 20.10.2019 eröffnet. Er ist frei
  zugänglich und kann auch von Schulen und Vereinen für motorische Schulungen
  genutzt werden. Durch die Integration des Asphalt-Pumptracks auf dem Gelände
  kann der Bikepark auch witterungsunabhängig genutzt werden. Aktuell werden von
  „bePart“ verschiedene Bike- und Skatekurse auf dem Gelände angeboten. Für die
  Pflege und Unterhaltung ist die Stadt Kirchheim unter Teck verantwortlich.
  Unterstützt wird die Stadt von Jugendlichen, welche die Dirt-Lines
  unterhalten. Das Wissen über die Instandhaltung der Strecken haben sie bereits
  in den Bau-Workshops gezeigt bekommen und erlernt.
