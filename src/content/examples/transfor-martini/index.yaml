description: >
  Eine starke und erlebbare Kultur hilft Bremen und der Metropolregion sich
  nicht nur in seiner Außenwahrnehmung zu stärken und damit
  regionalwirtschaftliche Effekte zu gewährleisten, sondern den Mehrwert der
  erlebbaren Stadtkultur sichtbar zu machen. 


  Ziel des Reallabors TransforMartini war es, die Martinistraße als urbanen Raum
  für Menschen temporär als lebenswert erfahrbar zu machen, um aus dieser
  Erfahrung Erkenntnisse für den späteren Umgang mit der Martinistraße im Rahmen
  des Verkehrsentwicklungsplans zu schöpfen. Um dies im Spiegel der diversen
  Stadtgesellschaft zu schaffen, wurden und werden neben Kultur- und
  Kreativschaffenden ebenso Player aus Stadtentwicklung, Wirtschaft, Bau,
  Digitalisierung, Bildung und Soziales wie auch Bürger\*innen verschiedener
  Alters- und Sozialstrukturen in den neu entstehenden Erlebnisraum involviert. 

  Das Vorhaben der temporären Umgestaltung der Martinistraße seit Juli 2021 in
  einen Erlebnisraum setzt sich aus vielen einzelnen Segmenten zu einem
  Gesamtkonzept zusammen. Diese Segmente sind im Rahmen der Zeitperiode teils
  durchgängig, teils wiederum temporär. Sie sind teils verkehrsrechtliche
  Anpassungen der Straßenführung und teils gestalterische Maßnahmen zur
  Steigerung der Aufenthaltsqualität. Sie bestehen teils aus materiellen
  Neuerungen wie Mobiliar oder Begrünung, aber auch aus künstlerischen
  Darbietungen, Eventhighlights und sportiven Freizeitangeboten. 


  Durch den Rückbau der Straße und die veränderte Wegführung entsteht
  erstaunlich viel freie Fläche einerseits und der Bedarf an
  Fahrbahnmarkierungen andererseits. Beide Arten von Flächen sollen ansprechend
  gestaltet werden. Die jeweils neue Fahrbahnführung für Kfz, Fahrräder und ÖPNV
  wird durch Straßenschilder und andere verkehrsrechtlich notwendige
  Begrenzungen kenntlich gemacht, dabei aber auch farblich hervorgehoben. Neu
  gewonnene Freiflächen werden als solche den Menschen zum Begehen zur Verfügung
  stehen und so das Platz- und Wohlgefühl der Fußgänger\*innen stärken. Der
  Radverkehr wird stellenweise durch Protected Bike Lanes gestärkt.
goals: >
  - Überwindung weiter Distanzen

  - Reduktion privater Autoverkehr (sogenannter MIV)

  - Klima- und Umweltschutz

  - Flächengerechtigkeit

  - Reallabor für die zukünftige Stadt, in der Menschen wieder Platz haben und
  nicht nur Autos.

  - Lärmschutz

  - Belebung Innenstadt

  - Stärkung „Stadt am Fluss“
