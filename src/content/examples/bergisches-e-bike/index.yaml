description: >-
  Auf Grundlage des Integrierten Klimaschutzkonzeptes wurde im Jahr 2019 das
  Integrierte Mobilitätskonzept des Rheinisch-Bergischen Kreises verabschiedet.
  Mit dem Konzept verfolgt der Kreis das Ziel, die Ansätze zur Verbesserung,
  Optimierung und Etablierung neuer und bestehender Verkehrslösungen über alle
  Verkehrsträger hinweg in einer ganzheitlichen Strategie für eine
  zukunftsfähige nachhaltige Mobilitätsentwicklung zusammenzuführen. 

   

  Die größte Herausforderung sieht der Kreis hierbei in der Reduktion des
  Treibstoffverbrauchs sowie des CO₂- Ausstoßes. Der Kreis ist durch die starke
  Nutzung des Pkw geprägt, denn über die Hälfte der Einwohner/*innen nutzt für
  ihre Wege ein Fahrzeug des motorisierten Individualverkehrs. So entstehen
  lange Staus und die Bürger/*innen leiden unter dem Lärm und den Abgasen.
  Deswegen gilt es vor allem den privaten Autoverkehr, den sogenannten
  motorisierten Individualverkehr (MIV) zu reduzieren sowie den Bürger/*innen
  attraktive alternative Mobilitätsangebote zu unterbreiten. Das gemeinsam
  erarbeitete Projekt der Mobilstationen, dessen Umsetzung Anfang 2020 startete
  und 2023 abgeschlossen wird, soll hier Abhilfe schaffen. Im Projekt
  „Mobilstationen im RBK – Das Bausteinsystem“ errichtet der Rheinisch-Bergische
  Kreis ein kreisweites Netz aus Mobilstationen, um den Bürger/*innen ein
  flexibles und nachhaltiges öffentliches Verkehrsangebot als Alternative zum
  eigenen Auto im ländlich geprägten Kreis zu bieten.  

   

  Im Juli 2020 wurde als erster Baustein der Mobilstationen im
  Rheinisch-Bergischen Kreis mit dem Pedelec-Verleihsystem „Bergisches e-Bike“
  gestartet, welches vom Dienstleister nextbike zusammen mit der Regionalverkehr
  Köln GmbH (RVK) eingerichtet wurde. Dieser übernimmt auch den Betrieb mit
  Reparaturen und Wartungen sowie die gleichmäßige Verteilung der insgesamt 103
  Räder auf die 12 festen Stationen sowie 20 Stationen ohne Lademöglichkeit. Bis
  Mitte 2023 wurden außerdem noch weitere Stationen eingerichtet.  

   

  Die Planung und Umsetzung ist in enger Absprache mit den Kommunen und dem
  betrauten Verkehrsunternehmen RVK erfolgt, um die Verleihstationen, die sich
  an zentralen Knotenpunkten im Kreis befinden, aufstellen zu können. Mit dem
  elektrisch betriebenen Rad können die Nutzer/*innen einfach die bergige
  Topografie des Kreises überwinden und damit ihren Zielort erreichen oder an
  einer der Mobilstationen auf ein anderes Verkehrsmittel wechseln. 

   

  Im Rahmen der Europäischen Mobilitätwoche 2022 (16. -22. September 2022)
  gingen das benachbarte Ausleihsystem wupsiRad und das Bergische e-Bike
  gemeinsamen einen wichtigen Schritt. Sieben Übergangsstationen, an denen das
  Ausleihen und Zurückgeben von Fahrrädern beider Systeme möglich ist,
  ermöglichen seitdem das Fahren über Gemeindegrenzen hinweg und machen die
  Nutzung so noch einfacher und attraktiver. Mit nextbike als langjährigem
  Partner beider Unternehmen ist die volle technische Kompatibilität,
  insbesondere bei den e-Bikes, gesichert. Seit 1. März 2023 gibt es ebenfalls
  weitere Übergangsstationen zusammen mit dem Rhein-Sieg-Kreis und der Stadt
  Köln.
