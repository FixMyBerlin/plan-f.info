description: >-
  Mit dem Netzwerk möchte der Kreis Soest interessierten Unternehmen die
  Gelegenheit bieten, die Mobilität in ihrer Firma und für Ihre Mitarbeitenden
  zu optimieren und nachhaltiger zu gestalten. Die Leistungen des Netzwerkes
  sind: 
   
  Organisation des Netzwerkes (finanziert durch den Kreis): 


  - Schulungen und Workshops 

  - Erfahrungsaustausch in gemeinsamen Netzwerktreffen 


  Analyse der Mobilität im Unternehmen (auf eigene Kosten der Betriebe): 


  - Bestandsaufnahme der aktuellen Verkehrsabläufe 

  - Kostenanalyse der Mobilität im Unternehmen - insbesondere im Hinblick auf
  die Mobilität der Mitarbeitenden 

  - Darauf aufbauend eine Potenzialanalyse 

  - Maßnahmenempfehlungen 


  Ziel ist es, dass Institutionen ihren Mitgliedern nachhaltige Mobilität
  kommunizieren. Mitarbeitenden werden alternative Mobilitätsformen aufgezeigt,
  die auch für die Arbeitgebenden und Kollegen\*innen interessant sein können.
goals: |-
  - Überwindung weiter Distanzen
  - Reduktion privater Autoverkehr (sogenannter MIV)
  - Klima- und Umweltschutz
localChallenges: |-
  - Verbesserung der Mobilität/Anbindung 
  - Nicht ausreichende Parkflächen für die Arbeitnehmer*innen
particularities: |-
  - Evaluation
  - Verkehrsversuch oder Modellvorhaben
  - Spezifische Zielgruppe: Pendler\*innen
results: Netzwerk mit regelmäßigen Treffen und Verbesserung des öffentlichen
