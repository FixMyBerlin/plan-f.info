description: >-
  In Chemnitz ist das Radfahren im Alltag nicht weit verbreitet, wofür
  verschiedene Ursachen existieren. Wie zum Beispiel die Topografie des
  Stadtgebietes (z. B. teilweise starke Anstiege), die Altersstruktur der
  Bevölkerung, ein unzureichend ausgebautes, zum Teil lückenhaftes und als
  unsicher wahrgenommenes Radverkehrsnetz, ein teilweise erlerntes bzw.
  „vererbtes“ auto-orientiertes Mobilitätsverhalten in allen
  Bevölkerungsschichten sowie Verhaltensdefizite von anderen
  Verkehrsteilnehmenden.  


  Diese Situation betrifft auch die Wahl des Verkehrsmittels in Bezug auf
  Schulwege: Vor dem Hintergrund einer als kritisch eingeschätzten Qualität von
  Schulwegen lassen Eltern ihre Kinder häufig nicht mit dem Fahrrad zur Schule
  fahren, weil das Radfahren im Allgemeinen nicht als Verkehrsmittel oder
  pauschal als unsicher wahrgenommen wird. Dies führt dazu, dass Kinder nicht
  mit dem kompletten Spektrum der urbanen Verkehrsmittel vertraut werden und
  deren Mobilitätsverhalten einseitig auf wenige Verkehrsmittel fokussiert.   


  Das Projekt „RADerFAHREN“ knüpft an diese Ausgangssituation an, in dem es die
  Mobilitäts(aus)bildung und Verkehrserziehung als Teil der Umweltbildung von
  Kindern sowie von deren Erziehungsberechtigten und Lehrer\*innen adressiert. 


  Das Projekt konzentriert sich vorrangig auf die Zielgruppe der Kinder im Alter
  von circa zehn Jahren. Laut Straßenverkehrsordnung (StVO) müssen Kinder ab dem
  elften Geburtstag auf dem Radweg oder der Fahrbahn fahren. Es ist auch die
  Zeit, in der Kinder von der Grundschule zur weiterführenden Schule wechseln
  und sich mit einem neuen Schulweg evtl. auch für ein anderes Verkehrsmittel
  entscheiden. Die Kinder werden aktiv und auf partizipative Weise im gesamten
  Projektverlauf einbezogen. Beispiele hierfür sind die Erstellung einer
  kinderfreundlichen Fahrradkarte und eines Wettbewerbs, in dem die
  Schüler\*innen ihre Motivation und Erfahrungen beschreiben, mit dem Fahrrad
  zur Schule zu fahren und dazu Beiträge spezifischer Schulfächer beifügen.
  Außerdem werden die Kinder im Rahmen von Fahrrad-Parcours oder Kurzbefragungen
  praktisch eingebunden.  


  Die Technische Universität (TU) Chemnitz übernimmt neben der Projektleitung
  dabei auch die wissenschaftliche Begleitung des Projektes. Für Aktionen sind
  außerdem weitere Akteur\*innen beteiligt.
