description: >-
  Basierend auf dem LEADER-geförderten Projekt „Aktiv durch den Landkreis
  Pfaffenhofen an der Ilm“, bei welchem über 1.000 km des Rad- und
  Wanderwegenetzes eine neue Beschilderung erhalten haben, wurden die
  Projektergebnisse optisch ansprechend in neuen Printprodukten aufbereitet.  
   
  Die Besucher\*innen erwartet im Landkreis eine enorme Bandbreite an Radtouren,
  die zu einem abwechslungsreichen Ausflug einladen. Die durchgängig nach
  Forschungsgesellschaft für Straßen- und Verkehrswesen e.V. (FGSV)-Standard
  ausgeschilderten Routen führen vorbei an idyllischen Flussufern und imposanten
  Hopfengärten, durch Täler und über Hügel. Historische Städte und Bauwerke
  zählen ebenso zu den Wegbegleitern wie ehrwürdige Klöster, versteckte Kapellen
  und herrschaftliche Schlösser.  
   
  Egal, ob entspannte Ausfahrten mit der Familie, traumhafte Ausblicke oder
  sportliche Herausforderungen – das Wegenetz bietet Möglichkeiten für alle. Die
  neue Radlkarte vereint hierbei alte „Klassiker“ und überregional bedeutende
  Wege, wie den Donauradweg oder die Ilmtaltour, mit den neuen Thementouren. 
   
  In Zusammenarbeit mit den 19 Landkreiskommunen wurden 14 neue
  Streckenvorschläge, welche die mannigfaltigen Besonderheiten des Landkreises
  widerspiegeln, erarbeitet. Insgesamt dürfen sich Besucher\*innen auf 30
  Radstrecken unterschiedlicher Länge und Anforderungsprofile freuen. Auf der
  Rückseite der Karte befindet sich eine kurze Tourenbeschreibung mit den
  Informationen zu Länge, konditionellen Anforderungen, Zeitdauer und
  Höhenmetern der Strecken. Ergänzende Informationen wie E-Bike-Ladestationen,
  Stellplätze und Verhaltenstipps runden die Informationen ab. Mittels eines
  QR-Codes können die GPX-Daten und die Tourenbeschreibungen direkt aufs Handy
  geladen werden.  
   
  Ergänzend zur Karte wurde zudem ein umfangreiches Tourenbuch geschaffen,
  welches im handlichen Hosentaschen-Format weiterführende Informationen
  liefert. Neben detaillierten Tourenbeschreibungen dürfen sich Leser\*innen auf
  Kartenausschnitte, wissenswerte Informationen und spannende Tipps freuen.
  Gespickt mit authentischen Fotos machen sie Lust auf zahlreiche Entdeckungen
  im Landkreis.  
   
  Neben dem Bereich Radfahren lag der Fokus auch auf der Beschilderung
  zahlreicher Wanderwege, die ebenfalls unterschiedlichen thematischen
  Schwerpunkten gewidmet sind. Hierzu entstand im Nachgang des
  Beschilderungsprojektes ebenfalls eine umfassende Wanderkarte samt
  begleitendem Tourenbuch.
