results: '700 km des Radwegenetzes und 380 km des Wanderwegenetzes wurden neu
  beschildert. Im Zuge dessen wurden unter anderem 14 neue Themenradtouren
  erarbeitet. Aufbauend auf dieses Projekt wurden eine neue, moderne Radkarte
  sowie ein anschauliches begleitendes Tourenbuch mit weiterführenden
  Toureninformationen erarbeitet. Beide Printprodukte sind kostenfrei
  erhältlich. Darüber hinaus entstanden für den Bereich Wandern ebenfalls eine
  Karte mit zahlreichen Tourenvorschlägen und ein begleitendes Tourenbuch mit
  detaillierten Informationen zu den Themenrouten. '
challenges: 'Abstimmung mit beteiligten Kommunen, Abstimmung mit externen
  Dienstleistenden, Abstimmung mit externen Einrichtungen (z.B. WWA, BaySF,
  etc.), Akzeptanz bei privaten Grundstückseigentümer*innen, Land- und
  Forstwirtschaft (möglichst frühzeitige Abstimmung mit allen Partner*innen
  unabdingbar und erspart Auseinandersetzung im Nachgang) '
