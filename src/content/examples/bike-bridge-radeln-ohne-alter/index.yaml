description: >
  Bike Bridge organisiert in Kooperation mit Radeln ohne Alter Deutschland e.V.
  kostenlose Rikscha-Ausfahrten für und mit Senior\*innen in Freiburg. Ziel des
  Angebots ist es, besonders die Mobilität älterer Menschen zu steigern und
  somit ihre Teilhabe am gesellschaftlichen Leben zu verbessern. Zugleich sollen
  Jung und Alt zusammengebracht werden, um sich Geschichten zu erzählen,
  voneinander zu lernen und gemeinsam zu lachen. Die Fahrten werden von
  ehrenamtlichen Rikscha-Pilot\*innen angeboten.


  Bike Bridge Freiburg wünscht sich, dass es für alle möglich ist, das
  Fahrrad(-fahren) zu erleben, zu nutzen und mobil zu sein. So beispielsweise
  Frauen, die bisher nicht die Möglichkeit hatten, das Fahrradfahren zu lernen
  oder Senior\*innen, denen es aufgrund ihres Alters, Krankheit oder anderen
  Gegebenheiten nicht (mehr) möglich ist, selbst- und eigenständig Fahrrad zu
  fahren. Bike Bridge möchte ein Freizeitangebot für diese häufig sozial
  exkludierte Zielgruppe schaffen und die verschiedenen Zielgruppen unserer
  Vereinsangebote (Menschen mit Flucht- und Migrationsgeschichte, Menschen aus
  der lokalen Bevölkerung) miteinander in Kontakt und Austausch bringen. Wie
  auch die Bike & Belong Kurse von Bike Bridge, soll das Projekt dazu beitragen,
  den sozialen Zusammenhalt in unserer Gesellschaft zu fördern und zu stärken.
  Es geht uns darum, ein Miteinander zu erzielen und zu gestalten.

  Seinen Ursprung hat das Projekt Radeln ohne Alter in Dänemark: Seit 2012
  organisiert der Kopenhagener Verein Cycling without Age Rikscha-Fahrten und
  -Ausflüge mit Bewohner\*innen von Seniorenzentren. Unter dem Motto “Jede\*r
  hat ein Recht auf Wind in den Haaren” haben sich seither bereits in 42 anderen
  Ländern Ableger des Vereins gegründet. Der gemeinnützige Dachverband Radeln
  ohne Alter Deutschland e.V., der in Bonn gegründet wurde, unterstützt seit
  2019 neue Standorte beim Start. Seit 2020 ist auch Bike Bridge dabei.
