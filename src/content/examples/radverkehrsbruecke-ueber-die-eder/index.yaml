description: >-
  Eine der im städtischen Radverkehrskonzept identifizierten Hauptrouten führt
  aus Nordwesten kommend in östliche Richtung vom sogenannten „Ederdorf“, einem
  Wohnquartier mit rund 40 % der Kernstadtbevölkerung, durch die Ederaue („Große
  Wehrweide“), in Richtung Innenstadt, u. a. zu einem Behörden- und
  Schulzentrum. Auf dem Weg dorthin muss die Eder sowie ein Mühlgraben überquert
  werden. Die alte Ederbrücke war baulich jedoch nicht nur in einem schlechten
  Zustand, sondern mit einer Rampenneigung von zehn bzw. 13 Prozent zudem nicht
  barrierefrei. Das Projekt umfasst daher die bauliche Erneuerung der Brücke
  über die Eder inkl. Beschilderung, Markierung und Beleuchtung. Neben der
  Brückenerneuerung wurde begleitend auch das Wegekonzept auf der „Großen
  Wehrweide“ verbessert. Der Standort der neuen Brücke wurde hierbei so gewählt,
  dass eine direktere Wegeverbindung entsteht. Die Brücke ist rund 60 m lang und
  ist mit maximal sechs Prozent Steigung barrierefrei. Die Breite zwischen vier
  und fünf Metern erlaubt auch den sicheren Begegnungsverkehr. Vor allem der
  Alltagsradverkehr wird somit barrierefrei, sicher und auf einem direkteren Weg
  durch die Ederauen und über die Eder geleitet.  


  Das Tragwerk der Brücke besteht aus Holz, der Brückenbelag aus großformatigen
  und widerstandsfähigen Betonfertigteilen. Das Holz wurde vor allem für die
  Tragkonstruktion im vor Witterung geschützten Unterbau verwendet, das macht
  die Brücke nachhaltig und dauerhaft. Für die Trägerkonstruktion wurden rund
  160 m³ Holz verbaut und damit rund 160 t klimaschädliches CO2 eingelagert. Das
  macht die Brücke klimaneutral.   


  Die Epoxidharzbeschichtung des Weges in Sandbeige fügt sich harmonisch ins
  Landschaftsbild ein und minimiert die Oberflächentemperatur für das Mikroklima
  im Landschaftsschutzgebiet. Der Einstieg in den Radweg ist durch entsprechende
  Nullabsenkung barrierefrei und sicher gewährleistet. Die LED-Beleuchtung sowie
  die helle Oberflächenbeschichtung des Weges erhöhen die Sicherheit. Die Straße
  „Illersteg“ im weiteren Verlauf der Route wird zukünftig zur Fahrradstraße
  umgewidmet. 
   
  Das Projekt hat eine große Relevanz für den innerstädtischen Radverkehr, weil
  es für mehr als 4.000 Menschen die Fahrradanbindung an die Innenstadt
  entscheidend verbessert. Gleichzeitig „denkt“ es die Bedürfnisse von anderen
  mit. Besonders die Bewohner\*innen den nahegelegenen Senior*\innenheims
  profitieren von der Neugestaltung. Für sie entsteht erstmals ein
  barrierefreier Weg in die attraktiven Ederauen.
