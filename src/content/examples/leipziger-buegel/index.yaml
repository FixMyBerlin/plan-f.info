description: >-
  Mit den "Leipziger Bügeln" wurde in den letzten Jahren immer mehr
  Abstellmöglichkeiten für Fahrräder geschaffen. Allein in der Innenstadt wurden
  über 1.000 solcher Fahrrad-Anlehnbügel aufgestellt. 


  Insgesamt sind rund 11.000 Fahrradanlehnbügel mit Platz für 22.000 Fahrräder
  im öffentlichen Raum der Stadt vorhanden. Seit 2021 erfolgt als Pilotprojekt
  die Aufstellung von Fahrradanlehnbügeln für Lastenfahrräder. Die
  Lastenradbügel sind eine eigene Entwicklung und werden speziell für Leipzig
  angefertigt. Sie berücksichtigen die Besonderheiten der Geometrie von
  Lastenfahrrädern. Während normale Fahrradanlehnbügel eine Länge von 100 cm
  haben, sind die Lastenradbügel nur 50 cm lang. Auch die Aufstellung im
  Straßenraum erfolgt mit anderen Abständen und/oder Winkeln als bei den
  normalen Fahrradbügeln.


  Auch auf Antrag von Bürgern kann die Errichtung der "Leipziger Bügel" im
  öffentlichen Verkehrsraum durch das Verkehrs- und Tiefbauamt erfolgen, das für
  sie darüber hinaus sowohl die Planung, Errichtung als auch die laufende
  Instandhaltung der Bügel übernimmt.
