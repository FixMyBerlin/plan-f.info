description: >-
  Kein Auto weit und breit, lediglich eine autoförmige Hüpfburg ist zu sehen –
  und 265 Kinder auf der Burgstraße und dem bunten Schulhof der Südschule: Es
  ist der erste autofreie Tag und die erste Europäische Mobilitätswoche (EMW) in
  Herne! Und so feierte die Stadt am 20. September 2019 zusammen mit der
  Südschule den Mobilitätstag und zeigte, dass Fortbewegung auch ohne Auto geht.
  Die gesperrte Burgstraße vor dem Schulhof hatten die Grundschulkinder an
  diesem Tag ganz für sich und verwandelten sie mit Malkreide in eine bunte
  autofreie Zone.  


  An zehn Mitmachstationen konnten sie sich altersklassengerecht in den
  Bereichen Bewegung, Geschicklichkeit, Wissen, Verkehrserziehung, Kreativität
  und Gestalten beweisen. Die Spielideen wurden selbst entwickelt, woraus ein
  Aktions-Baukasten entstanden ist. Mit Pedalos, Rollbrettern, Rollern und
  Fahrrädern bis hin zu Trittsteinen probierten sie die Vielfalt der
  (Fort)Bewegung aus oder absolvierten den Fahrradparcours des ADFC und der
  mobilen Verkehrsschule.  


  Konzentration war auch beim Quiz, beim Basteln und dem Verkehrszeichen-Memory
  gefragt. Ein „Fahrkarten“-Stempel für jede gemeisterte Station, kleine Preise
  und Geschenke, aber vor allem neue Erkenntnisse, Fähigkeiten und ganz viel
  Spaß hinterließen bei den Kindern beste Erinnerungen an den Mobilitätstag.
  Auch von den Erwachsenen kam nur positives Feedback und trotz des relativ
  hohen Aufwandes würden sie gern den Mobilitätstag regelmäßig wiederholen.
