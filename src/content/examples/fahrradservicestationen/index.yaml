description: >
  Als Serviceverbesserung und damit Radfahrende unterwegs die Möglichkeit haben
  kleine Reparaturen an ihren Fahrrädern zu erledigen, wurden insgesamt 50
  Fahrrad-Servicestationen eingerichtet. Die kleinen Do-it-yourself-Stationen
  bieten Werkzeuge, eine Luftpumpe und eine Fahrradhalterung.

  Es wurden an fast sämtlichen Tankstellen im Gelsenkirchener Stadtgebiet sowie
  an einigen weiteren Standorten insgesamt 50 Fahrrad-Servicestationen
  eingerichtet. Hierzu wurde mit den Tankstellenbetreiber*innen eine
  vertragliche Regelung getroffen. 

  Die Servicestationen wurden mit Wartung ausgeschrieben, um den Standard halten
  zu können. Beschaffung und Aufbau konnten nahezu in der Spanne eines Jahres
  durchgeführt werden. 

  Zudem wurde noch in dem Mängelmelder der Stadt Gelsenkirchen (Homepage und
  App) der Punkt Fahrrad eingerichtet, sodass Schadensmeldungen unkompliziert
  und direkt bei den zuständigen Stellen eingehen konnten.
goals: |-
  - Komfort und Fahrspaß
  - Mehr Personen fahren Fahrrad
  - Klima- und Umweltschutz
  - Das Fahrradfahren durch (auffällige) Infrastruktur sichtbarer machen
localChallenges: |-
  - Finanzschwache Kommune
  - Flächenkonflikte 
  - Geteilte Planungszuständigkeiten
particularities: |
  - Inklusive Maßnahme (Erhöhung Zugänge / Gerechtigkeit)
  - Einsteiger\*innenmaßnahme
  - Quick-Win
results: 'Eine große Akzeptanz in der Bevölkerung. Wichtig war die Einrichtung
  der Schadensmeldung mit der Möglichkeit einer sofortigen Reparatur/Wartung der
  Station durch den Partner (GAFÖG) vor Ort. '
challenges: 'Die Erlaubnis zur Aufstellung an den unterschiedlichen Tankstellen
  war teilweise schwieriger zu erhalten. Freie Betreiber*innen konnten souverän
  entscheiden. Bei den Ketten mussten die Gesellschaften beteiligt werden, wobei
  eine grundsätzliche positive Akzeptanz für das Projekt vorhanden war. '
communication: Die Maßnahme wurde in der Presse, der Homepage sowie auf den
  Social Media Kanälen veröffentlicht.
