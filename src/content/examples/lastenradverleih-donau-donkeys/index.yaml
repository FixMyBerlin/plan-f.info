notes: >-
  Der Defizitausgleich beträgt 60.000 Euro pro Jahr, insgesamt also 120.000 Euro
  für die beiden beauftragten Jahre (brutto). Davon trägt 50 Prozent der
  kommunale Energieversorger REWAG und 50 Prozent die Stadt Regensburg. Eine
  Förderung durch Dritte (Bund oder Land) gibt es nicht.    


  Die Summe war vorgegeben, es hat das Unternehmen den Zuschlag erhalten, das
  die meisten Räder dafür betreibt. Im Fall des erfolgreichen Bieters
  Donau-Donkeys sind dies 25 Räder.
