description: >-
  Damit Menschen weniger Autofahren, muss für alle Mobilitätsbedürfnisse eine
  Alternative geboten werden. Nicht alle können und wollen sich ein Lastenrad
  kaufen. Diese Fahrzeuge sind nicht billig und nicht in jeder Wohnsituation
  gibt es Möglichkeiten, so ein großes Fahrzeug abzustellen. Mit dem neuen
  E-Lastenradverleih „Donau-Donkeys“ in Regensburg können Lastenräder über die
  Donkey Republic App nun an verschiedenen Standorten im Stadtgebiet gemietet
  werden. 


  Das Unternehmen „Feine Räder“ betreibt seit 2020 privatwirtschaftlich und seit
  August 2022 mit Unterstützung der Stadt Regensburg den Lastenradverleih,
  zunächst befristet für zwei Jahre. Da Feine Räder über eine hauseigene
  Werkstatt verfügt, ist auch für eine regelmäßige Wartung und Reparatur der
  Räder gesorgt. Für eine stetige Stromversorgung der Räder wurde außerdem
  eigene Ladeinfrastruktur entwickelt, die sukzessive an den Verleihstationen
  installiert wird und für die Aufladung der Akkus zur Verfügung steht. Der
  Strom wird dabei so nachhaltig wie möglich produziert. An einigen Standorten
  werden Solarladesäulen aufgestellt, andernorts wird in der Nacht auf den Strom
  aus der Straßenbeleuchtung zurückgegriffen. So können aufwändige
  Leitungsverlegungen vermieden werden. 


  Die Räder, die hauptsächlich zum Transport verwendet werden, werden an
  Standorten mit hoher Wohndichte platziert. Ist die Nachfrage an einem Standort
  zu gering, kann vergleichsweise unbürokratisch eine neue Station an einer
  anderen Stelle eingerichtet werden. 


  Die Stadt Regensburg und das Stadtwerk.Regensburg beteiligen sich finanziell
  an dem System und steuern insgesamt pro Jahr 60.000 Euro als Defizitausgleich
  für den Betrieb von 25 Rädern bei. So sind vergleichsweise günstige Tarife
  möglich. Die ersten 30 Minuten kosten 2,50 Euro, eine Stunde nur noch 50 Cent
  mehr. Auch Langzeitmieten, zum Beispiel für eine Wochenendfahrt über zwei oder
  drei Tage, sind möglich. Die Miete erfolgt über die Donkey Republic App. Die
  einmalige Registrierung geht schnell und ist kostenlos.
