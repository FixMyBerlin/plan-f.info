description: >-
  In den Bike & Belong Fahrradangeboten begegnen sich ca. zehn Teilnehmerinnen
  und zehn Trainerinnen und üben gemeinsam das Fahrradfahren. Gemeinsam wird ca.
  zwei Monate lang einmal pro Woche trainiert. Bevor die Kurse starten, werden
  die Ehrenamtlichen in einem Train-the-Trainer Workshop vorbereitet.  


  Viele der Teilnehmerinnen haben noch nie auf einem Fahrrad gesessen. Deshalb
  geht es im praktischen Training zunächst ganz langsam los: z. B. mit
  Gleichgewichtsübungen und Koordinationstraining. Zuerst wird mit Rollern oder
  Laufrädern geübt, um danach mit dem Fahrrad weiter zu üben. Anfahren, Kurven,
  Abbiegen, Schulterblick und vieles mehr. Doch in den Kursen wird nicht nur
  geradelt. Teil des Trainings sind auch erlebnispädagogische Elemente sowie
  Sprachspiele. Alle lernen sich kennen, tauschen sich aus und die Gruppe wächst
  zu einer tollen Gemeinschaft zusammen. 


  Neben der Praxis wird es auch theoretisch. Wenn alle Teilnehmerinnen sicher im
  Sattel sitzen, werden in einer theoretischen Einheit die wichtigsten
  Verkehrsregeln gelernt und Tipps für Fahrradfahrer\*innen im Straßenverkehr
  gegeben. Im praktischen Training wird das Gelernte direkt angewendet. Falls
  möglich, machen wir einen Ausflug zu einem Verkehrsübungsplatz und bereiten
  uns Schritt für Schritt auf das Fahren im Straßenverkehr vor.  


  Außerdem wird einen Nachmittag gemeinsam am Fahrrad geschraubt und die
  Teilnehmerinnen & Trainerinnen lernen die Basiskenntnisse der
  Fahrradreparatur, sodass sie lange viel Spaß mit ihrem neuen Fahrrad haben.
  Die Spendenfahrräder werden beim Reparaturworkshop noch einmal durchgecheckt,
  sodass sie verkehrssicher sind. Jede Teilnehmerin hat dann nach Kursende die
  Möglichkeit, ein eigenes Fahrrad zu erwerben.
