name: Tourismus und Freizeit
position: 80
shortDescription: Es gibt unterschiedliche kommunale Handlungsmöglichkeiten zur
  Förderung der touristischen und Freizeitfahrradmobilität fördern, wie z. B.
  touristische Infrastruktur, Services oder Informationen.
description: Das Handlungsfeld Tourismus und Freizeit schließt unterschiedliche
  kommunale Handlungsmöglichkeiten ein, welche die touristische und
  Freizeitradmobilität fördern. Dazu gehören u. a. öffentliche Angebote wie
  touristische Infrastruktur und Services, Informationen als auch
  Fördermöglichkeiten für die Privatwirtschaft (z. B. Abstellanlagen oder
  E-Ladestationen) oder Bike Parks.
