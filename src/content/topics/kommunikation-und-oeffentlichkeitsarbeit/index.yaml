name: Kommunikation und Öffentlichkeitsarbeit
position: 40
shortDescription: Maßnahmen aus dem Handlungsfeld Kommunikation und
  Öffentlichkeitsarbeit tragen dazu bei, das Fahrrad als Verkehrsmittel zu
  bewerben und vermitteln wichtige Informationen, zum Beispiel zu
  radverkehrsbezogenen Angeboten.
description: Das Handlungsfeld Kommunikation und Öffentlichkeitsarbeit schließt
  alle Maßnahmen ein, die das Fahrrad als Verkehrsmittel bewerben und wichtige
  Informationen, zum Beispiel zu radverkehrsbezogenen Angeboten oder neue sowie
  weniger bekannte Verkehrsregeln, verbreiten. Dazu gehören z. B. Maßnahmen wie
  Kampagnen und Veranstaltungen sowie einfache Pressemitteilungen. Kommunen
  können sich auch ein Branding als „Fahrradstadt“ zulegen und darüber hinaus
  selbst als Vorbilder auftreten, beispielsweise durch eine Zertifizierung der
  Kommunalverwaltung als fahrradfreundlicher Arbeitgeber.
