name: Multimodalität und Nahmobilität
position: 60
shortDescription: In dem Handlungsfeld Multimodalität und Nahmobilität dreht
  sich alles darum, den Radverkehr besser mit anderen Verkehrsmitteln zu
  verknüpfen sowie in Einklang mit anderen Formen der Nahmobilität zu bringen.
description: >-
  In dem Handlungsfeld Multimodalität und Nahmobilität dreht sich alles darum,
  den Radverkehr besser mit anderen Verkehrsmitteln zu verknüpfen sowie in
  Einklang mit anderen Formen der Nahmobilität zu bringen. Multimodalität kann
  beispielsweise durch Maßnahmen verbessert werden, welche die Mitnahme des
  Fahrrads in öffentlichen Verkehrsmitteln oder den Umstieg (Bike und Ride,
  Mobility Hubs, Abstellanlagen an ÖPNV-Haltestellen etc.) zu anderen
  Verkehrsmitteln erleichtern.  

  Zusätzlich ist es wichtig, geeignete Maßnahmen umzusetzen, die ein gutes
  Miteinander der verschiedenen Verkehrsmittel im Umweltverbund fördern.
