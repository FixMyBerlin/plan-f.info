name: Infrastruktur
position: 30
shortDescription: Maßnahmen zur Verbesserung von Radinfrastrukturanlagen
  (fließender und ruhender Verkehr). Um die Nutzbarkeit für alle Zielgruppen zu
  erhöhen, muss eine geeignete Radinfrastruktur so ausgelegt sein, dass sich
  alle Personen sicher fühlen.
description: Das Handlungsfeld Infrastruktur schließt alle Maßnahmen ein, die
  der Verbesserung der Radinfrastrukturanlagen dienen. Dabei geht es sowohl um
  den fließenden Radverkehr, z. B. Radwege, Einrichtung von Fahrradstraßen,
  Brücken oder sichere Kreuzungen oder die Beschilderung des Fahrradnetzes, als
  auch um Abstellanlagen für den ruhenden Verkehr. Um die Nutzbarkeit der
  Radmobilität für alle Zielgruppen zu erhöhen, muss eine geeignete
  Radinfrastruktur so ausgelegt sein, dass sich alle Personen sicher fühlen.
  Infrastrukturen, um die Multimodalität zu fördern, sind im Handlungsfeld 6
  „Multimodalität und Nahmobilität“ aufgeführt.
