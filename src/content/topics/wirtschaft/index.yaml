name: Wirtschaft
position: 70
shortDescription: Das Handlungsfeld Wirtschaft fokussiert auf Logistik mit dem
  Rad und welche den Kundenverkehr im Einzelhandel adressieren und die
  Radmobilität diesbezüglich fördern.
description: >-
  Wirtschafts- und Lieferverkehr macht einen großen Teil des Verkehrsaufkommens
  aus. Stadtlogistikkonzepte können dazu beitragen, dass ein Teil der
  Lieferfahrzeuge durch geeignete Fahrräder (z. B. Lastenräder) ersetzt wird. 


  Das Handlungsfeld Wirtschaft integriert auch Maßnahmen, die den Kundenverkehr
  im Einzelhandel adressieren und die Radmobilität diesbezüglich fördern (z. B.
  durch bestimmte Vorgaben, wie z. B. Stellplatzschlüssel für Fahrräder).
