name: Einzelhandel
position: 772
topic: wirtschaft
shortDescription: Kommunen können Maßnahmen ergreifen, um auch im Bereich des
  Einzelhandels die klimaneutrale Mobilität und den Radverkehr zu fördern.
description: 'Kommunen können Maßnahmen ergreifen, um auch im Bereich des
  Einzelhandels die klimaneutrale Mobilität und den Radverkehr zu fördern. Dazu
  gehört z. B. die Verbesserung der Erreichbarkeit von Geschäften mit dem
  Fahrrad, die Förderung von Abstellanlagen an Geschäften aber auch gelungene
  Kommunikation mit den Gewerbetreibenden: Viele haben Sorgen vor Umsatzeinbußen
  durch die Reduzierung von z. B. Autoparkplätzen. Durch Aufklärung und
  Informationen können Kommunen diesen Ängsten von Gewerbetreibenden
  entgegenwirken und sie von den positiven Auswirkungen der Förderung des
  Radverkehrs überzeugen.'
