name: Geschützte Radfahrstreifen
position: 334
topic: infrastruktur
shortDescription: Geschützte Radfahrstreifen bestehen aus einem durchgehenden
  Fahrradstreifen, der durch eine physische Trennung, wie beispielsweise Poller,
  Blumenkübel oder Betonbarrieren vom Autoverkehr getrennt ist.
description: Geschützte Radfahrstreifen bestehen aus einem durchgehenden
  Fahrradstreifen, der durch eine physische Trennung, wie beispielsweise Poller,
  Blumenkübel oder Betonbarrieren, vom Autoverkehr getrennt ist. Diese Trennung
  schafft einen physischen Schutz für Radfahrende und verbesserte insbesondere
  die subjektive Sicherheit, sodass alle Personen, wie auch Frauen, Kinder oder
  Senior\*innen, zum Radfahren ermutigt werden.
