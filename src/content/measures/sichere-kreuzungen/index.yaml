name: Sichere Kreuzungen
position: 333
topic: infrastruktur
shortDescription: Kreuzungen sind häufig Unfallschwerpunkte. Aus diesem Grund
  sind sichere Kreuzungen für den Radverkehr ein zentraler Bestandteil einer
  fahrradfreundlichen Infrastruktur.
description: Kreuzungen sind häufig Unfallschwerpunkte. Aus diesem Grund sind
  sichere Kreuzungen für den Radverkehr zentraler Bestandteil einer
  fahrradfreundlichen Infrastruktur. Sie ermöglichen es Radfahrenden, Kreuzungen
  sicher und ohne Verzögerungen zu überqueren, indem sie beispielsweise separate
  Fahrradwege, Fahrradampeln oder Verkehrsinseln bieten. Es ist wichtig, dass
  Sichtbeziehungen und getrennte Signalisierung von Rad- und Kfz-Verkehr an
  kritischen Stellen geschaffen werden. Die Abbiegegeschwindigkeit ist zu
  reduzieren und generell die Komplexität der Kreuzungen durch z. B. Herausnahme
  von Abbiegebeziehungen. Dadurch werden Konflikte mit anderen
  Verkehrsteilnehmenden minimiert und das Unfallrisiko für Radfahrende
  reduziert.
