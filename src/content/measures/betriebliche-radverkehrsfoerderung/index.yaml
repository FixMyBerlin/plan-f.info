name: Betriebliche Radverkehrsförderung
position: 773
topic: wirtschaft
shortDescription: Kommunen sollten Betrieben unterstützen, die interne
  Fahrradmobilität sowie die ihrer Mitarbeitenden zu fördern, um die nachhaltige
  Mobilität zu fördern und gleichzeitig die Gesundheit der Arbeitnehmenden zu
  verbessern.
description: Kommunen sollten Betriebe ermutigen, die interne Fahrradmobilität
  zu fördern, da dies nicht nur einen Beitrag zu Umwelt- und Klimaschutz,
  sondern auch zur Gesundheitsförderung der Arbeitnehmenden leistet. Hierbei
  können, Unternehmen beispielsweise bei der Schaffung von Fahrradstellplätzen
  unterstützt werden als auch mit Informationen.
