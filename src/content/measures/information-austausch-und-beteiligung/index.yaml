name: Information, Austausch und Beteiligung
position: 113
topic: governance
shortDescription: Partizipation und Austausch ist wichtig, um die Bedürfnisse
  und Anliegen der Bevölkerung und Stakeholder mit einzubeziehen, die
  Wirksamkeit und Akzeptanz von Maßnahmen zu erhöhen und das Engagement für den
  Radverkehr zu fördern.
description: Partizipation von Bürger\*innen in der Radverkehrsförderung ist
  wichtig, um die Bedürfnisse und Anliegen der Bevölkerung mit einzubeziehen und
  die Wirksamkeit und Akzeptanz von Maßnahmen zu erhöhen. Kommunen sollten zudem
  die Vernetzung von Akteur\*innen und den Austausch von Informationen und Ideen
  untereinander voranbringen. Dazu gehören Akteur\*innen aus Zivilgesellschaft,
  Verwaltung, Politik und Privatwirtschaft sowie weiteren relevanten
  Stakeholdern wie z. B. Schulen oder (Sport-)Vereine. Ein Austausch und
  Beteiligung der Bevölkerung ermöglicht es auch, das Engagement der Bevölkerung
  für den Radverkehr zu fördern.
