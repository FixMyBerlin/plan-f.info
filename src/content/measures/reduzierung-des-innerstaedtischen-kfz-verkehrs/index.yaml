name: Reduzierung des innerstädtischen Kfz-Verkehrs
position: 994
topic: verkehrsberuhigung
shortDescription: Eine Reduzierung des innerstädtischen Kfz-Verkehrs kann sich
  positiv auf die Nutzung des Fahrrads auswirken. Maßnahmen, welche den
  Kfz-Verkehr einschränken, regen die Nutzenden an, auf andere Verkehrsmittel
  umzusteigen.
description: 'Eine allgemeine Reduzierung des innerstädtischen Kfz-Verkehrs kann
  sich positiv auf die Nutzung des Fahrrads (und Umweltverbund) auswirken.
  Maßnahmen, welche den Kfz-Verkehr einschränken, regen die Nutzenden an, auf
  andere Verkehrsmittel, wie das Fahrrad, umzusteigen. Gleichzeitig wird die
  Fahrradmobilität durch weniger Autoverkehr attraktiver. '
