name: Kombination Fahrrad und ÖPNV
position: 661
topic: multimodalitaet-und-nahmobilitaet
shortDescription: Die Förderung der Kombination aus Fahrrad des öffentlichen
  Personen-Nahverkehrs (ÖPNV) durch Maßnahmen zur Verbesserung der
  Fahrradmitnahme ist ein wichtiger Bestandteil der ganzheitlichen
  Radverkehrsförderung.
description: 'Die Förderung der Kombination aus Fahrrad und öffentlichem
  Personen-Nahverkehrs (ÖPNV) ist ein wichtiger Bestandteil der ganzheitlichen
  Radverkehrsförderung. Verschiedene Maßnahmen, welche die Kombination der
  beiden Verkehrsmittel oder die Mitnahme von Fahrrädern unterstützen, z. B.
  durch barrierefreie Zugänge und die Integration in das Tarifsystem, fördern
  umweltfreundliche und flexible Mobilität und verbessern die Überwindung weiter
  Distanzen. '
