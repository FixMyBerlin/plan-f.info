name: Fahrradparken
position: 315
topic: infrastruktur
shortDescription: Für den ruhenden Radverkehr braucht es ausreichend gute
  Abstellanlagen, damit Personen ihr Fahrrad geschützt vor Witterung und sicher
  vor Diebstahl abstellen können, denn dann sind Menschen eher bereit, mit dem
  Fahrrad unterwegs zu sein.
description: Für den ruhenden Radverkehr, dem Fahrradparken, braucht es gute
  Abstellanlagen, damit Personen ihr Fahrrad geschützt vor Witterung und sicher
  vor Diebstahl abstellen können. Wenn es genügend Abstellmöglichkeiten gibt,
  sind Menschen eher bereit, mit dem Fahrrad unterwegs zu sein. Kommunen müssen
  ausreichende und hochwertige Fahrradabstellanlagen sowohl in öffentlichen
  Räumen als auch an öffentlichen Einrichtungen schaffen. Durch die wachsende
  Zahl an Spezialfährrädern, wie z. B. Lastenrädern oder Fahrrädern mit
  Anhängern, sollten Kommunen auch dies im Blick bei der Errichtung von
  Abstellanlagen haben. Durch Stellplatzsatzungen können Kommunen auch direkt
  auf sichere Abstellanlagen an Wohngebäuden und am Arbeitsplatz einwirken.
