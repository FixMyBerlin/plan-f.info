name: Kommunalverwaltung als Vorbild
position: 442
topic: kommunikation-und-oeffentlichkeitsarbeit
shortDescription: Die Kommunalverwaltung sollte sich ihrer Vorbildfunktion
  bewusst sein und diese nutzen, um den Radverkehr zu fördern. Dazu gehören
  Maßnahmen wie die Etablierung einer Fahrradflotte und das Anbieten des
  Fahrradleasings (sofern möglich).
description: Die Kommunalverwaltung sollte sich ihrer Vorbildfunktion bewusst
  sein und diese nutzen, um den Radverkehr zu fördern. Dazu gehören Maßnahmen
  wie die Etablierung einer Fahrradflotte und das Anbieten des Fahrradleasings
  (sofern möglich). Kommunalverwaltungen können sich außerdem als
  Fahrradfreundlicher Arbeitgeber zertifizieren lassen und gehen so mit gutem
  Beispiel für andere Arbeitgebende voran.
