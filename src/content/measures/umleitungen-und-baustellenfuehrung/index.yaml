name: Umleitungen und Baustellenführung
position: 313
topic: infrastruktur
shortDescription: Bei Umleitungen und Baustellenführungen ist es wichtig, die
  Belange des Radverkehrs mitzudenken. Eine unzureichende Berücksichtigung
  beeinträchtigt häufig den Verkehrsfluss für Radfahrende und kann zu
  gefährlichen Situationen führen.
description: Bei Umleitungen und Baustellenführungen ist es wichtig, die Belange
  des Fuß- und Radverkehrs mitzudenken. Eine unzureichende Berücksichtigung
  beeinträchtigt häufig den Verkehrsfluss für Radfahrende und kann zu
  gefährlichen Situationen führen, wenn diese beispielsweise gemeinsam mit dem
  Fußverkehr geführt werden. Die Bereitstellung von sicheren Umleitungsrouten
  und gut sichtbaren Hinweisen für den Radverkehr ist deshalb wichtig.
