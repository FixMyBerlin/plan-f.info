name: Fahrradnetz
position: 331
topic: infrastruktur
shortDescription: Wichtige Merkmale für die Planung guter Fahrradnetze sind
  Komfort, Netzwerk, Direktheit, Sicherheit und Attraktivität.
description: Wichtige Merkmale für die Planung guter Fahrradnetze sind Komfort,
  Netzwerk, Direktheit, Sicherheit und Attraktivität. Ein Fahrradnetz besteht
  aus Radwegen, Fahrradstraßen und anderen Verkehrsanlagen, die darauf abzielen,
  die Sicherheit und Bequemlichkeit des Radverkehrs zu erhöhen und die
  Attraktivität des Radfahrens als Fortbewegungsmittel zu steigern. Die
  Wegweisung ist zudem ein zentraler Bestandteil eines guten Fahrradnetzes.
