name: Radverkehr in Schulen, Kinder- und Jugendclubs und Kindergärten
position: 221
topic: bildung-und-trainings
shortDescription: Die Mobilität im Kindes- und Jugendalter prägt das
  Mobilitätsverhalten auch als erwachsene Person, deswegen sind Maßnahmen in
  Schulen, Kinder- und Jugendclubs sowie Kindergärten besonders wichtig, um
  nachhaltige Mobilität früh zu fördern.
description: >-
  Abgestimmte Maßnahmen zum Radverkehr in Schulen, Kinder- und Jugendclubs sowie
  Kindergärten sind besonders wichtig, um nachhaltige Mobilität schon im jungen
  Alter zu fördern. Die Mobilität im Kindes- und Jugendalter prägt das
  Mobilitätsverhalten auch als erwachsene Person. 


  Verschiedene Maßnahmen, wie z. B. Mobilitätsbildung, Fahrradkurse,
  Fahrradflotten, Ausflüge und Aktionen oder Serviceangebote, machen Kinder mit
  dem Radfahren vertraut und schaffen Zugang auch für Kinder aus fahrradfernen
  Haushalten. Sie tragen dazu bei, die eigenständige, nachhaltige Mobilität der
  Kinder zu fördern. Außerdem erlernen Kinder, sicher und selbständig im
  Straßenverkehr zu agieren und erfahren, weshalb nachhaltige Mobilität wichtig
  ist. Radverkehr in Schulen, Kinder- und Jugendclubs sowie Kindergärten zu
  fördern ist ein wichtiger Baustein zur Etablierung einer Fahrradkultur.
