name: Beleuchtung
position: 311
topic: infrastruktur
shortDescription: Beleuchtung an Straßen und Radwegen erhöht die Sichtbarkeit
  bei schlechten Sichtverhältnissen und Dunkelheit und damit die Sicherheit von
  Radfahrenden. Es verbessert auch das subjektive Sicherheitsempfinden.
description: 'Beleuchtung an Straßen und Radwegen erhöht die Sichtbarkeit und
  damit die Sicherheit von Radfahrenden und verbessert auch das subjektive
  Sicherheitsempfinden. Ein gut durchdachtes Beleuchtungskonzept kann dazu
  beitragen, dass Radfahrende auch bei schlechten Sichtverhältnissen sicher und
  komfortabel unterwegs sind und sich auch bei Dunkelheit auf dem Fahrrad wohl
  fühlen. '
