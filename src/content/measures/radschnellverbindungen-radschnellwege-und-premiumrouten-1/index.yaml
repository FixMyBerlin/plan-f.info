name: Radschnellverbindungen, Radschnellwege und Premiumrouten
position: 337
topic: infrastruktur
shortDescription: Radschnellverbindungen, Radschnellwege und Premiumrouten sind
  spezielle Radwege, die besonders komfortable und schnelle Verbindungen für den
  Radverkehr bieten. Sie bieten in der Regel einen getrennten Fahrbahnbereich
  von der Straße.
description: Radschnellverbindungen, Radschnellwege und Premiumrouten sind
  spezielle Radwege, die besonders komfortable und schnelle Verbindungen für den
  Radverkehr bieten. Sie schaffen nach besonderen Qualitätsstandards ausgebaute
  und durchgängige Verbindungen, die den Radverkehr auf schnellen, direkten und
  sicheren Wegen führen. Radschnellverbindungen, Radschnellwege und
  Premiumrouten bieten in der Regel einen getrennten Fahrbereich von der
  Kfz-Fahrbahn.
