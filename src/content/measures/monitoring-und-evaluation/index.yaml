name: Monitoring und Evaluation
position: 114
topic: governance
shortDescription: Monitoring und Evaluation sind im Radverkehr ist wichtig, um
  die Wirksamkeit und Effektivität von Radverkehrsmaßnahmen zu überwachen und zu
  bewerten und Anpassungen vornehmen zu können und die Effektivität der
  Radverkehrsförderung zu verbessern.
description: >-
  Monitoring und Evaluation sind im Radverkehr wichtig, um die Wirksamkeit und
  Effektivität von Radverkehrsmaßnahmen zu überwachen und zu bewerten. Durch die
  Sammlung und Auswertung von Daten über die Nutzung des Radverkehrs, die
  Verkehrssicherheit und die Zufriedenheit der Radfahrenden kann man erkennen,
  welche Maßnahmen erfolgreich sind und welche Verbesserungen noch notwendig
  sind, um die Radverkehrsförderung an die tatsächlichen Bedürfnisse der
  Radfahrenden anzupassen.


  Monitoring ermöglicht es, die Entwicklung des Radverkehrs im Laufe der Zeit zu
  verfolgen und zu beurteilen, ob die angestrebten Ziele erreicht werden.
  Evaluation hingegen ermöglicht es, die Wirksamkeit von einzelnen Maßnahmen zu
  beurteilen und entscheiden, ob diese Maßnahmen beibehalten, geändert oder
  abgebrochen werden sollten.
