name: Verwaltung und Politik
position: 111
topic: governance
shortDescription: Verkehrspolitische und kommunalpolitische Zielsetzungen zur
  Radverkehrsförderung, Schaffung rechtlicher Grundlagen und Bereitstellung von
  Finanzmitteln, damit die Verwaltung agieren und den Radverkehr in den Kommunen
  effektiv fördern kann.
description: 'Verwaltung und Politik sind zentrale Stakeholder für die
  Radverkehrsförderung. Die Politik ist in der Verantwortung, rechtliche
  Grundlagen zu schaffen und Finanzierungen bereitzustellen, damit die
  Verwaltung agieren und den Radverkehr in den Kommunen effektiv fördern kann.
  Darüber hinaus sind verkehrspolitische und kommunalpolitische Zielsetzungen
  entscheidend sowie eine langfristig gedachte, nachhaltige Siedlungspolitik, um
  Zersiedelung und dessen negativen Effekten auf klimaschonende Mobilität
  entgegenzuwirken. Es braucht ausreichend Personal, Knowhow zu
  Radverkehrsthemen sowie effiziente Strukturen. '
