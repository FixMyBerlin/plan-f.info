name: Mobility Hubs an Wohnanlagen
position: 664
topic: multimodalitaet-und-nahmobilitaet
shortDescription: Kommunen sollten Mobility Hubs an Wohnanlagen fördern, um eine
  umweltfreundliche Mobilität zu ermöglichen und den Radverkehr zu stärken. Sie
  dienen der Aufbewahrung von Fahrrädern und ermöglichen die Vernetzung mit
  anderen Verkehrsmitteln.
description: Kommunen sollten Mobility Hubs an Wohnanlagen fördern, um eine
  umweltfreundliche Mobilität zu ermöglichen und den Radverkehr zu stärken.
  Mobility Hubs bieten Bewohner\*innen eine bequeme und sichere Möglichkeit, ihr
  Fahrrad aufzubewahren und ermöglichen die Vernetzung mit anderen
  Verkehrsmitteln wie öffentlichen Verkehrsmitteln oder Carsharing. So können
  Bewohner\*innen auch ohne eigenes Auto mobil sein.
