name: Reduzierung Kfz-Durchgangsverkehre
position: 991
topic: verkehrsberuhigung
shortDescription: Die Reduzierung des Kfz-Durchgangsverkehrs zielt darauf ab,
  den Verkehr auf bestimmten Straßen oder in bestimmten Stadtteilen zu
  verringern. Der Radverkehr wird dadurch sicherer und als komfortabler und
  entspannter wahrgenommen.
description: Die Reduzierung des Kfz-Durchgangsverkehrs zielt darauf ab, den
  Verkehr auf bestimmten Straßen oder in bestimmten Stadtteilen zu verringern.
  Durch die Verminderung des Kfz-Durchgangsverkehrs verringern sich die Anzahl
  von Begegnungs- und möglichen Konfliktfällen zwischen Kfz- und Radfahrenden.
  Der Radverkehr wird dadurch sicherer und als komfortabler und entspannter
  wahrgenommen. Eine Reduzierung des Kfz-Durchgangsverkehrs kann somit dazu
  beitragen, den Radverkehr attraktiver zu machen und damit den Umstieg vom Auto
  auf das Fahrrad zu erleichtern.
