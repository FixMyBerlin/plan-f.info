name: Parkraummanagement
position: 993
topic: verkehrsberuhigung
shortDescription: Parkraummanagement und eine Reduzierung der Anzahl von
  Kfz-Parkplätzen sind wichtig, um die Flächengerechtigkeit zu fördern und Platz
  für das Fahrrad zu schaffen.
description: Parkraummanagement und eine Reduzierung der Anzahl von
  Kfz-Parkplätzen sind wichtig, um die Aufteilung der Flächen stärker an den
  tatsächlichen Bedarfen der Verkehrsträger auszurichten sowie Platz für das
  Fahrrad zu schaffen. Durch die Umwidmung von Kfz-Parkplätzen können Kommunen
  den Radverkehr fördern, indem mehr Platz für Radverkehrsanlagen für den
  fließenden Verkehr sowie Abstellanlagen geschaffen wird. Regelmäßige
  Kontrollen von ordnungswidrigem Parken sind wichtig, um zu gewährleisten, dass
  Radverkehrsinfrastrukturen nicht durch Autos zugeparkt werden.
