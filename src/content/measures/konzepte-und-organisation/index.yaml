name: Konzepte und Organisation
position: 112
topic: governance
shortDescription: Gute Radverkehrsförderung braucht gute Konzepte und
  Organisation, dazu ist z. B. die Erstellung von Konzepten und Plänen sowie die
  interne Koordination und Organisation der Radverkehrsplanung und -förderung
  wichtig.
description: 'Gute Radverkehrsförderung braucht gute Konzepte und Organisation.
  Einerseits sind klassische Maßnahmen, wie die Erstellung von Konzepten und
  Plänen, z. B. Radverkehrskonzepte, sowie die interne Koordination und
  Organisation der Radverkehrsplanung und -förderung wichtig. In einigen
  Kommunen gibt es bereits Radverkehrsbeauftragte. Ein wichtiger Bestandteil der
  Planung ist auch die Sammlung und Auswertung von Daten, um die Bedürfnisse der
  Radfahrenden besser zu verstehen und die Effektivität der Maßnahmen zu
  bewerten. Andererseits können Kommunen soziale Projekte, welche einen
  wichtigen Beitrag zur Radverkehrsförderung leisten, unterstützen und soziales
  Engagement in diesem Bereich fördern. Nicht zuletzt ist die Teilnahme an
  Forschungs- oder Modellprojekten sinnvoll, um neue Ideen zu erproben und
  passgenaue Lösungen zu finden. '
