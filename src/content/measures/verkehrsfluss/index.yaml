name: Verkehrsfluss
position: 310
topic: infrastruktur
shortDescription: Maßnahmen zur Verbesserung des Verkehrsflusses für den
  Radverkehr können zur Erhöhung der Durchschnittsgeschwindigkeit beispielsweise
  durch die Verringerung von Wartezeiten an Ampeln beitragen und verbessern den
  Komfort für Radfahrende.
description: Maßnahmen zur Verbesserung des Verkehrsflusses für den Radverkehr
  können zur Erhöhung der Durchschnittsgeschwindigkeit beispielsweise durch die
  Verringerung von z. B. Wartezeiten an Ampeln (Anpassung von Signalplänen an
  LSA) und Einrichtung von Grünen Wellen beitragen und verbessern den Komfort
  für Radfahrende.
