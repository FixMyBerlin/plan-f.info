name: Geschwindigkeitsreduzierung
position: 992
topic: verkehrsberuhigung
shortDescription: Geschwindigkeitsreduzierungen zielen darauf ab, die
  Verkehrssicherheit generell zu erhöhen und können die Fahrradmobilität
  fördern. Zusätzlich wird durch weniger Abgase und Lärm das Radfahren
  angenehmer gestaltet.
description: Geschwindigkeitsreduzierungen erhöhen die Verkehrssicherheit, da
  Unfälle durch niedrigere Geschwindigkeiten vermieden werden und die
  Unfallschwere sinkt. Durch eine Reduzierung der Geschwindigkeit von
  Kraftfahrzeugen auf bestimmten Straßenabschnitten oder in ganzen Wohnvierteln
  können Radfahrende sicherer und bequemer unterwegs sein. Gleichzeitig sinken
  Abgasemissionen, Feinstaub- und Lärmbelastung. Städte gewinnen dadurch an
  Aufenthaltsqualität und fördern die Gesundheit der Bürger\*innen.
