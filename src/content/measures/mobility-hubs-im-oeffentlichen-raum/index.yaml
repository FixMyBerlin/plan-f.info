name: Mobility Hubs im öffentlichen Raum
position: 663
topic: multimodalitaet-und-nahmobilitaet
shortDescription: Mobility Hubs im öffentlichen Raum vernetzen verschiedene
  Verkehrsmittel wie Bus, Bahn, Fahrrad und Carsharing miteinander. Sie können
  eine sichere Aufbewahrung von Fahrrädern, Leihrädern und Ladestationen für
  E-Bikes bereitstellen.
description: Mobility Hubs sind zentrale Orte, an denen verschiedene
  Verkehrsmittel wie Bus, Bahn, Fahrrad und Carsharing miteinander vernetzt
  werden. Mobility Hubs im öffentlichen Raum leisten einen wichtigen Beitrag zur
  kommunalen Radverkehrsförderung, indem sie eine sichere Aufbewahrung von
  Fahrrädern, Leihrädern und Ladestationen für E-Bikes bereitstellen und die
  Multimodalität und damit auch die Überwindung weiter Distanzen mit
  nachhaltigen Verkehrsmitteln fördern.
