shortDescription: Die Förderung von Bike und Ride Anlagen ist wichtig, um eine
  umweltfreundliche Mobilität auch auf weiteren Distanzen zu ermöglichen. Dazu
  gehören beispielsweise sichere Fahrradabstellanlagen und
  Aufbewahrungsmöglichkeiten an Bahnhöfen.
description: Die Förderung von Bike und Ride-Anlagen ist wichtig, um eine
  umweltfreundliche Mobilität auch auf weiteren Distanzen zu ermöglichen. Das
  Fahrrad bietet sich häufig als flexibler Zubringer zu öffentlichen
  Verkehrsmitteln an. Um die Nutzung zu fördern, sind beispielsweise sichere
  Fahrradabstellanlagen und Aufbewahrungsmöglichkeiten an Bahnhöfen wichtig.
  Auch können Fahrradverleihsysteme an Bahnhöfen die Multimodalität fördern.
