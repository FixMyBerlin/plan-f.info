description: Fahrradverleihsysteme (Bike-Sharing) erhöhen den Zugang zur
  Fahrradmobilität und verbessern die Möglichkeit der Fahrradnutzung im Alltag.
  Sie sind häufig eine kostengünstige Alternative zu anderen Verkehrsmitteln und
  ermöglichen die Nutzung des Fahrrads auch für Personen, welche kein
  (entsprechendes) Fahrrad besitzen oder ihres nicht bei sich führen. Ein
  (elektrisches) Lastenrad-Sharing ermöglicht es, auch größere Lasten bequem per
  Fahrrad zu transportieren. Generell adressiert ein E-Bike-Verleihsystemneue
  Zielgruppe und förderte andere Einsatzzwecke. Kommunen können
  Fahrradverleihsysteme auf unterschiedliche Weise fördern, indem sie z. B.
  diese finanziell unterstützen, sie bewerben und Flächen zur Verfügung stellen.
  Es ist zu empfehlen, die Systeme in den Kommunen zu regulieren.
