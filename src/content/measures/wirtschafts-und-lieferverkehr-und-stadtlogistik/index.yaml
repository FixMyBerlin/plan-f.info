name: Wirtschafts- und Lieferverkehr und Stadtlogistik
position: 771
topic: wirtschaft
shortDescription: Es gibt verschiedene Lösungen für den Wirtschafts- und
  Lieferverkehr per Fahrrad. Hierbei können z. B. Lastenfahrräder oder
  Fahrradanhänger zum Einsatz kommen. Die Kommune hat unterschiedliche
  Möglichkeiten die Stadtlogistik per Fahrrad zu fördern.
description: Die Nutzung von Fahrrädern als Transportmittel für den Transport
  von Waren und Gütern innerhalb einer Stadt oder eines Stadtgebietes hat stark
  zugenommen. Es gibt inzwischen verschiedene Lösungen für den Wirtschafts- und
  Lieferverkehr per Fahrrad. Hierbei können z. B. Lastenfahrräder oder
  Fahrradanhänger zum Einsatz kommen. Die Kommune hat unterschiedliche
  Möglichkeiten die Stadtlogistik per Fahrrad zu fördern, z. B. in dem sie
  Stellflächen zur Verfügung stellt und dies aktiv anbietet und unterstützt.
