name: Karten
position: 553
topic: services
shortDescription: Karten helfen insbesondere nicht ortskundigen sich zu
  orientieren und Radwege bequem zu planen. Neben dem Radwegenetz können auch
  weitere hilfreiche Informationen zu radverkehrsbezogenen Serviceangeboten
  abgebildet werden.
description: Auf Karten können neben dem Radwegenetz auch weitere hilfreiche
  Informationen zu radverkehrsbezogenen Serviceangeboten abgebildet werden, wie
  beispielsweise Toiletten, Unterständen, Lade- oder Reparaturstationen. Karten
  helfen insbesondere nicht ortskundigen Personen, wie Besucher\*innen oder
  Neubürger\*innen, sich zu orientieren und ihre Radwege bequem zu planen. Diese
  sollten klassisch (hardcopy) und digital zur Verfügung gestellt werden. Zudem
  können digitale Radroutenplaner zur Navigation angeboten werden.
