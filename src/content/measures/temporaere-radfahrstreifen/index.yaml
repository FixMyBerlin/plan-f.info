name: Temporäre Radfahrstreifen
position: 339
topic: infrastruktur
shortDescription: Temporäre Radfahrstreifen, auch als Pop-Up-Radwege bekannt,
  sind temporäre Fahrradwege, die schnell und kostengünstig eingerichtet werden
  können und in der Regel auf bestehenden Straßen oder Kfz-Fahrspuren angelegt
  werden.
description: Temporäre Radfahrstreifen, auch als Pop-Up-Radwege bekannt, sind
  temporäre Fahrradwege, die schnell und kostengünstig eingerichtet werden
  können. Sie werden in der Regel auf bestehenden Straßen oder Kfz-Fahrspuren
  angelegt und bieten durch die Trennung vom Kfz-Verkehr eine sichere Verbindung
  für Radfahrende, insbesondere in städtischen Gebieten. Sie sind eine einfache
  und flexible Möglichkeit, den Radverkehr zu verbessern und können bei Bedarf
  verstetigt, verändert oder wieder entfernt werden.
