topic: tourismus-und-freizeit
shortDescription: (Selbst-)geführte Fahrradtouren ermöglichen einen einfachen
  Einstieg in die Fahrradmobilität und können auf interessanten und
  abwechslungsreichen Strecken geplant werden und auch lokale Sehenswürdigkeiten
  oder kulturelle Angebote mit einbeziehen.
description: "(Selbst-)geführte Fahrradtouren ermöglichen einen einfachen
  Einstieg in die Fahrradmobilität und sind sowohl für Einheimische als auch für
  Tourist\\*innen attraktiv. Die Touren können auf interessanten und
  abwechslungsreichen Strecken geplant werden und auch lokale Sehenswürdigkeiten
  oder kulturelle Angebote mit einbeziehen, um ein rundum interessantes Erlebnis
  zu bieten. Geführte Touren können zudem auch dazu beitragen,
  Sicherheitsbedenken oder Unsicherheiten bei ungeübten Radfahrerenden abzubauen
  und ihnen die Vorteile des Radfahrens zu vermitteln. "
