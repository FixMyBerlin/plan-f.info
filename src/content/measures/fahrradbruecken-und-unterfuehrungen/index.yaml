name: Fahrradbrücken und Unterführungen
position: 338
topic: infrastruktur
shortDescription: Fahrradbrücken sind speziell für den Radverkehr konzipiert
  sind und ermöglichen eine sichere und schnelle Überquerung von Hindernissen.
  Auch Unterführungen schaffen die Möglichkeit z. B. große Kreuzungen sicher und
  komfortabel zu umgehen.
description: Fahrradbrücken sind Brücken, die speziell für den Fuß- und
  Radverkehr konzipiert sind und eine sichere und schnelle Überquerung von
  Hindernissen wie Flüssen, Autobahnen oder Bahnstrecken ermöglichen.
  Unterführungen schaffen zudem die Möglichkeit große Kreuzungen sicher und
  komfortabel zu umgehen.
