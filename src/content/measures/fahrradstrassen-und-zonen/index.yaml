name: Fahrradstraßen und -zonen
position: 332
topic: infrastruktur
shortDescription: In Fahrradstraßen und Fahrradzonen haben Radfahrende Vorrang.
  Das bedeutet, sie dürfen nebeneinander fahren und der Kfz-Verkehr muss sich
  der Geschwindigkeit der Radfahrenden anpassen.
description: 'Fahrradstraßen sind Straßen, auf denen Radfahrende Vorrang haben.
  Das bedeutet, sie dürfen nebeneinander fahren und der Kfz-Verkehr muss sich
  der Geschwindigkeit der Radfahrenden anpassen. Fahrradzonen sind Abschnitte
  von mehreren Straßen, auf denen der Radverkehr, ähnlich wie in den
  Fahrradstraßen bevorzugt und Kfz-Verkehr begrenzt wird. In Fahrradstraßen und
  Fahrradzonen ist der Kfz-Verkehr häufig ausschließlich als Anliegerverkehr
  zugelassen. Es sollten Maßnahmen ergriffen werden, um die Durchgangsverkehre
  zu reduzieren, wie z. B. Einbahnstraßen, Poller oder Diagonalsperren. '
