name: Anreize für den Umstieg im Urlaub
position: 883
topic: tourismus-und-freizeit
shortDescription: Kommunen können Anreize für den Umstieg auf Fahrrad im Urlaub
  schaffen, indem sie z. B. verschiedene Angebote schaffen, Informationen zum
  Radverkehr bereitstellen oder Aktionen durchführen, welche Personen zum
  Radfahren motivieren.
